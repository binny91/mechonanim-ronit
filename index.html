:root{--blue:#2f6fde;--blue-l:#e8f0fd;--green:#1f9d55;--green-l:#e3f6ea;--red:#d64045;--red-l:#fde8e8;--orange:#e08a00;--orange-l:#fff3dc;--ink:#1f2633;--muted:#667085;--line:#e3e7ee;--bg:#f6f8fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'AlefE','Alef','Arial Hebrew',Arial,sans-serif;font-size:20px;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:40px;margin:6px 0 2px} h2{font-size:28px;margin:18px 0 10px} h3{font-size:24px;margin:12px 0 6px}
.muted{color:var(--muted)} .small{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:22px;font-weight:700}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.sm{min-height:44px;font-size:18px;padding:6px 14px;border-radius:12px}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{background:var(--blue-l);border-radius:16px;padding:10px 16px;font-size:20px}
.count b{font-size:28px;color:var(--blue)}
.today{border-color:var(--blue);background:linear-gradient(0deg,#fff,var(--blue-l));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.today .t{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:right;min-height:150px}
.tcard .name{font-size:26px;font-weight:700}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:17px;font-weight:700}
.b-new{background:#eef1f5;color:var(--muted)} .b-prog{background:var(--orange-l);color:#9a5b00} .b-done{background:var(--green-l);color:var(--green)}
.lv{font-size:16px;color:var(--muted)}
.bar{height:12px;background:#eef1f5;border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:var(--orange);border-radius:99px}
.tcard.done .bar>i{background:var(--green)}
.tcard .open{position:absolute;inset:0;border-radius:20px}
.tcard .reset{position:absolute;top:10px;left:10px;z-index:2;width:44px;height:44px;border-radius:12px;color:var(--muted);font-size:22px;border:2px solid var(--line);background:#fff}
.tcard.print{border-style:dashed}
.foot{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 40px}
/* quiz */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0 10px;flex-wrap:wrap}
.top .part{font-size:22px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.timer.over{border-color:var(--orange);color:#9a5b00}
.qlayout{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.qlayout.mlay{grid-template-columns:minmax(0,780px)!important;justify-content:center}
@media (max-width:900px),(orientation:portrait){.qlayout{grid-template-columns:1fr}.passage{max-height:44vh}}
.passage{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px 18px;overflow:auto;max-height:calc(100vh - 190px);-webkit-overflow-scrolling:touch}
.passage h3{text-align:center;font-size:28px;margin:4px 0 12px}
.pline{display:flex;gap:12px;font-size:25px;line-height:1.95;margin-bottom:8px}
.pline .ln{flex:0 0 28px;color:#9aa3b2;font-size:16px;text-align:center;padding-top:6px}
.qbox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px}
.qnum{color:var(--muted);font-size:18px}
.instr{font-size:20px;color:#3d4757;line-height:1.8;margin-bottom:10px}
.qtext{font-size:27px;line-height:1.9;font-weight:700;margin:4px 0 14px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:24px;line-height:1.7;text-align:right;width:100%}
.opt .L{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef1f5;font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--red-l)} .opt.wrong .L{background:var(--red);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-l)} .opt.right .L{background:var(--green);color:#fff}
.opt:disabled{cursor:default}
.opt .mk{margin-inline-start:auto;font-size:28px}
.math{direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:44px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.mathline{text-align:center;margin:18px 0}
.slot{display:inline-block;min-width:110px;border-bottom:4px solid var(--blue);text-align:center;color:var(--blue);margin:0 6px}
.slot.wrong{border-color:var(--red);color:var(--red)} .slot.right{border-color:var(--green);color:var(--green)}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:12px auto 0}
.keypad button{min-height:66px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:30px;font-weight:700}
.keypad .ok{background:var(--blue);color:#fff;border-color:var(--blue);font-size:24px}
.keypad .del{font-size:22px}
.pic{direction:ltr;display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0}
.pic .eq{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:700}
.pic svg{width:52px;height:52px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:23px;line-height:1.8;display:none}
.fb.show{display:block}
.fb.good{background:var(--green-l);border:2px solid var(--green)} .fb.bad{background:var(--red-l);border:2px solid var(--red)} .fb.rev{background:var(--orange-l);border:2px solid var(--orange)}
.fb .big{font-size:28px;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0 8px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 30px;align-items:center}
.dot{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:16px;font-weight:700;color:var(--muted)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.fix{background:var(--orange);border-color:var(--orange);color:#fff}
.dot.cur{outline:3px solid var(--blue);outline-offset:2px}
.dsep{width:2px;height:30px;background:var(--line);margin:0 6px}
.banner{background:var(--orange-l);border:2px solid var(--orange);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:20px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.center{text-align:center}
.score{font-size:64px;font-weight:700;color:var(--green)}
.stars{font-size:48px}
.list .item{border-bottom:2px solid var(--line);padding:14px 0}
.tag{display:inline-block;background:#eef1f5;border-radius:8px;padding:2px 8px;font-size:15px;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:#fff} th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:right;font-size:18px} th{color:var(--muted);font-weight:700}
.cbar{display:flex;align-items:end;gap:8px;height:180px;padding:10px;background:#fff;border:2px solid var(--line);border-radius:16px;overflow-x:auto}
.cbar .c{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;font-size:13px;color:var(--muted)}
.cbar .c i{display:block;width:26px;background:var(--blue);border-radius:6px 6px 0 0}
.modal{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:520px;width:100%}
.inp{font-family:inherit;font-size:24px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);width:120px;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
ul.tips li{margin:8px 0;line-height:1.8;font-size:22px}
@media print{.noprint{display:none}}
</style>

<script>
const DATA = {"tests":[{"n":1,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַדְּבוֹרִים בַּכַּוֶּרֶת","lines":["הַדְּבוֹרִים חַיּוֹת יַחַד בַּכַּוֶּרֶת. בַּכַּוֶּרֶת אַחַת יְכוֹלוֹת לָגוּר אַלְפֵי דְּבוֹרִים.","לְכָל דְּבוֹרָה בַּכַּוֶּרֶת יֵשׁ תַּפְקִיד. יֵשׁ דְּבוֹרִים שֶׁמְּנַקּוֹת אֶת הַכַּוֶּרֶת,","וְיֵשׁ דְּבוֹרִים שֶׁשּׁוֹמְרוֹת עַל הַפֶּתַח מִפְּנֵי אוֹיְבִים.","הַדְּבוֹרִים הַפּוֹעֲלוֹת עָפוֹת מִפֶּרַח לְפֶרַח וְאוֹסְפוֹת צוּף.","מֵהַצּוּף הֵן מְכִינוֹת דְּבַשׁ, שֶׁהוּא הַמָּזוֹן שֶׁל הַדְּבוֹרִים בַּחֹרֶף.","כְּשֶׁדְּבוֹרָה מוֹצֵאת שָׂדֶה מָלֵא פְּרָחִים, הִיא חוֹזֶרֶת לַכַּוֶּרֶת וְ\"רוֹקֶדֶת\".","הָרִקּוּד מַרְאֶה לַחֲבֵרוֹת שֶׁלָּהּ לְאָן לָעוּף כְּדֵי לִמְצֹא אֶת הַפְּרָחִים."]},{"kind":"story","title":"הָעֲפִיפוֹן שֶׁל נֹגַהּ","lines":["בְּיוֹם שִׁשִּׁי בַּבֹּקֶר נֹגַהּ וְסַבָּא יָצְאוּ לַגִּבְעָה לְיַד הַבַּיִת.","בַּיָּדַיִם שֶׁל נֹגַהּ הָיָה עֲפִיפוֹן אָדֹם חָדָשׁ, עִם זָנָב אָרֹךְ וְצִבְעוֹנִי.","\"הַיּוֹם יֵשׁ רוּחַ חֲזָקָה,\" אָמַר סַבָּא, \"זֶה יוֹם מְצֻיָּן לַעֲפִיפוֹנִים.\"","נֹגַהּ רָצָה מַהֵר, וְהָעֲפִיפוֹן עָלָה לְמַעְלָה, עַד שֶׁנִּרְאָה קָטָן כְּמוֹ צִפּוֹר.","פִּתְאוֹם הִגִּיעַ מַשַּׁב רוּחַ חָזָק, וְהַחוּט נִקְרַע מֵהַיָּד שֶׁל נֹגַהּ.","הָעֲפִיפוֹן עָף רָחוֹק וְנִתְקָע בֵּין הָעֲנָפִים שֶׁל עֵץ אֹרֶן גָּבוֹהַּ.","נֹגַהּ הִתְחִילָה לִבְכּוֹת. \"הָעֲפִיפוֹן הֶחָדָשׁ שֶׁלִּי הָלַךְ,\" אָמְרָה בְּשֶׁקֶט.","סַבָּא חִבֵּק אוֹתָהּ וְאָמַר: \"בּוֹאִי נַחֲשֹׁב יַחַד מָה אֶפְשָׁר לַעֲשׂוֹת.\"","הֵם הָלְכוּ אֶל הַשָּׁכֵן, יוֹסִי, שֶׁהָיָה לוֹ סֻלָּם אָרֹךְ.","יוֹסִי טִפֵּס עַל הַסֻּלָּם וְהוֹרִיד אֶת הָעֲפִיפוֹן בִּזְהִירוּת.","בַּדֶּרֶךְ הַבַּיְתָה נֹגַהּ קָשְׁרָה אֶת הַחוּט חָזָק לְפֶרֶק כַּף הַיָּד שֶׁלָּהּ.","\"עַכְשָׁו הוּא לֹא יִבְרַח לִי,\" אָמְרָה וְחִיְּכָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה הַדְּבוֹרִים מְכִינוֹת מֵהַצּוּף?","options":["שַׁעֲוָה","פְּרָחִים","כַּוֶּרֶת","דְּבַשׁ"],"answer":3,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"מֵהַצּוּף הֵן מְכִינוֹת דְּבַשׁ\"."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"הַפּוֹעֲלוֹת\" (שׁוּרָה 4)?","options":["הַיְּשָׁנוֹת","הָעֻבְדּוֹת","הַקְּטַנּוֹת","הַחוֹלוֹת"],"answer":1,"exp":"הַדְּבוֹרִים הַפּוֹעֲלוֹת עָפוֹת וְאוֹסְפוֹת צוּף, כְּלוֹמַר הֵן עוֹבְדוֹת."},{"id":"r3","sec":"read","p":0,"tag":"d","type":"mc","q":"לָמָּה הַדְּבוֹרִים צְרִיכוֹת דְּבַשׁ?","options":["כְּדֵי לְגָרֵשׁ אוֹיְבִים","כְּדֵי לִרְקֹד","כְּדֵי לִבְנוֹת אֶת הַכַּוֶּרֶת","כְּדֵי שֶׁיִּהְיֶה לָהֶן מָזוֹן בַּחֹרֶף"],"answer":3,"exp":"בְּשׁוּרָה 5 כָּתוּב שֶׁהַדְּבַשׁ הוּא הַמָּזוֹן שֶׁל הַדְּבוֹרִים בַּחֹרֶף."},{"id":"r4","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַדְּבוֹרָה \"רוֹקֶדֶת\" (שׁוּרוֹת 6–7)?","options":["כִּי הִיא עֲיֵפָה אַחֲרֵי שֶׁעָפָה","כְּדֵי לִשְׁמֹר עַל הַפֶּתַח שֶׁל הַכַּוֶּרֶת","כִּי הִיא שְׂמֵחָה שֶׁהִגִּיעַ הַחֹרֶף","כְּדֵי לְהַרְאוֹת לַחֲבֵרוֹת שֶׁלָּהּ אֵיפֹה יֵשׁ פְּרָחִים"],"answer":3,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁהָרִקּוּד מַרְאֶה לַחֲבָרוֹת לְאָן לָעוּף כְּדֵי לִמְצֹא פְּרָחִים."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["אֵיפֹה גָּרוֹת הַדְּבוֹרִים?","כַּמָּה זְמַן חַיָּה דְּבוֹרָה?","מָה הַדְּבוֹרִים אוֹסְפוֹת מֵהַפְּרָחִים?","מָה עוֹשׂוֹת הַדְּבוֹרִים הַשּׁוֹמְרוֹת?"],"answer":1,"exp":"הַקֶּטַע מְסַפֵּר אֵיפֹה הַדְּבוֹרִים גָּרוֹת, מָה הֵן אוֹסְפוֹת וּמָה עוֹשׂוֹת הַשּׁוֹמְרוֹת, אֲבָל לֹא כַּמָּה זְמַן דְּבוֹרָה חַיָּה."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מִי יָצָא עִם נֹגַהּ לַגִּבְעָה?","options":["אִמָּא","יוֹסִי הַשָּׁכֵן","סַבָּא","חֲבֵרָה מֵהַכִּתָּה"],"answer":2,"exp":"בְּשׁוּרָה 1 כָּתוּב: \"נֹגַהּ וְסַבָּא יָצְאוּ לַגִּבְעָה\"."},{"id":"r7","sec":"read","p":1,"tag":"d","type":"mc","q":"לָמָּה סַבָּא אָמַר שֶׁזֶּה יוֹם מְצֻיָּן לַעֲפִיפוֹנִים?","options":["כִּי הָעֲפִיפוֹן חָדָשׁ","כִּי יֵשׁ רוּחַ חֲזָקָה","כִּי הַשָּׁמַיִם כְּחֻלִּים","כִּי זֶה יוֹם שִׁשִּׁי"],"answer":1,"exp":"בְּשׁוּרָה 3 סַבָּא אוֹמֵר: \"הַיּוֹם יֵשׁ רוּחַ חֲזָקָה\"."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נִתְקַע\" (שׁוּרָה 6)?","options":["נִתְפָּס וְלֹא יָכוֹל לָזוּז","עָף גָּבוֹהַּ יוֹתֵר","נִשְׁבַּר לַחֲתִיכוֹת","נָפַל עַל הָאֲדָמָה"],"answer":0,"exp":"הָעֲפִיפוֹן נִתְקַע בֵּין הָעֲנָפִים, כְּלוֹמַר נִתְפַּס שָׁם וְלֹא יָכוֹל הָיָה לָזוּז."},{"id":"r9","sec":"read","p":1,"tag":"i","type":"mc","q":"אֵיךְ הִרְגִּישָׁה נֹגַהּ כְּשֶׁהָעֲפִיפוֹן עָף רָחוֹק?","options":["עֲצוּבָה","גֵּאֶה","שִׂמְחָה","רְגוּעָה"],"answer":0,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁנֹּגַהּ הִתְחִילָה לִבְכּוֹת, כִּי הִיא הָיְתָה עֲצוּבָה."},{"id":"r10","sec":"read","p":1,"tag":"s","type":"mc","q":"מָה קָרָה אַחֲרֵי שֶׁסַּבָּא חִבֵּק אֶת נֹגַהּ?","options":["הָעֲפִיפוֹן עָלָה לְמַעְלָה","נֹגַהּ רָצָה מַהֵר","הֵם הָלְכוּ אֶל הַשָּׁכֵן יוֹסִי","הַחוּט נִקְרַע"],"answer":2,"exp":"בְּשׁוּרוֹת 8–9: סַבָּא חִבֵּק אוֹתָהּ, וְאַחַר כָּךְ הֵם הָלְכוּ אֶל הַשָּׁכֵן יוֹסִי."},{"id":"r11","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמִי נֹגַהּ מִתְכַּוֶּנֶת כְּשֶׁהִיא אוֹמֶרֶת \"הוּא לֹא יִבְרַח לִי\" (שׁוּרָה 12)?","options":["לַעֲפִיפוֹן","לַסֻּלָּם","לְיוֹסִי","לְסַבָּא"],"answer":0,"exp":"נֹגַהּ קָשְׁרָה אֶת הַחוּט שֶׁל הָעֲפִיפוֹן, כְּדֵי שֶׁהָעֲפִיפוֹן לֹא יִבְרַח שׁוּב."},{"id":"r12","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה נֹגַהּ קָשְׁרָה אֶת הַחוּט לְפֶרֶק כַּף הַיָּד שֶׁלָּהּ?","options":["כִּי הָיָה לָהּ קַר בַּיָּד","כְּדֵי לְהַחֲזִיר אֶת הָעֲפִיפוֹן לְיוֹסִי","כְּדֵי שֶׁהָעֲפִיפוֹן לֹא יָעוּף מִמֶּנָּה שׁוּב","כְּדֵי לְתַקֵּן אֶת הַזָּנָב"],"answer":2,"exp":"הַחוּט נִקְרַע מֵהַיָּד שֶׁלָּהּ קֹדֶם, וְלָכֵן הִיא קָשְׁרָה אוֹתוֹ חָזָק – כְּדֵי שֶׁהָעֲפִיפוֹן לֹא יִבְרַח."},{"type":"open","tag":"calc","expr":"40 + 19 = ___","answer":59,"exp":"⁦40 + 19 = 59⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"68 − 18 = ___","answer":50,"exp":"⁦68 − 18 = 50⁩. בְּדִיקָה: ⁦50 + 18 = 68⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"8 × 3 = ___","answer":24,"exp":"⁦8 × 3 = 24⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"27 : 3 = ___","answer":9,"exp":"⁦27 : 3 = 9⁩, כִּי ⁦3 × 9 = 27⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 16 = 38","answer":22,"exp":"⁦38 − 16 = 22⁩, וְלָכֵן ⁦22 + 16 = 38⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"63 − ___ = 41","answer":22,"exp":"⁦63 − 41 = 22⁩, וְלָכֵן ⁦63 − 22 = 41⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"5 × ___ = 20","answer":4,"exp":"⁦5 × 4 = 20⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"47 − 16 > 47 − ___","min":17,"max":47,"exp":"כְּשֶׁמּוֹרִידִים יוֹתֵר, נִשְׁאַר פָּחוֹת. צָרִיךְ לְהוֹרִיד יוֹתֵר מ־16, לְמָשָׁל 17.","answer":17,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ = 24","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 8 + 8 + 8 = 24⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + 7 = 15","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 4: 4 + 4 + 7 = 15⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["star","star"],6],[["star","square"],9]],"ask":["square"]},"options":["5","6","7","8"],"answer":1,"exp":"שְׁנֵי כּוֹכָבִים = 6, אָז כּוֹכָב = 3. כּוֹכָב + רִבּוּעַ = 9, אָז רִבּוּעַ = ⁦9 − 3 = 6⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"יוֹנָתָן קָטַף 12 תּוּתִים וְחִלֵּק אוֹתָם שָׁוֶה בְּשָׁוֶה בֵּין 2 חֲבֵרִים. כַּמָּה תּוּתִים קִבֵּל כָּל חָבֵר?","options":["6","8","10","12"],"answer":0,"exp":"⁦12 : 2 = 6⁩, כִּי ⁦2 × 6 = 12⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בָּאוֹטוֹבּוּס הָיוּ 33 נוֹסְעִים. בַּתַּחֲנָה יָרְדוּ 6 נוֹסְעִים וְעָלוּ 11 נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?","options":["16","27","38","50"],"answer":2,"exp":"⁦33 − 6 = 27⁩, וְאָז ⁦27 + 11 = 38⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּסֵּפֶר יֵשׁ 60 עַמּוּדִים. אַלּוֹן קָרָא 18 עַמּוּדִים בְּיוֹם רִאשׁוֹן, ו־19 עַמּוּדִים בְּיוֹם שֵׁנִי. כַּמָּה עַמּוּדִים נִשְׁאֲרוּ לוֹ לִקְרֹא?","options":["23","33","37","42"],"answer":0,"exp":"⁦18 + 19 = 37⁩ עַמּוּדִים נִקְרְאוּ. ⁦60 − 37 = 23⁩.","id":"m14","sec":"math"}]},{"n":2,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַגָּמָל","lines":["הַגָּמָל חַי בַּמִּדְבָּר, מָקוֹם חַם וְיָבֵשׁ שֶׁיֵּשׁ בּוֹ מְעַט מְאוֹד מַיִם.","עַל הַגַּב שֶׁל הַגָּמָל יֵשׁ דִּבְשַׁת. אֲנָשִׁים רַבִּים חוֹשְׁבִים שֶׁיֵּשׁ בָּהּ מַיִם,","אֲבָל זֶה לֹא נָכוֹן: בְּדִבְשַׁת יֵשׁ שֻׁמָּן.","כְּשֶׁאֵין לַגָּמָל אֹכֶל, הַגּוּף שֶׁלּוֹ מִשְׁתַּמֵּשׁ בַּשֻּׁמָּן הַזֶּה.","הַגָּמָל יָכוֹל לָלֶכֶת כַּמָּה יָמִים בְּלִי לִשְׁתּוֹת בִּכְלָל.","כְּשֶׁהוּא מוֹצָא מַיִם, הוּא שׁוֹתֶה הַרְבֵּה מְאוֹד בְּבַת אַחַת.","לַגָּמָל יֵשׁ רִיסִים אֲרֻכִּים שֶׁשּׁוֹמְרִים עַל הָעֵינַיִם שֶׁלּוֹ מִפְּנֵי הַחוֹל."]},{"kind":"story","title":"הַשֶּׁמֶשׁ שֶׁל מַאיָה","lines":["בַּכִּתָּה שֶׁל מַאיָה הֵכִינוּ הַצָּגָה לַחַג.","הַמּוֹרָה נָתְנָה לְמַאיָה תַּפְקִיד חָשׁוּב: לִהְיוֹת הַשֶּׁמֶשׁ.","מַאיָה שְׂמֵחָה, אֲבָל בַּלֵּב שֶׁלָּהּ הָיָה גַּם קְצָת פַּחַד.","\"מָה יִקְרֶה אִם אֶשְׁכַּח אֶת הַמִּלִּים?\" שָׁאֲלָה אֶת אָחִיהָ הַגָּדוֹל, עֹמֶר.","\"בּוֹאִי נִתְאַמֵּן,\" הִצִּיעַ עֹמֶר. \"כָּל עֶרֶב תַּגִּידִי לִי אֶת הַמִּשְׁפָּטִים שֶׁלָּךְ.\"","כָּל עֶרֶב, לִפְנֵי הַשֵּׁנָה, מַאיָה עָמְדָה מוּל עֹמֶר וְדִקְלְמָה.","בַּהַתְחָלָה הִיא הִתְבַּלְבְּלָה, אֲבָל אַחֲרֵי כַּמָּה יָמִים כְּבָר יָדְעָה הַכֹּל בְּעַל פֶּה.","בְּיוֹם הַהַצָּגָה הָאוּלָם הָיָה מָלֵא הוֹרִים.","הַבִּרְכַּיִם שֶׁל מַאיָה רָעֲדוּ כְּשֶׁעָלְתָה לַבָּמָה.","הִיא הִסְתַּכְּלָה עַל הַקָּהָל וְרָאֲתָה אֶת עֹמֶר בְּשׁוּרָה הָרִאשׁוֹנָה. הוּא חִיֵּךְ אֵלֶיהָ.","מַאיָה נָשְׁמָה עָמֹק, וְאָמְרָה אֶת כָּל הַמִּשְׁפָּטִים בְּקוֹל רָם וּבָרוּר.","בַּסּוֹף כֻּלָּם מָחֲאוּ כַּפַּיִם, וּמַאיָה הִרְגִּישָׁה שֶׁהִיא בֶּאֱמֶת זוֹרַחַת כְּמוֹ שֶׁמֶשׁ."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה יֵשׁ בְּדִבְשַׁת שֶׁל הַגָּמָל?","options":["אֲוִיר","מַיִם","שֻׁמָּן","חוֹל"],"answer":2,"exp":"בְּשׁוּרָה 3 כָּתוּב: \"בְּדִבְשַׁת יֵשׁ שֻׁמָּן\"."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"מְעַט\" (שׁוּרָה 1)?","options":["קְצָת","תָּמִיד","חַם","הַרְבֵּה"],"answer":0,"exp":"\"מְעַט מְאוֹד מַיִם\" פֵּרוּשׁוֹ קְצָת מְאוֹד מַיִם."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 3 \"זֶה לֹא נָכוֹן\"?","options":["כְּדֵי לְהַגִּיד שֶׁהַגָּמָל לֹא חַי בַּמִּדְבָּר","כְּדֵי לְהַגִּיד שֶׁהַגָּמָל לֹא שׁוֹתֶה אַף פַּעַם","כְּדֵי לְהַגִּיד שֶׁלַּגָּמָל אֵין דִּבְשַׁת","כְּדֵי לְהַסְבִּיר שֶׁבְּדִבְשַׁת אֵין מַיִם, לַמְרוֹת שֶׁאֲנָשִׁים חוֹשְׁבִים כָּךְ"],"answer":3,"exp":"אֲנָשִׁים חוֹשְׁבִים שֶׁיֵּשׁ מַיִם בְּדִבְשַׁת, וְהַקֶּטַע מְתַקֵּן: זֶה לֹא נָכוֹן, יֵשׁ בָּהּ שֻׁמָּן."},{"id":"r4","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה שׁוֹמֵר עַל הָעֵינַיִם שֶׁל הַגָּמָל מִפְּנֵי הַחוֹל?","options":["הַדַּבֶּשֶׁת","הָרִיסִים הָאֲרֻכִּים","הַמַּיִם","הַשֻּׁמָּן"],"answer":1,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁהָרִיסִים הָאֲרֻכִּים שׁוֹמְרִים עַל הָעֵינַיִם מִפְּנֵי הַחוֹל."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מָה הַגָּמָל אוֹכֵל?","אֵיפֹה הַגָּמָל חַי?","מָה יֵשׁ בְּדִבְשַׁת?","מָה הַגָּמָל עוֹשֶׂה כְּשֶׁהוּא מוֹצָא מַיִם?"],"answer":0,"exp":"הַקֶּטַע לֹא מְסַפֵּר מָה הַגָּמָל אוֹכֵל. כָּל שְׁאַר הַשְּׁאֵלוֹת נַעֲנוֹת בַּקֶּטַע."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"אֵיזֶה תַּפְקִיד קִבְּלָה מַאיָה בַּהַצָּגָה?","options":["הַמּוֹרָה","כּוֹכָב","הַיָּרֵחַ","הַשֶּׁמֶשׁ"],"answer":3,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁמַּאיָה קִבְּלָה תַּפְקִיד: לִהְיוֹת הַשַּׁמָּשׁ."},{"id":"r7","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה הִרְגִּישָׁה מַאיָה כְּשֶׁקִּבְּלָה אֶת הַתַּפְקִיד?","options":["שִׁעֲמוּם","שִׂמְחָה, וְגַם קְצָת פַּחַד","רַק כַּעַס","רַק עֶצֶב"],"answer":1,"exp":"בְּשׁוּרָה 3 כָּתוּב: \"מַאיָה שְׂמֵחָה, אֲבָל בַּלֵּב שֶׁלָּהּ הָיָה גַּם קְצָת פַּחַד\"."},{"id":"r8","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה הִצִּיעַ עֹמֶר?","options":["לְבַקֵּשׁ תַּפְקִיד אַחֵר","לְוַתֵּר עַל הַהַצָּגָה","לְהִתְאַמֵּן כָּל עֶרֶב","לִקְרֹא סֵפֶר עַל הַשֶּׁמֶשׁ"],"answer":2,"exp":"בְּשׁוּרָה 5 עֹמֶר אוֹמֵר: \"בּוֹאִי נִתְאַמֵּן\"."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"דִּקְלְמָה\" (שׁוּרָה 6)?","options":["אָמְרָה בְּעַל פֶּה מִשְׁפָּטִים שֶׁלָּמְדָה","כָּתְבָה בַּמַּחְבֶּרֶת","רָקְדָה מוּל הַמַּרְאָה","שָׁרָה שִׁיר חָדָשׁ"],"answer":0,"exp":"מַאיָה עָמְדָה מוּל עֹמֶר וְאָמְרָה אֶת הַמִּשְׁפָּטִים שֶׁלָּהּ בְּעַל פֶּה – זֶה לְדַקְלֵם."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה הַבִּרְכַּיִם שֶׁל מַאיָה רָעֲדוּ כְּשֶׁעָלְתָה לַבָּמָה?","options":["כִּי הִיא הָיְתָה חוֹלָה","כִּי הִיא רָצָה מַהֵר","כִּי הָיָה קַר בָּאוּלָם","כִּי הִיא הִתְרַגְּשָׁה וּקְצָת פָּחֲדָה"],"answer":3,"exp":"כְּשֶׁמִּתְרַגְּשִׁים וּמְפַחֲדִים, לִפְעָמִים הַגּוּף רוֹעֵד."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 10 שֶׁעֹמֶר חִיֵּךְ אֵלֶיהָ?","options":["כְּדֵי שֶׁנֵּדַע שֶׁעֹמֶר שָׁכַח אֶת הַמִּשְׁפָּטִים","כְּדֵי שֶׁנֵּדַע שֶׁעֹמֶר שִׂחֵק בַּהַצָּגָה","כְּדֵי שֶׁנָּבִין שֶׁעֹמֶר עוֹדֵד אוֹתָהּ, וְזֶה עָזַר לָהּ","כְּדֵי שֶׁנֵּדַע שֶׁעֹמֶר צָחַק עָלֶיהָ"],"answer":2,"exp":"הַחִיּוּךְ שֶׁל עֹמֶר נָתַן לְמַאיָה כּוֹחַ, וּמִיָּד אַחַר כָּךְ הִיא אָמְרָה הַכֹּל בְּקוֹל רָם וּבָרוּר."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה הַמֶּסֶר שֶׁל הַסִּפּוּר?","options":["אַחִים תָּמִיד רַבִּים","אִמּוּן עוֹזֵר לְהִתְגַּבֵּר עַל פַּחַד","לֹא כְּדַאי לְהִשְׁתַּתֵּף בְּהַצָּגוֹת","כְּדַאי לָשֶׁבֶת בְּשׁוּרָה הָרִאשׁוֹנָה"],"answer":1,"exp":"מַאיָה פָּחֲדָה, הִתְאַמְּנָה כָּל עֶרֶב, וְהִצְלִיחָה. הָאִמּוּן עָזַר לָהּ."},{"type":"open","tag":"calc","expr":"21 + 18 = ___","answer":39,"exp":"⁦21 + 18 = 39⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"83 − 53 = ___","answer":30,"exp":"⁦83 − 53 = 30⁩. בְּדִיקָה: ⁦30 + 53 = 83⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"7 × 3 = ___","answer":21,"exp":"⁦7 × 3 = 21⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"28 : 4 = ___","answer":7,"exp":"⁦28 : 4 = 7⁩, כִּי ⁦4 × 7 = 28⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 15 = 39","answer":24,"exp":"⁦39 − 15 = 24⁩, וְלָכֵן ⁦24 + 15 = 39⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"65 − ___ = 32","answer":33,"exp":"⁦65 − 32 = 33⁩, וְלָכֵן ⁦65 − 33 = 32⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"2 × ___ = 16","answer":8,"exp":"⁦2 × 8 = 16⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"8 × 4 < 8 × ___","min":5,"max":999,"exp":"בִּשְׁנֵי הַצְּדָדִים כּוֹפְלִים ב־8. צָרִיךְ מִסְפָּר גָּדוֹל מ־4, לְמָשָׁל 5.","answer":5,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + 5 = 19","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 7: 7 + 7 + 5 = 19⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ = 10","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 5: 5 + 5 = 10⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle"],10],[["circle","square"],8]],"ask":["square"]},"options":["2","3","4","5"],"answer":1,"exp":"שְׁנֵי עִגּוּלִים = 10, אָז עִגּוּל = 5. עִגּוּל + רִבּוּעַ = 8, אָז רִבּוּעַ = ⁦8 − 5 = 3⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"אִיתַי קָנָה 3 עֶפְרוֹנוֹת. כָּל עִפָּרוֹן עוֹלֶה 5 ₪. אִיתַי שִׁלֵּם בִּשְׁטָר שֶׁל 20 ₪. כַּמָּה עֹדֶף קִבֵּל?","options":["5","6","10","15"],"answer":0,"exp":"⁦3 × 5 = 15⁩ ₪ וְאָז ⁦20 − 15 = 5⁩ ₪ עֹדֶף.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"לְרוֹנִי יֵשׁ 86 חֲרוּזִים, וּלְאָחִיהָ יֵשׁ 77 חֲרוּזִים. כַּמָּה חֲרוּזִים יֵשׁ לְרוֹנִי יוֹתֵר מֵאֲשֶׁר לְאָחִיהָ?","options":["9","10","19","163"],"answer":0,"exp":"מְחַפְּשִׂים אֶת הַהֶפְרֵשׁ: ⁦86 − 77 = 9⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּכִּתָּה שֶׁל מִיכַל יֵשׁ 5 שֻׁלְחָנוֹת. לְיַד כָּל שֻׁלְחָן יוֹשְׁבִים 3 יְלָדִים. כַּמָּה יְלָדִים יוֹשְׁבִים בַּכִּתָּה?","options":["8","12","15","18"],"answer":2,"exp":"5 שֻׁלְחָנוֹת, בְּכָל אֶחָד 3 יְלָדִים: ⁦5 × 3 = 15⁩.","id":"m14","sec":"math"}]},{"n":3,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַקִּפּוֹד","lines":["הַקִּפּוֹד הוּא חַיָּה קְטַנָּה שֶׁהַגּוּף שֶׁלָּהּ מְכֻסֶּה בְּקוֹצִים.","בַּיּוֹם הַקִּפּוֹד יָשָׁן בְּמָקוֹם מֻסְתָּר, וּבַלַּיְלָה הוּא יוֹצֵא לְחַפֵּשׂ מָזוֹן.","הוּא אוֹכֵל חֲרָקִים, תּוֹלָעִים וְחֶלְזוֹנוֹת. לָכֵן הַרְבֵּה גַּנָּנִים שְׂמֵחִים לִרְאוֹת אוֹתוֹ:","הוּא עוֹזֵר לָהֶם לִשְׁמֹר עַל הַצְּמָחִים בַּגִּנָּה.","כְּשֶׁהַקִּפּוֹד מַרְגִּישׁ בְּסַכָּנָה, הוּא מִתְגַּלְגֵּל וְנִהְיֶה כְּמוֹ כַּדּוּר שֶׁל קוֹצִים.","כָּךְ קָשֶׁה לִחְיוֹת אֲחֵרוֹת לִתְקֹף אוֹתוֹ.","בַּחֹרֶף, כְּשֶׁקַּר מְאוֹד, הַקִּפּוֹד יָשַׁן שֵׁנָה אֲרֻכָּה עַד הָאָבִיב."]},{"kind":"story","title":"הַכַּדּוּר שֶׁעָף","lines":["דָּנִיאֵל וְעִדּוֹ שִׂחֲקוּ כַּדּוּרֶגֶל בֶּחָצֵר שֶׁל הַבִּנְיָן.","דָּנִיֵּאל בָּעַט חָזָק מְאוֹד, וְהַכַּדּוּר עָף מֵעַל הַגָּדֵר.","טְרָאח! נִשְׁמַע קוֹל שֶׁל מַשֶּׁהוּ נִשְׁבָּר.","הַכַּדּוּר נָפַל בַּגִּנָּה שֶׁל הַגְּבֶרֶת רָחֵל וְשָׁבַר עָצִיץ גָּדוֹל שֶׁל פְּרָחִים.","\"בּוֹא נִבְרַח,\" לָחַשׁ עִדּוֹ. \"אַף אֶחָד לֹא רָאָה אוֹתָנוּ.\"","דָּנִיֵּאל עָמַד רֶגַע וְחָשַׁב. הַבֶּטֶן שֶׁלּוֹ הִתְהַפְּכָה.","\"לֹא,\" אָמַר לְבַסּוֹף, \"זֶה לֹא בְּסֵדֶר. אֲנִי הוֹלֵךְ לְהַגִּיד לָהּ.\"","הוּא דָּפַק בַּדֶּלֶת. הַגְּבֶרֶת רָחֵל פָּתְחָה וְהִסְתַּכְּלָה עָלָיו בִּרְצִינוּת.","\"סְלִיחָה,\" אָמַר דָּנִיאֵל בְּקוֹל שָׁקֵט, \"הַכַּדּוּר שֶׁלִּי שָׁבַר לָךְ אֶת הֶעָצִיץ.\"","הַגְּבֶרֶת רָחֵל שָׁתְקָה רֶגַע, וְאָז חִיְּכָה. \"תּוֹדָה שֶׁסִּפַּרְתָּ לִי אֶת הָאֱמֶת,\" אָמְרָה.","\"אוּלַי תַּעֲזֹר לִי לִשְׁתֹּל אֶת הַפְּרָחִים בְּעָצִיץ חָדָשׁ?\"","בְּאוֹתוֹ עֶרֶב דָּנִיאֵל וְהַגְּבֶרֶת רָחֵל שֶׁתָּלוּ יַחַד פְּרָחִים, וְעִדּוֹ הֵבִיא מַיִם לְהַשְׁקוֹת."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָתַי הַקִּפּוֹד יוֹצֵא לְחַפֵּשׂ מָזוֹן?","options":["בַּלַּיְלָה","בַּבֹּקֶר","בַּצָּהֳרַיִם","רַק בַּחֹרֶף"],"answer":0,"exp":"בְּשׁוּרָה 2 כָּתוּב: \"וּבַלַּיְלָה הוּא יוֹצֵא לְחַפֵּשׂ מָזוֹן\"."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"מֻסְתָּר\" (שׁוּרָה 2)?","options":["שֶׁיֵּשׁ בּוֹ רַעַשׁ","שֶׁיֵּשׁ בּוֹ הַרְבֵּה אוֹר","שֶׁהוּא רָטֹב","שֶׁקָּשֶׁה לִרְאוֹת אוֹתוֹ"],"answer":3,"exp":"מָקוֹם מֻסְתָּר הוּא מָקוֹם חָבוּי, שֶׁקָּשֶׁה לִרְאוֹת אוֹתוֹ."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַגַּנָּנִים שְׂמֵחִים לִרְאוֹת אֶת הַקִּפּוֹד?","options":["כִּי הוּא מִתְגַּלְגֵּל כְּמוֹ כַּדּוּר","כִּי הוּא אוֹכֵל חֲרָקִים וְתוֹלָעִים וְעוֹזֵר לִשְׁמֹר עַל הַצְּמָחִים","כִּי יֵשׁ לוֹ קוֹצִים יָפִים","כִּי הוּא יָשָׁן כָּל הַחֹרֶף"],"answer":1,"exp":"בְּשׁוּרוֹת 3–4 כָּתוּב שֶׁהַקִּפּוֹד אוֹכֵל חֲרָקִים, וְלָכֵן הוּא עוֹזֵר לִשְׁמֹר עַל הַגִּנָּה."},{"id":"r4","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה עוֹשֶׂה הַקִּפּוֹד כְּשֶׁהוּא מַרְגִּישׁ בְּסַכָּנָה?","options":["בּוֹרֵחַ וּמְטַפֵּס עַל עֵץ","נִכְנָס לַמַּיִם","מִתְגַּלְגֵּל כְּמוֹ כַּדּוּר שֶׁל קוֹצִים","צוֹעֵק בְּקוֹל רָם"],"answer":2,"exp":"בְּשׁוּרָה 5 כָּתוּב שֶׁהַקִּפּוֹד מִתְגַּלְגֵּל וְנִהְיֶה כְּמוֹ כַּדּוּר שֶׁל קוֹצִים."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["כַּמָּה קוֹצִים יֵשׁ לַקִּפּוֹד?","מָה הַקִּפּוֹד עוֹשֶׂה בַּחֹרֶף?","מָתַי הַקִּפּוֹד יָשָׁן?","מָה הַקִּפּוֹד אוֹכֵל?"],"answer":0,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה קוֹצִים יֵשׁ לַקִּפּוֹד."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה נִשְׁבַּר?","options":["הַכַּדּוּר","חַלּוֹן","הַגָּדֵר","עָצִיץ שֶׁל פְּרָחִים"],"answer":3,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁהַכַּדּוּר שָׁבַר עָצִיץ גָּדוֹל שֶׁל פְּרָחִים."},{"id":"r7","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה הִצִּיעַ עִדּוֹ?","options":["לִבְרֹחַ","לְסַפֵּר לִגְבֶרֶת רָחֵל","לִקְנוֹת עָצִיץ חָדָשׁ","לְשַׂחֵק בְּתוֹךְ ה c":"math"},{"type":"mc","tag":"word","text":"בַּסֵּפֶר יֵשׁ 70 עַמּוּדִים. טַלְיָה קָרְאָה 12 עַמּוּדִים בְּיוֹם רִאשׁוֹן, ו־13 עַמּוּדִים בְּיוֹם שֵׁנִי. כַּמָּה עַמּוּדִים נִשְׁאֲרוּ לָהּ לִקְרֹא?","options":["25","45","55","58"],"answer":1,"exp":"⁦12 + 13 = 25⁩ עַמּוּדִים נִקְרְאוּ. ⁦70 − 25 = 45⁩.","id":"m14","sec":"math"}]},{"n":4,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַיָּרֵחַ","lines":["בַּלַּיְלָה אֲנַחְנוּ רוֹאִים בַּשָּׁמַיִם אֶת הַיָּרֵחַ.","נִדְמֶה לָנוּ שֶׁהַיָּרֵחַ מֵאִיר, אֲבָל לַיָּרֵחַ אֵין אוֹר מִשֶּׁלּוֹ.","הוּא מַחֲזִיר אֶת הָאוֹר שֶׁמַּגִּיעַ אֵלָיו מֵהַשֶּׁמֶשׁ, כְּמוֹ מַרְאָה.","בְּכָל לַיְלָה הַיָּרֵחַ נִרְאֶה קְצָת אַחֶרֶת:","לִפְעָמִים הוּא עָגֹל וּמָלֵא, וְלִפְעָמִים הוּא דַּק כְּמוֹ חֲתִיכַת בָּנָנָה.","עַל הַיָּרֵחַ אֵין מַיִם, אֵין אֲוִיר וְאֵין צְמָחִים.","לִפְנֵי יוֹתֵר מֵחֲמִשִּׁים שָׁנָה, אֲנָשִׁים טָסוּ לַיָּרֵחַ בַּחֲלָלִית וְהָלְכוּ עָלָיו."]},{"kind":"story","title":"שׁוֹקוֹ","lines":["כְּבָר הַרְבֵּה זְמַן לִיאוֹר בִּקֵּשׁ מֵהַהוֹרִים כֶּלֶב.","\"כֶּלֶב זֶה לֹא צַעֲצוּעַ,\" אָמַר אַבָּא. \"צָרִיךְ לְטַיֵּל אִתּוֹ, לְהַאֲכִיל אוֹתוֹ וּלְנַקּוֹת אַחֲרָיו.\"","\"אֲנִי אֶעֱשֶׂה הַכֹּל!\" הִבְטִיחַ לִיאוֹר.","בְּיוֹם הַהֻלֶּדֶת הַשְּׁמִינִי שֶׁלּוֹ, הַהוֹרִים הֵבִיאוּ הַבַּיְתָה גּוּר קָטָן וְחוּם.","לִיאוֹר קָרָא לוֹ \"שׁוֹקוֹ\", כִּי הַפַּרְוָה שֶׁלּוֹ הָיְתָה בְּצֶבַע שֶׁל שׁוֹקוֹ.","בַּשָּׁבוּעַ הָרִאשׁוֹן לִיאוֹר קָם מֻקְדָּם כָּל בֹּקֶר וְיָצָא לְטַיֵּל עִם שׁוֹקוֹ.","בַּשָּׁבוּעַ הַשֵּׁנִי הָיָה קַר וְגָשׁוּם, וְלִיאוֹר רָצָה לְהִשָּׁאֵר בַּמִּטָּה.","\"אוּלַי אַבָּא יוֹצִיא אוֹתוֹ הַיּוֹם,\" חָשַׁב.","אֲבָל אָז שׁוֹקוֹ עָמַד לְיַד הַדֶּלֶת, יִלֵּל בְּשֶׁקֶט וְהִסְתַּכֵּל עַל לִיאוֹר.","לִיאוֹר נִזְכַּר בַּהַבְטָחָה שֶׁלּוֹ. הוּא לָבַשׁ מְעִיל, לָקַח מִטְרִיָּה וְיָצָא.","כְּשֶׁחָזְרוּ, שְׁנֵיהֶם הָיוּ רְטֻבִּים, אֲבָל לִיאוֹר הִרְגִּישׁ גֵּאֶה.","אַבָּא הִסְתַּכֵּל עָלָיו וְאָמַר: \"עַכְשָׁו אֲנִי רוֹאֶה שֶׁאַתָּה בֶּאֱמֶת מוּכָן לְכֶלֶב.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מֵאֵיפֹה מַגִּיעַ הָאוֹר שֶׁאֲנַחְנוּ רוֹאִים בַּיָּרֵחַ?","options":["מֵהַמְּנוֹרוֹת בָּעִיר","מֵהַכּוֹכָבִים","מִתּוֹךְ הַיָּרֵחַ עַצְמוֹ","מֵהַשֶּׁמֶשׁ"],"answer":3,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁהַיָּרֵחַ מַחֲזִיר אֶת הָאוֹר שֶׁמַּגִּיעַ אֵלָיו מֵהַשֶּׁמֶשׁ."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלִּים \"נִדְמֶה לָנוּ\" (שׁוּרָה 2)?","options":["אֲנַחְנוּ שׁוֹמְעִים אֶת זֶה","אֲנַחְנוּ שׁוֹכְחִים אֶת זֶה","כָּךְ זֶה נִרְאֶה לָנוּ, אֲבָל זֶה לֹא בְּהֶכְרֵחַ נָכוֹן","אֲנַחְנוּ יוֹדְעִים אֶת זֶה בְּוַדָּאוּת"],"answer":2,"exp":"\"נִדְמֶה לָנוּ שֶׁהַיָּרֵחַ מֵאִיר\" – כָּךְ זֶה נִרְאֶה, אֲבָל בֶּאֱמֶת אֵין לוֹ אוֹר מִשֶּׁלּוֹ."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 3 \"כְּמוֹ מַרְאָה\"?","options":["כְּדֵי לְהַסְבִּיר שֶׁהַיָּרֵחַ מַחְזִיר אוֹר, כְּמוֹ שֶׁמַּרְאָה מַחֲזִירָה אוֹר","כִּי אֶפְשָׁר לִרְאוֹת אֶת עַצְמֵנוּ בַּיָּרֵחַ","כִּי הַיָּרֵחַ עָשׂוּי מִזְּכוּכִית","כִּי עַל הַיָּרֵחַ יֵשׁ מַרְאוֹת"],"answer":0,"exp":"מַרְאָה מַחֲזִירָה אֶת הָאוֹר שֶׁמַּגִּיעַ אֵלֶיהָ, וְגַם הַיָּרֵחַ מַחֲזִיר אֶת הָאוֹר שֶׁל הַשֶּׁמֶשׁ."},{"id":"r4","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה אֵין עַל הַיָּרֵחַ?","options":["הָרִים","מַיִם, אֲוִיר וּצְמָחִים","אֲבָנִים","אֲדָמָה"],"answer":1,"exp":"בְּשׁוּרָה 6 כָּתוּב: \"עַל הַיָּרֵחַ אֵין מַיִם, אֵין אֲוִיר וְאֵין צְמָחִים\"."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מֵאֵיפֹה מַגִּיעַ הָאוֹר שֶׁל הַיָּרֵחַ?","הַאִם אֲנָשִׁים הָיוּ עַל הַיָּרֵחַ?","כַּמָּה רָחוֹק הַיָּרֵחַ מִכַּדּוּר הָאָרֶץ?","הַאִם יֵשׁ אֲוִיר עַל הַיָּרֵחַ?"],"answer":2,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה רָחוֹק הַיָּרֵחַ."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה אָמַר אַבָּא שֶׁצָּרִיךְ לַעֲשׂוֹת עִם כֶּלֶב?","options":["לְהַשְׁאִיר אוֹתוֹ בֶּחָצֵר","לְטַיֵּל אִתּוֹ, לְהַאֲכִיל אוֹתוֹ וּלְנַקּוֹת אַחֲרָיו","לִקְנוֹת לוֹ הַרְבֵּה צַעֲצוּעִים","לְלַמֵּד אוֹתוֹ לְשַׂחֵק בְּכַדּוּר"],"answer":1,"exp":"בְּשׁוּרָה 2 אַבָּא אוֹמֵר מָה צָרִיךְ לַעֲשׂוֹת: לְטַיֵּל, לְהַאֲכִיל וּלְנַקּוֹת."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה לִיאוֹר קָרָא לָגוּר \"שׁוֹקוֹ\"?","options":["כִּי לִיאוֹר אוֹהֵב לִשְׁתּוֹת שׁוֹקוֹ","כִּי הַגּוּר שָׁתָה שׁוֹקוֹ","כִּי אַבָּא בִּקֵּשׁ","בִּגְלַל הַצֶּבַע שֶׁל הַפַּרְוָה שֶׁלּוֹ"],"answer":3,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"כִּי הַפַּרְוָה שֶׁלּוֹ הָיְתָה בְּצֶבַע שֶׁל שׁוֹקוֹ\"."},{"id":"r8","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיָה שׁוֹנֶה בַּשָּׁבוּעַ הַשֵּׁנִי?","options":["הָיָה קַר וְגָשׁוּם","אַבָּא נָסַע","הַגּוּר בָּרַח","לִיאוֹר הָיָה חוֹלֶה"],"answer":0,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁבַּשָּׁבוּעַ הַשֵּׁנִי הָיָה קַר וְגָשׁוּם."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"יִלֵּל\" (שׁוּרָה 9)?","options":["נִרְדַּם","קָפַץ גָּבוֹהַּ","נָבַח בְּקוֹל רָם","הִשְׁמִיעַ קוֹל בְּכִי חַלָּשׁ"],"answer":3,"exp":"הַגּוּר יִלֵּל בְּשֶׁקֶט – הִשְׁמִיעַ קוֹל חַלָּשׁ, כְּמוֹ בֶּכִי."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה לִיאוֹר הֶחְלִיט בַּסּוֹף לָצֵאת עִם שׁוֹקוֹ?","options":["אַבָּא צָעַק עָלָיו","הוּא רָצָה לְשַׂחֵק עִם הַמִּטְרִיָּה","הוּא נִזְכַּר שֶׁהִבְטִיחַ לְטַפֵּל בַּכֶּלֶב","הַגֶּשֶׁם נִפְסַק"],"answer":2,"exp":"בְּשׁוּרָה 10 כָּתוּב: \"לִיאוֹר נִזְכַּר בַּהַבְטָחָה שֶׁלּוֹ\"."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"אֵיךְ הִרְגִּישׁ לִיאוֹר כְּשֶׁחָזַר הַבַּיְתָה?","options":["גֵּאֶה","מְשֻׁעֲמָם","כּוֹעֵס","מְפֻחָד"],"answer":0,"exp":"בְּשׁוּרָה 11 כָּתוּב שֶׁלִּיאוֹר הִרְגִּישׁ גֵּאֶה."},{"id":"r12","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אַבָּא אָמַר \"עַכְשָׁו אֲנִי רוֹאֶה שֶׁאַתָּה בֶּאֱמֶת מוּכָן לְכֶלֶב\"?","options":["כִּי לִיאוֹר לָבַשׁ מְעִיל חָדָשׁ","כִּי לִיאוֹר עָמַד בַּהַבְטָחָה גַּם כְּשֶׁהָיָה קָשֶׁה","כִּי לִיאוֹר בִּקֵּשׁ עוֹד כֶּלֶב","כִּי שׁוֹקוֹ נִרְדַּם"],"answer":1,"exp":"לִיאוֹר יָצָא עִם שׁוֹקוֹ גַּם בַּגֶּשֶׁם, כְּמוֹ שֶׁהִבְטִיחַ. כָּךְ אַבָּא רָאָה שֶׁהוּא לוֹקֵחַ אַחְרָיוּת."},{"type":"open","tag":"calc","expr":"24 + 22 = ___","answer":46,"exp":"⁦24 + 22 = 46⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"95 − 40 = ___","answer":55,"exp":"⁦95 − 40 = 55⁩. בְּדִיקָה: ⁦55 + 40 = 95⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"5 × 3 = ___","answer":15,"exp":"⁦5 × 3 = 15⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"15 : 3 = ___","answer":5,"exp":"⁦15 : 3 = 5⁩, כִּי ⁦3 × 5 = 15⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 30 = 49","answer":19,"exp":"⁦49 − 30 = 19⁩, וְלָכֵן ⁦19 + 30 = 49⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"74 − ___ = 17","answer":57,"exp":"⁦74 − 17 = 57⁩, וְלָכֵן ⁦74 − 57 = 17⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"10 × ___ = 80","answer":8,"exp":"⁦10 × 8 = 80⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"58 − 20 > 58 − ___","min":21,"max":58,"exp":"כְּשֶׁמּוֹרִידִים יוֹתֵר, נִשְׁאַר פָּחוֹת. צָרִיךְ לְהוֹרִיד יוֹתֵר מ־20, לְמָשָׁל 21.","answer":21,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ = 15","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 5: 5 + 5 + 5 = 15⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + 2 = 12","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 5: 5 + 5 + 2 = 12⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle"],10],[["circle","square"],7]],"ask":["square"]},"options":["1","2","3","4"],"answer":1,"exp":"שְׁנֵי עִגּוּלִים = 10, אָז עִגּוּל = 5. עִגּוּל + רִבּוּעַ = 7, אָז רִבּוּעַ = ⁦7 − 5 = 2⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"מִיכַל קָנְתָה 4 כַּדּוּרִים. כָּל כַּדּוּר עוֹלֶה 2 ₪. מִיכַל שִׁלְּמָה בִּשְׁטָר שֶׁל 20 ₪. כַּמָּה עֹדֶף קִבְּלָה?","options":["8","12","14","18"],"answer":1,"exp":"⁦4 × 2 = 8⁩ ₪ וְאָז ⁦20 − 8 = 12⁩ ₪ עֹדֶף.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"לְאַלּוֹן יֵשׁ 46 גֻּלּוֹת, וּלְאָחִיו יֵשׁ 37 גֻּלּוֹת. כַּמָּה גֻּלּוֹת יֵשׁ לְאַלּוֹן יוֹתֵר מֵאֲשֶׁר לְאָחִיו?","options":["9","10","19","83"],"answer":0,"exp":"מְחַפְּשִׂים אֶת הַהֶפְרֵשׁ: ⁦46 − 37 = 9⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּכִּתָּה שֶׁל עֲדִי יֵשׁ 6 שֻׁלְחָנוֹת. לְיַד כָּל שֻׁלְחָן יוֹשְׁבִים 2 יְלָדִים. כַּמָּה יְלָדִים יוֹשְׁבִים בַּכִּתָּה?","options":["8","10","12","14"],"answer":2,"exp":"6 שֻׁלְחָנוֹת, בְּכָל אֶחָד 2 יְלָדִים: ⁦6 × 2 = 12⁩.","id":"m14","sec":"math"}]},{"n":5,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַדּוֹלְפִין","lines":["הַדּוֹלְפִין חַי בַּיָּם, אֲבָל הוּא לֹא דָּג. הוּא יוֹנֵק, כְּמוֹ הַכֶּלֶב וְהָאָדָם.","לָכֵן הַדּוֹלְפִין צָרִיךְ לַעֲלוֹת אֶל פְּנֵי הַמַּיִם כְּדֵי לִנְשֹׁם אֲוִיר.","הוּא נוֹשֵׁם דֶּרֶךְ נֶקֶב קָטָן שֶׁנִּמְצָא עַל הָרֹאשׁ שֶׁלּוֹ.","דּוֹלְפִינִים חַיִּים בִּקְבוּצוֹת, וְהֵם \"מְדַבְּרִים\" זֶה עִם זֶה בִּשְׁרִיקוֹת וּבְצִקְצוּקִים.","לְכָל דּוֹלְפִין יֵשׁ שְׁרִיקָה מְיֻחֶדֶת מִשֶּׁלּוֹ, כְּמוֹ שֵׁם.","כָּךְ הַדּוֹלְפִינִים יוֹדְעִים מִי קוֹרֵא לָהֶם.","הַדּוֹלְפִינִים חֲכָמִים מְאוֹד. הֵם יְכוֹלִים לִלְמֹד מִשְׂחָקִים וְלִפְתֹּר בְּעָיוֹת.","לִפְעָמִים הֵם אֲפִלּוּ עוֹזְרִים לְדוֹלְפִין חוֹלֶה לַעֲלוֹת אֶל פְּנֵי הַמַּיִם."]},{"kind":"story","title":"הַסֵּפֶר הָרָטֹב","lines":["תָּמָר שָׁאֲלָה מֵהַסִּפְרִיָּה סֵפֶר עַל הֶחָלָל, עִם תְּמוּנוֹת שֶׁל כּוֹכָבִים וִירָחִים.","הִיא קָרְאָה בּוֹ כָּל עֶרֶב בַּמִּטָּה, וְחָלְמָה לִהְיוֹת אַסְטְרוֹנָאוּטִית.","יוֹם אֶחָד הִיא לָקְחָה אֶת הַסֵּפֶר לַגִּנָּה, כְּדֵי לְהַרְאוֹת אוֹתוֹ לַחֲבֵרָה שֶׁלָּהּ, שִׁירָה.","הַבָּנוֹת יָשְׁבוּ עַל הַדֶּשֶׁא וְדִפְדְּפוּ בַּסֵּפֶר.","פִּתְאוֹם הַמַּמְטֵרוֹת נִפְתְּחוּ, וּמַיִם הִתְחִילוּ לְהַתִּיז לְכָל עֵבֶר.","הַבָּנוֹת קָפְצוּ וּבָרְחוּ, אֲבָל הַסֵּפֶר נִשְׁאַר עַל הַדֶּשֶׁא.","כְּשֶׁתָּמָר חָזְרָה לָקַחַת אוֹתוֹ, הַדַּפִּים כְּבָר הָיוּ רְטֻבִּים וּמְקֻמָּטִים.","\"אוֹי, מָה אַגִּיד לַסַּפְרָנִית?\" אָמְרָה תָּמָר, וְהַדְּמָעוֹת עָמְדוּ לָהּ בָּעֵינַיִם.","בַּבַּיִת אִמָּא עָזְרָה לָהּ לְיַבֵּשׁ אֶת הַדַּפִּים בְּעֶזְרַת מַגֶּבֶת וּמְיַבֵּשׁ שֵׂעָר.","הַסֵּפֶר הִתְיַבֵּשׁ, אֲבָל נִשְׁאֲרוּ בּוֹ כְּתָמִים.","לְמָחֳרָת תָּמָר הֵבִיאָה לַסַּפְרָנִית אֶת הַסֵּפֶר, וְגַם מִכְתָּב קָטָן שֶׁכָּתְבָה:","\"סְלִיחָה. הַסֵּפֶר נִרְטַב בִּגְלָלִי. בַּפַּעַם הַבָּאָה אֶשְׁמֹר טוֹב יוֹתֵר עַל הַסְּפָרִים.\"","הַסַּפְרָנִית קָרְאָה אֶת הַמִּכְתָּב וְחִיְּכָה. \"בּוֹאִי נִבְחַר לָךְ עוֹד סֵפֶר עַל הֶחָלָל,\" אָמְרָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"לָמָּה הַדּוֹלְפִין צָרִיךְ לַעֲלוֹת אֶל פְּנֵי הַמַּיִם?","options":["כְּדֵי לְהִתְחַמֵּם בַּשֶּׁמֶשׁ","כְּדֵי לֶאֱכֹל דָּגִים","כְּדֵי לְשַׂחֵק עִם הַקְּבוּצָה","כְּדֵי לִנְשֹׁם אֲוִיר"],"answer":3,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַדּוֹלְפִין עוֹלֶה אֶל פְּנֵי הַמַּיִם כְּדֵי לִנְשֹׁם אֲוִיר."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 1 \"כְּמוֹ הַכֶּלֶב וְהָאָדָם\"?","options":["כְּדֵי לָתֵת דֻּגְמָאוֹת לְחַיּוֹת אֲחֵרוֹת שֶׁהֵן יוֹנְקִים","כְּדֵי לְהַגִּיד שֶׁדּוֹלְפִינִים אוֹהֲבִים כְּלָבִים","כְּדֵי לְהַגִּיד שֶׁאֲנָשִׁים חַיִּים בַּיָּם","כְּדֵי לְהַגִּיד שֶׁדּוֹלְפִינִים חַיִּים בַּיַּבָּשָׁה"],"answer":0,"exp":"הַכֶּלֶב וְהָאָדָם הֵם יוֹנְקִים. הֵם דֻּגְמָאוֹת שֶׁעוֹזְרוֹת לְהָבִין מָה זֶה יוֹנֵק."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נֶקֶב\" (שׁוּרָה 3)?","options":["חֹר","סְנַפִּיר","זָנָב","שֵׁן"],"answer":0,"exp":"הַדּוֹלְפִין נוֹשֵׁם דֶּרֶךְ נֶקֶב, כְּלוֹמַר דֶּרֶךְ חֹר קָטָן בָּרֹאשׁ."},{"id":"r4","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 5 שֶׁהַשְּׁרִיקָה הִיא \"כְּמוֹ שָׁם\"?","options":["כִּי הַדּוֹלְפִינִים לֹא שׁוֹמְעִים טוֹב","כִּי לְפִי הַשְּׁרִיקָה יוֹדְעִים מִי הַדּוֹלְפִין","כִּי הַדּוֹלְפִינִים שָׁרִים שִׁירִים","כִּי עַל כָּל דּוֹלְפִין כָּתוּב שָׁם"],"answer":1,"exp":"בְּשׁוּרָה 6 כָּתוּב שֶׁכָּךְ הַדּוֹלְפִינִים יוֹדְעִים מִי קוֹרֵא לָהֶם – כְּמוֹ שֵׁם."},{"id":"r5","sec":"read","p":0,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לִלְמֹד מִשּׁוּרָה 8 עַל הַדּוֹלְפִינִים?","options":["שֶׁהֵם מְפַחֲדִים מֵהַמַּיִם","שֶׁהֵם חוֹלִים הַרְבֵּה","שֶׁהֵם עוֹזְרִים זֶה לָזֶה","שֶׁהֵם לֹא יוֹדְעִים לִשְׂחוֹת"],"answer":2,"exp":"דּוֹלְפִינִים עוֹזְרִים לְדוֹלְפִין חוֹלֶה לַעֲלוֹת לִנְשֹׁם – הֵם עוֹזְרִים זֶה לָזֶה."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"עַל מֶה הָיָה הַסֵּפֶר שֶׁתָּמָר שָׁאֲלָה?","options":["עַל גִּנּוֹת","עַל חַיּוֹת","עַל הֶחָלָל","עַל סִפְרִיּוֹת"],"answer":2,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁהַסֵּפֶר הָיָה עַל הֶחָלָל."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה תָּמָר לָקְחָה אֶת הַסֵּפֶר לַגִּנָּה?","options":["כְּדֵי לְהַרְאוֹת אוֹתוֹ לַחֲבֵרָה שֶׁלָּהּ","כְּדֵי לְהַחֲזִיר אוֹתוֹ לַסִּפְרִיָּה","כְּדֵי לִקְרֹא בְּשֶׁקֶט","כְּדֵי לְיַבֵּשׁ אוֹתוֹ"],"answer":0,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁהִיא רָצְתָה לְהַרְאוֹת אֶת הַסֵּפֶר לְשִׁירָה."},{"id":"r8","sec":"read","p":1,"tag":"s","type":"mc","q":"מָה קָרָה לְסַפֵּר כְּשֶׁהַמַּמְטֵרוֹת נִפְתְּחוּ?","options":["שִׁירָה לָקְחָה אוֹתוֹ הַבַּיְתָה","הוּא נִרְטַב, כִּי הוּא נִשְׁאַר עַל הַדֶּשֶׁא","הוּא נָפַל לַבּוֹר","הוּא נִקְרַע לִשְׁנַיִם"],"answer":1,"exp":"בְּשׁוּרוֹת 6–7: הַסֵּפֶר נִשְׁאַר עַל הַדֶּשֶׁא, וְהַדַּפִּים נִרְטְבוּ."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"מְקֻמָּטִים\" (שׁוּרָה 7)?","options":["נְקִיִּים מְאוֹד","חֲדָשִׁים לְגַמְרֵי","יֵשׁ בָּהֶם קְפָלִים, וְהֵם לֹא יְשָׁרִים","צְבוּעִים בְּכָחֹל"],"answer":2,"exp":"דַּף מְקֻמָּט הוּא דַּף שֶׁיֵּשׁ בּוֹ קְפָלִים, כְּמוֹ דַּף שֶׁרָטֹב וְהִתְיַבֵּשׁ."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה מַרְאֶה הַמִּשְׁפָּט \"הַדְּמָעוֹת עָמְדוּ לָהּ בָּעֵינַיִם\" (שׁוּרָה 8)?","options":["שֶׁנִּכְנַס לָהּ מַשֶּׁהוּ לָעַיִן","שֶׁתָּמָר הָיְתָה עֲצוּבָה וְכִמְעַט בָּכְתָה","שֶׁתָּמָר צָחֲקָה מְאוֹד","שֶׁהַמַּמְטֵרוֹת הִתִּיזוּ לָהּ מַיִם לָעֵינַיִם"],"answer":1,"exp":"כְּשֶׁהַדְּמָעוֹת עוֹמְדוֹת בָּעֵינַיִם, כִּמְעַט בּוֹכִים. תָּמָר הָיְתָה עֲצוּבָה וּדְאָגָה."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה תָּמָר כָּתְבָה מִכְתָּב לַסַּפְרָנִית?","options":["כְּדֵי לְהַזְמִין אוֹתָהּ לַגִּנָּה","כְּדֵי לְסַפֵּר לָהּ עַל שִׁירָה","כְּדֵי לְבַקֵּשׁ עוֹד סֵפֶר עַל הֶחָלָל","כְּדֵי לְבַקֵּשׁ סְלִיחָה וּלְהַבְטִיחַ לִשְׁמֹר עַל הַסְּפָרִים"],"answer":3,"exp":"בַּמִּכְתָּב (שׁוּרָה 12) הִיא מְבַקֶּשֶׁת סְלִיחָה וּמַבְטִיחָה לִשְׁמֹר טוֹב יוֹתֵר."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה לָמַדְנוּ עַל תָּמָר מֵהַסִּפּוּר?","options":["שֶׁהִיא כּוֹעֶסֶת עַל הַסַּפְרָנִית","שֶׁהִיא לֹא אוֹהֶבֶת לִקְרֹא","שֶׁהִיא מְפַחֶדֶת מִמַּיִם","שֶׁהִיא לוֹקַחַת אַחְרָיוּת עַל מָה שֶׁקָּרָה"],"answer":3,"exp":"תָּמָר סִפְּרָה מָה קָרָה, בִּקְּשָׁה סְלִיחָה וְהִבְטִיחָה לְהִזָּהֵר. זוֹ אַחְרָיוּת."},{"type":"open","tag":"calc","expr":"63 + 32 = ___","answer":95,"exp":"⁦63 + 32 = 95⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"57 − 16 = ___","answer":41,"exp":"⁦57 − 16 = 41⁩. בְּדִיקָה: ⁦41 + 16 = 57⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"9 × 3 = ___","answer":27,"exp":"⁦9 × 3 = 27⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"35 : 5 = ___","answer":7,"exp":"⁦35 : 5 = 7⁩, כִּי ⁦5 × 7 = 35⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 29 = 70","answer":41,"exp":"⁦70 − 29 = 41⁩, וְלָכֵן ⁦41 + 29 = 70⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"93 − ___ = 55","answer":38,"exp":"⁦93 − 55 = 38⁩, וְלָכֵן ⁦93 − 38 = 55⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"2 × ___ = 10","answer":5,"exp":"⁦2 × 5 = 10⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"3 × 5 < 3 × ___","min":6,"max":999,"exp":"בִּשְׁנֵי הַצְּדָדִים כּוֹפְלִים ב־3. צָרִיךְ מִסְפָּר גָּדוֹל מ־5, לְמָשָׁל 6.","answer":6,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + 4 = 20","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 8 + 8 + 4 = 20⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ = 16","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 8 + 8 = 16⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["star","star"],10],[["star","heart"],14]],"ask":["heart"]},"options":["8","9","10","11"],"answer":1,"exp":"שְׁנֵי כּוֹכָבִים = 10, אָז כּוֹכָב = 5. כּוֹכָב + לֵב = 14, אָז לֵב = ⁦14 − 5 = 9⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"לֵהּ קָטְפָה 32 תּוּתִים וְחִלְּקָה אוֹתָם שָׁוֶה בְּשָׁוֶה בֵּין 4 חֲבֵרִים. כַּמָּה תּוּתִים קִבֵּל כָּל חָבֵר?","options":["8","12","16","28"],"answer":0,"exp":"⁦32 : 4 = 8⁩, כִּי ⁦4 × 8 = 32⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בָּאוֹטוֹבּוּס הָיוּ 21 נוֹסְעִים. בַּתַּחֲנָה יָרְדוּ 12 נוֹסְעִים וְעָלוּ 4 נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?","options":["5","9","13","37"],"answer":2,"exp":"⁦21 − 12 = 9⁩, וְאָז ⁦9 + 4 = 13⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּסֵּפֶר יֵשׁ 60 עַמּוּדִים. גַּלִּי קָרְאָה 13 עַמּוּדִים בְּיוֹם רִאשׁוֹן, ו־17 עַמּוּדִים בְּיוֹם שֵׁנִי. כַּמָּה עַמּוּדִים נִשְׁאֲרוּ לָהּ לִקְרֹא?","options":["30","40","43","47"],"answer":0,"exp":"⁦13 + 17 = 30⁩ עַמּוּדִים נִקְרְאוּ. ⁦60 − 30 = 30⁩.","id":"m14","sec":"math"}]},{"n":6,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַקַּקְטוּס","lines":["הַקַּקְטוּס הוּא צֶמַח שֶׁגָּדַל בִּמְקוֹמוֹת חַמִּים וִיבֵשִׁים, כְּמוֹ הַמִּדְבָּר.","בַּמִּדְבָּר יוֹרֵד מְעַט גֶּשֶׁם, וְלִפְעָמִים לֹא יוֹרֵד גֶּשֶׁם בְּמֶשֶׁךְ חֳדָשִׁים.","כְּדֵי לִחְיוֹת שָׁם, לַקַּקְטוּס יֵשׁ גִּבְעוֹל עָבֶה שֶׁשּׁוֹמֵר בְּתוֹכוֹ מַיִם לִזְמַן רַב.","לְרֹב הַקַּקְטוּסִים אֵין עָלִים רְגִילִים. בִּמְקוֹם עָלִים יֵשׁ לָהֶם קוֹצִים.","הַקּוֹצִים עוֹזְרִים לַקַּקְטוּס בִּשְׁתֵּי דְּרָכִים:","הֵם שׁוֹמְרִים עָלָיו מִפְּנֵי חַיּוֹת שֶׁרוֹצוֹת לֶאֱכֹל אוֹתוֹ,","וְהֵם מְטִילִים צֵל קָטָן עַל הַגִּבְעוֹל, כָּךְ שֶׁהַשֶּׁמֶשׁ לֹא מְיַבֶּשֶׁת אוֹתוֹ.","יֵשׁ קַקְטוּסִים שֶׁפּוֹרְחִים רַק פַּעַם בְּשָׁנָה, בִּפְרָחִים צִבְעוֹנִיִּים וְיָפִים."]},{"kind":"story","title":"חָבֵר חָדָשׁ","lines":["בִּתְחִלַּת הַשָּׁנָה הִגִּיעַ לַכִּתָּה יֶלֶד חָדָשׁ בְּשֵׁם אַלּוֹן.","הוּא עָבַר לָגוּר בָּעִיר רַק לִפְנֵי שָׁבוּעַ, וְלֹא הִכִּיר אַף אֶחָד.","בַּהַפְסָקָה כָּל הַיְּלָדִים רָצוּ לֶחָצֵר, וְאַלּוֹן יָשַׁב לְבַד עַל הַסַּפְסָל וְהִסְתַּכֵּל.","נֹעַם שָׂם לֵב שֶׁאַלּוֹן יוֹשֵׁב לְבַד. הוּא נִזְכַּר אֵיךְ הִרְגִּישׁ כְּשֶׁהָיָה חָדָשׁ בַּגַּן.","\"רוֹצָה לְשַׂחֵק אִתָּנוּ מַחֲנַיִם?\" שָׁאַל נֹעַם.","אַלּוֹן מָשַׁךְ בַּכְּתֵפַיִם. \"אֲנִי לֹא יוֹדֵעַ לְשַׂחֵק טוֹב,\" אָמַר בְּשֶׁקֶט.","\"זֶה לֹא מְשַׁנֶּה,\" צָחַק נֹעַם. \"גַּם אֲנִי לֹא תָּמִיד תּוֹפֵס אֶת הַכַּדּוּר.\"","אַלּוֹן הִצְטָרֵף לַמִּשְׂחָק. בַּהַתְחָלָה הוּא הָיָה מְהֻסָּס, וְאַחַר כָּךְ כְּבָר רָץ וְצָחַק עִם כֻּלָּם.","בְּסוֹף הַהַפְסָקָה הוּא אָמַר לְנֹעַם: \"תּוֹדָה. זֶה הַבֹּקֶר הֲכִי טוֹב שֶׁלִּי מֵאָז שֶׁעָבַרְנוּ.\"","בַּצָּהֳרַיִם, בַּבַּיִת, אַלּוֹן סִפֵּר לְאִמָּא שֶׁלּוֹ שֶׁיֵּשׁ לוֹ כְּבָר חָבֵר בַּכִּתָּה.","מֵאוֹתוֹ יוֹם, אַלּוֹן וְנֹעַם שִׂחֲקוּ יַחַד בְּכָל הַפְסָקָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"אֵיפֹה הַקַּקְטוּס שׁוֹמֵר אֶת הַמַּיִם?","options":["בַּקּוֹצִים","בַּגִּבְעוֹל הֶעָבֶה","בִּפְרָחִים","בְּעָלִים"],"answer":1,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁלַּקַּקְטוּס יֵשׁ גִּבְעוֹל עָבֶה שֶׁשּׁוֹמֵר בְּתוֹכוֹ מַיִם."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה יֵשׁ לְרֹב הַקַּקְטוּסִים בִּמְקוֹם עָלִים?","options":["קוֹצִים","גִּבְעוֹלִים","פְּרָחִים","פֵּרוֹת"],"answer":0,"exp":"בְּשׁוּרָה 4 כָּתוּב: \"בִּמְקוֹם עָלִים יֵשׁ לָהֶם קוֹצִים\"."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 5 \"בִּשְׁתֵּי דְּרָכִים\"?","options":["כִּי יֵשׁ שְׁנֵי סוּגִים שֶׁל קַקְטוּסִים","כִּי הַקַּקְטוּס פּוֹרֵחַ פַּעֲמַיִם בְּשָׁנָה","כִּי אַחַר כָּךְ מַסְבִּירִים עַל שְׁנֵי דְּבָרִים שֶׁהַקּוֹצִים עוֹשִׂים","כִּי לַקַּקְטוּס יֵשׁ שְׁנֵי גִּבְעוֹלִים"],"answer":2,"exp":"בְּשׁוּרוֹת 6–7 מֻסְבָּרוֹת שְׁתֵּי הַדְּרָכִים: שְׁמִירָה מִפְּנֵי חַיּוּת, וְצֵל."},{"id":"r4","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלִּים \"מְטִילִים צֵל\" (שׁוּרָה 7)?","options":["זוֹרְקִים אֲבָנִים","שׁוֹתִים מַיִם","מְגַדְּלִים פְּרָחִים","יוֹצְרִים מָקוֹם מוּצָל, שֶׁהַשֶּׁמֶשׁ לֹא מַגִּיעָה אֵלָיו יָשָׁר"],"answer":3,"exp":"הַקּוֹצִים מְטִילִים צֵל – הֵם מַסְתִּירִים קְצָת אֶת הַשֶּׁמֶשׁ מֵהַגִּבְעוֹל."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["לָמָּה לַקַּקְטוּס יֵשׁ קוֹצִים?","כַּמָּה פְּעָמִים בַּשָּׁנָה פּוֹרְחִים חֵלֶק מֵהַקַּקְטוּסִים?","כַּמָּה שָׁנִים יָכוֹל קַקְטוּס לִחְיוֹת?","אֵיךְ הַקַּקְטוּס שׁוֹמֵר מַיִם?"],"answer":2,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה שָׁנִים חַי קַקְטוּס."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"לָמָּה אַלּוֹן לֹא הִכִּיר אַף אֶחָד?","options":["כִּי הוּא הִגִּיעַ בְּאֶמְצַע הַשָּׁנָה","כִּי הוּא לֹא אוֹהֵב יְלָדִים","כִּי הוּא עָבַר לָגוּר בָּעִיר רַק לִפְנֵי שָׁבוּעַ","כִּי הוּא הָיָה חוֹלֶה הַרְבֵּה זְמַן"],"answer":2,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁאַלּוֹן עָבַר לָגוּר בָּעִיר רַק לִפְנֵי שָׁבוּעַ."},{"id":"r7","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה נֹעַם הִזְמִין אֶת אַלּוֹן לְשַׂחֵק?","options":["כִּי הוּא נִזְכַּר אֵיךְ הִרְגִּישׁ כְּשֶׁהָיָה חָדָשׁ","כִּי הַמּוֹרָה בִּקְּשָׁה מִמֶּנּוּ","כִּי אַלּוֹן בִּקֵּשׁ לְשַׂחֵק","כִּי אַלּוֹן שַׂחְקָן מְצֻיָּן"],"answer":0,"exp":"בְּשׁוּרָה 4 נֹעַם נִזְכַּר אֵיךְ הִרְגִּישׁ כְּשֶׁהָיָה חָדָשׁ בַּגַּן, וְלָכֵן הֵבִין אֶת אַלּוֹן."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"מָשַׁךְ בַּכְּתֵפַיִם\" (שׁוּרָה 6)?","options":["דָּחַף אֶת נֹעַם","נָפַל מֵהַסַּפְסָל","הֵרִים מַשֶּׁהוּ כָּבֵד","הֵרִים אֶת הַכְּתֵפַיִם, כְּמוֹ שֶׁעוֹשִׂים כְּשֶׁלֹּא בְּטוּחִים"],"answer":3,"exp":"מוֹשְׁכִים בַּכְּתֵפַיִם כְּשֶׁלֹּא יוֹדְעִים אוֹ לֹא בְּטוּחִים מָה לְהַגִּיד."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה נֹעַם אָמַר \"גַּם אֲנִי לֹא תָּמִיד תּוֹפֵס אֶת הַכַּדּוּר\"?","options":["כְּדֵי לִצְחֹק עַל אַלּוֹן","כְּדֵי שֶׁאַלּוֹן לֹא יִתְבַּיֵּשׁ וְיַסְכִּים לְשַׂחֵק","כְּדֵי לְהִתְלוֹנֵן עַל הַמִּשְׂחָק","כִּי הוּא לֹא רָצָה לְשַׂחֵק"],"answer":1,"exp":"אַלּוֹן אָמַר שֶׁהוּא לֹא מִשְׂחָק טוֹב. נֹעַם הֶרְאָה לוֹ שֶׁזֶּה בְּסֵדֶר, כְּדֵי שֶׁיִּצְטָרֵף."},{"id":"r10","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"מְהֻסָּס\" (שׁוּרָה 8)?","options":["כּוֹעֵס","לֹא בָּטוּחַ בְּעַצְמוֹ","רָעָב","מָהִיר מְאוֹד"],"answer":1,"exp":"בַּהַתְחָלָה אַלּוֹן הָיָה מְהֻסָּס – עוֹד לֹא בָּטוּחַ – וְאַחַר כָּךְ כְּבָר רָץ וְצָחַק."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"אֵיךְ הִרְגִּישׁ אַלּוֹן בְּסוֹף הַהַפְסָקָה?","options":["שָׂמֵחַ, וְרָצָה לְהוֹדוֹת לְנֹעַם","עָצוּב וּבוֹדֵד","כּוֹעֵס עַל נֹעַם","עָיֵף וּמְשֻׁעֲמָם"],"answer":0,"exp":"בְּשׁוּרָה 9 אַלּוֹן אוֹמֵר תּוֹדָה וּמְסַפֵּר שֶׁזֶּה הַבֹּקֶר הֲכִי טוֹב שֶׁלּוֹ."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"אֵיזוֹ כּוֹתֶרֶת מַתְאִימָה לַסִּפּוּר?","options":["הַמִּשְׂחָק שֶׁהִפְסַדְנוּ","הַבַּיִת הֶחָדָשׁ שֶׁל נֹעַם","אֵיךְ זוֹרְקִים כַּדּוּר","חָבֵר חָדָשׁ בַּהַפְסָקָה"],"answer":3,"exp":"הַסִּפּוּר מְסַפֵּר אֵיךְ אַלּוֹן, הַיֶּלֶד הֶחָדָשׁ, מָצָא חָבֵר בַּהַפְסָקָה."},{"type":"open","tag":"calc","expr":"35 + 31 = ___","answer":66,"exp":"⁦35 + 31 = 66⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"87 − 43 = ___","answer":44,"exp":"⁦87 − 43 = 44⁩. בְּדִיקָה: ⁦44 + 43 = 87⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"4 × 2 = ___","answer":8,"exp":"⁦4 × 2 = 8⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"6 : 2 = ___","answer":3,"exp":"⁦6 : 2 = 3⁩, כִּי ⁦2 × 3 = 6⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 47 = 69","answer":22,"exp":"⁦69 − 47 = 22⁩, וְלָכֵן ⁦22 + 47 = 69⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"73 − ___ = 18","answer":55,"exp":"⁦73 − 18 = 55⁩, וְלָכֵן ⁦73 − 55 = 18⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"10 × ___ = 30","answer":3,"exp":"⁦10 × 3 = 30⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"60 + 10 < 60 + ___","min":11,"max":999,"exp":"מִצַּד שְׂמֹאל וּמִצַּד יָמִין יֵשׁ 60. כְּדֵי שֶׁהַצַּד הַיְּמָנִי יִהְיֶה גָּדוֹל יוֹתֵר, צָרִיךְ מִסְפָּר גָּדוֹל מ־10, לְמָשָׁל 11.","answer":11,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ = 14","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 7: 7 + 7 = 14⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ = 9","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 3: 3 + 3 + 3 = 9⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["heart","heart"],12],[["heart","star"],11]],"ask":["star"]},"options":["4","5","6","7"],"answer":1,"exp":"שְׁנֵי לְבָבוֹת = 12, אָז לֵב = 6. לֵב + כּוֹכָב = 11, אָז כּוֹכָב = ⁦11 − 6 = 5⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"טַלְיָה קָנְתָה 2 בֻּבּוֹת קְטַנּוֹת. כָּל בֻּבָּה עוֹלָה 5 ₪. טַלְיָה שִׁלְּמָה בִּשְׁטָר שֶׁל 20 ₪. כַּמָּה עֹדֶף קִבְּלָה?","options":["5","10","11","15"],"answer":1,"exp":"⁦2 × 5 = 10⁩ ₪ וְאָז ⁦20 − 10 = 10⁩ ₪ עֹדֶף.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"לְאַלּוֹן יֵשׁ 85 גֻּלּוֹת, וּלְאָחִיו יֵשׁ 37 גֻּלּוֹת. כַּמָּה גֻּלּוֹת יֵשׁ לְאַלּוֹן יוֹתֵר מֵאֲשֶׁר לְאָחִיו?","options":["38","48","58","122"],"answer":1,"exp":"מְחַפְּשִׂים אֶת הַהֶפְרֵשׁ: ⁦85 − 37 = 48⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּכִּתָּה שֶׁל אֵלָה יֵשׁ 6 שֻׁלְחָנוֹת. לְיַד כָּל שֻׁלְחָן יוֹשְׁבִים 5 יְלָדִים. כַּמָּה יְלָדִים יוֹשְׁבִים בַּכִּתָּה?","options":["11","25","30","35"],"answer":2,"exp":"6 שֻׁלְחָנוֹת, בְּכָל אֶחָד 5 יְלָדִים: ⁦6 × 5 = 30⁩.","id":"m14","sec":"math"}]},{"n":7,"level":"קל","printable":false,"passages":[{"kind":"info","title":"הַנְּמָלִים","lines":["הַנְּמָלִים הֵן חֲרָקִים קְטַנִּים שֶׁחַיִּים יַחַד בְּקֵן גָּדוֹל, מִתַּחַת לָאֲדָמָה.","בְּקֵן אֶחָד יְכוֹלוֹת לִחְיוֹת אַלְפֵי נְמָלִים, וּלְכָל אַחַת יֵשׁ עֲבוֹדָה.","בְּרֹאשׁ הַקֵּן עוֹמֶדֶת הַמַּלְכָּה. הַתַּפְקִיד שֶׁלָּהּ הוּא לְהַטִּיל בֵּיצִים.","נְמָלִים אֲחֵרוֹת מְטַפְּלוֹת בַּבֵּיצִים, בּוֹנוֹת מִנְהָרוֹת אוֹ יוֹצְאוֹת לְחַפֵּשׂ מָזוֹן.","כְּשֶׁנְּמָלָה מוֹצֵאת מָזוֹן, הִיא חוֹזֶרֶת לַקֵּן וּמַשְׁאִירָה בַּדֶּרֶךְ רֵיחַ מְיֻחָד.","הַנְּמָלִים הָאֲחֵרוֹת מְרִיחוֹת אֶת הָרֵיחַ וְהוֹלְכוֹת בְּעִקְבוֹתָיו, יָשָׁר אֶל הַמָּזוֹן.","לָכֵן אֲנַחְנוּ רוֹאִים לִפְעָמִים שׁוּרָה אֲרֻכָּה שֶׁל נְמָלִים שֶׁהוֹלְכוֹת בְּאוֹתָהּ דֶּרֶךְ.","הַנְּמָלָה קְטַנָּה מְאוֹד, אֲבָל הִיא חֲזָקָה: הִיא יְכוֹלָה לִסְחֹב דָּבָר כָּבֵד מִמֶּנָּה פִּי כַּמָּה."]},{"kind":"story","title":"הַמְתָּנָה לַסָּבְתָא","lines":["בְּעוֹד שָׁבוּעַ יִהְיֶה יוֹם הַהֻלֶּדֶת שֶׁל סָבְתָא אֶסְתֵּר, וְיָעֵל רָצְתָה לָתֵת לָהּ מַתָּנָה.","הִיא פָּתְחָה אֶת הַקֻּפָּה שֶׁלָּהּ וְסָפְרָה: הָיוּ בָּהּ רַק שִׁבְעָה שְׁקָלִים.","\"עִם שִׁבְעָה שְׁקָלִים אִי אֶפְשָׁר לִקְנוֹת שׁוּם דָּבָר יָפֶה,\" אָמְרָה בְּעֶצֶב.","אַבָּא הִצִּיעַ: \"אוּלַי תָּכִינִי מַשֶּׁהוּ בְּעַצְמֵךְ? סָבְתָא אוֹהֶבֶת דְּבָרִים שֶׁעוֹשִׂים בְּאַהֲבָה.\"","יָעֵל חָשְׁבָה וְחָשְׁבָה. הִיא נִזְכְּרָה שֶׁסָּבְתָא תָּמִיד מְסַפֶּרֶת סִפּוּרִים מֵהַיָּמִים שֶׁהָיְתָה יַלְדָּה.","יָעֵל לָקְחָה מַחְבֶּרֶת רֵיקָה, וְכָתְבָה עַל הַכְּרִיכָה: \"הַסִּפּוּרִים שֶׁל סָבְתָא\".","בְּכָל עַמּוּד הִיא צִיְּרָה צִיּוּר מֵאֶחָד הַסִּפּוּרִים: הַבַּיִת הַיָּשָׁן, הַחֲמוֹר שֶׁל הַשְּׁכֵנִים, הַיָּם.","בְּסוֹף הַמַּחְבֶּרֶת הִיא הִשְׁאִירָה דַּפִּים רֵיקִים, וְכָתְבָה: \"לַסִּפּוּרִים שֶׁעוֹד תְּסַפְּרִי לִי.\"","בְּיוֹם הַהֻלֶּדֶת סָבְתָא פָּתְחָה אֶת הַמַּתָּנָה. הִיא דִּפְדְּפָה לְאַט, עַמּוּד אַחֲרֵי עַמּוּד.","כְּשֶׁהִגִּיעָה לַדַּפִּים הָרֵיקִים, הִיא הוֹרִידָה אֶת הַמִּשְׁקָפַיִם וְנִגְּבָה אֶת הָעֵינַיִם.","\"זוֹ הַמַּתָּנָה הֲכִי יָפֶה שֶׁקִּבַּלְתִּי אֵי פַּעַם,\" לָחֲשָׁה, וְחִבְּקָה אֶת יָעֵל חָזָק.","בְּאוֹתוֹ עֶרֶב סָבְתָא סִפְּרָה סִפּוּר חָדָשׁ, וְיָעֵל צִיְּרָה אוֹתוֹ בַּדַּף הָרֵיק הָרִאשׁוֹן."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה הַתַּפְקִיד שֶׁל הַמַּלְכָּה?","options":["לִשְׁמֹר עַל הַפֶּתַח","לְחַפֵּשׂ מָזוֹן","לִבְנוֹת מִנְהָרוֹת","לְהַטִּיל בֵּיצִים"],"answer":3,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁהַתַּפְקִיד שֶׁל הַמַּלְכָּה הוּא לְהַטִּיל בֵּיצִים."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַנְּמָלָה מַשְׁאִירָה רֵיחַ בַּדֶּרֶךְ חֲזָרָה לַקֵּן?","options":["כְּדֵי שֶׁהַנְּמָלִים הָאֲחֵרוֹת יִמְצְאוּ אֶת הַמָּזוֹן","כְּדֵי שֶׁהַמַּלְכָּה תֵּדַע שֶׁהִיא חָזְרָה","כִּי הִיא מְלֻכְלֶכֶת","כְּדֵי לְהַפְחִיד חֲרָקִים אֲחֵרִים"],"answer":0,"exp":"בְּשׁוּרָה 6 כָּתוּב שֶׁהַנְּמָלִים הָאֲחֵרוֹת הוֹלְכוֹת אַחֲרֵי הָרֵיחַ, יָשָׁר אֶל הַמָּזוֹן."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"בְּעִקְבוֹתָיו\" (שׁוּרָה 6)?","options":["בִּמְקוֹמוֹ","לְפָנָיו","אַחֲרָיו, בַּדֶּרֶךְ שֶׁהוּא מְסַמֵּן","נֶגְדּוֹ"],"answer":2,"exp":"לָלֶכֶת בְּעִקְבוֹת הָרֵיחַ – לָלֶכֶת אַחֲרֵי הָרֵיחַ, בַּדֶּרֶךְ שֶׁהוּא מַרְאֶה."},{"id":"r4","sec":"read","p":0,"tag":"d","type":"mc","q":"לָמָּה אֲנַחְנוּ רוֹאִים לִפְעָמִים שׁוּרָה אֲרֻכָּה שֶׁל נְמָלִים?","options":["כִּי כֻּלָּן הוֹלְכוֹת אַחֲרֵי אוֹתוֹ רֵיחַ אֶל הַמָּזוֹן","כִּי הֵן בּוֹרְחוֹת מֵהַגֶּשֶׁם","כִּי הֵן מְשַׂחֲקוֹת יַחַד","כִּי הַמַּלְכָּה הוֹלֶכֶת בָּרֹאשׁ"],"answer":0,"exp":"בְּשׁוּרוֹת 6–7: כֻּלָּן הוֹלְכוֹת בְּעִקְבוֹת אוֹתוֹ רֵיחַ, לָכֵן הֵן הוֹלְכוֹת בְּשׁוּרָה."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מָה הַנְּמָלִים אוֹכְלוֹת?","מָה עוֹשָׂה הַמַּלְכָּה?","אֵיפֹה נִמְצָא הַקֵּן?","אֵיךְ נְמָלָה מַרְאָה לַאֲחֵרוֹת אֵיפֹה הַמָּזוֹן?"],"answer":0,"exp":"הַקֶּטַע מְסַפֵּר שֶׁהַנְּמָלִים מְחַפְּשׂוֹת מָזוֹן, אֲבָל לֹא מְסַפֵּר אֵיזֶה מָזוֹן."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"כַּמָּה כֶּסֶף הָיָה לְיָעֵל בַּקֻּפָּה?","options":["שִׁבְעִים שְׁקָלִים","שֶׁקֶל אֶחָד","לֹא הָיָה לָהּ כֶּסֶף בִּכְלָל","שִׁבְעָה שְׁקָלִים"],"answer":3,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהָיוּ בַּקֻּפָּה רַק שִׁבְעָה שְׁקָלִים."},{"id":"r7","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה הִצִּיעַ אַבָּא?","options":["שֶׁיָּעֵל תָּשִׁיר לַסָּבְתָא שִׁיר","שֶׁיָּעֵל תָּכִין מַתָּנָה בְּעַצְמָהּ","שֶׁיָּעֵל תַּחֲסֹךְ עוֹד כֶּסֶף","שֶׁהוּא יִקְנֶה אֶת הַמַּתָּנָה"],"answer":1,"exp":"בְּשׁוּרָה 4 אַבָּא אוֹמֵר: \"אוּלַי תָּכִינִי מַשֶּׁהוּ בְּעַצְמֵךְ?\"."},{"id":"r8","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה יָעֵל צִיְּרָה אֶת הַבַּיִת הַיָּשָׁן, אֶת הַחֲמוֹר וְאֶת הַיָּם?","options":["כִּי הִיא אוֹהֶבֶת חֲמוֹרִים","כִּי הֵם מֵהַסִּפּוּרִים שֶׁסָּבְתָא מְסַפֶּרֶת","כִּי הַמּוֹרָה בִּקְּשָׁה","כִּי הִיא רָאֲתָה אוֹתָם בַּטִּיּוּל"],"answer":1,"exp":"בְּשׁוּרוֹת 5–7: יָעֵל צִיְּרָה צִיּוּרִים מִתּוֹךְ הַסִּפּוּרִים שֶׁל סָבְתָא."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"כְּרִיכָה\" (שׁוּרָה 6)?","options":["צִיּוּר שֶׁל בַּיִת","הַכִּסּוּי שֶׁמִּבַּחוּץ שֶׁל הַמְּחַבֶּרֶת","הָעַמּוּד הָאַחֲרוֹן בַּמַּחְבֶּרֶת","עִפָּרוֹן צִבְעוֹנִי"],"answer":1,"exp":"הַכְּרִיכָה הִיא הַכִּסּוּי שֶׁל מַחְבֶּרֶת אוֹ שֶׁל סֵפֶר, וְשָׁם כּוֹתְבִים אֶת הַשֵּׁם."},{"id":"r10","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה יָעֵל הִשְׁאִירָה דַּפִּים רֵיקִים בְּסוֹף הַמַּחְבֶּרֶת?","options":["כִּי נִגְמְרוּ לָהּ הַצְּבָעִים","כִּי סָבְתָא בִּקְּשָׁה מִמֶּנָּה","כִּי לֹא הָיָה לָהּ זְמַן לְצַיֵּר","כְּדֵי שֶׁיִּהְיֶה מָקוֹם לְסִפּוּרִים חֲדָשִׁים שֶׁל סָבְתָא"],"answer":3,"exp":"בְּשׁוּרָה 8 הִיא כָּתְבָה: \"לַסִּפּוּרִים שֶׁעוֹד תְּסַפְּרִי לִי\"."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה סָבְתָא נִגְּבָה אֶת הָעֵינַיִם (שׁוּרָה 10)?","options":["כִּי הַמִּשְׁקָפַיִם הָיוּ מְלֻכְלָכִים","כִּי הִיא הָיְתָה עֲיֵפָה","כִּי הִיא הִתְרַגְּשָׁה מְאוֹד מֵהַמַּתָּנָה","כִּי נִכְנַס לָהּ אָבָק לָעַיִן"],"answer":2,"exp":"מִיָּד אַחַר כָּךְ סָבְתָא אוֹמֶרֶת שֶׁזּוֹ הַמַּתָּנָה הֲכִי יָפֶה – הִיא הִתְרַגְּשָׁה עַד דְּמָעוֹת."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה הַמֶּסֶר שֶׁל הַסִּפּוּר?","options":["סָבְתוֹת לֹא אוֹהֲבוֹת מַתָּנוֹת","צָרִיךְ לַחֲסֹךְ הַרְבֵּה כֶּסֶף לִפְנֵי יוֹם הֻלֶּדֶת","מַתָּנָה שֶׁעוֹשִׂים בְּאַהֲבָה יְכוֹלָה לִהְיוֹת שָׁוָה יוֹתֵר מִמַּתָּנָה יְקָרָה","צָרִיךְ תָּמִיד לִקְנוֹת מַתָּנוֹת בַּחֲנוּת"],"answer":2,"exp":"לְיָעֵל לֹא הָיָה כֶּסֶף, אֲבָל הַמַּתָּנָה שֶׁהֵכִינָה בְּאַהֲבָה הָיְתָה \"הֲכִי יָפָה\"."},{"type":"open","tag":"calc","expr":"60 + 16 = ___","answer":76,"exp":"⁦60 + 16 = 76⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"44 − 31 = ___","answer":13,"exp":"⁦44 − 31 = 13⁩. בְּדִיקָה: ⁦13 + 31 = 44⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"3 × 10 = ___","answer":30,"exp":"⁦3 × 10 = 30⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"32 : 4 = ___","answer":8,"exp":"⁦32 : 4 = 8⁩, כִּי ⁦4 × 8 = 32⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 32 = 77","answer":45,"exp":"⁦77 − 32 = 45⁩, וְלָכֵן ⁦45 + 32 = 77⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"72 − ___ = 16","answer":56,"exp":"⁦72 − 16 = 56⁩, וְלָכֵן ⁦72 − 56 = 16⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"5 × ___ = 30","answer":6,"exp":"⁦5 × 6 = 30⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"73 − 9 > 73 − ___","min":10,"max":73,"exp":"כְּשֶׁמּוֹרִידִים יוֹתֵר, נִשְׁאַר פָּחוֹת. צָרִיךְ לְהוֹרִיד יוֹתֵר מ־9, לְמָשָׁל 10.","answer":10,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ = 6","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 2: 2 + 2 + 2 = 6⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + 2 = 10","options":["⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 4: 4 + 4 + 2 = 10⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle"],6],[["circle","heart"],5]],"ask":["heart"]},"options":["1","2","3","4"],"answer":1,"exp":"שְׁנֵי עִגּוּלִים = 6, אָז עִגּוּל = 3. עִגּוּל + לֵב = 5, אָז לֵב = ⁦5 − 3 = 2⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"אֵיתָן קָטַף 30 תּוּתִים וְחִלֵּק אוֹתָם שָׁוֶה בְּשָׁוֶה בֵּין 5 חֲבֵרִים. כַּמָּה תּוּתִים קִבֵּל כָּל חָבֵר?","options":["6","11","12","25"],"answer":0,"exp":"⁦30 : 5 = 6⁩, כִּי ⁦5 × 6 = 30⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בָּאוֹטוֹבּוּס הָיוּ 24 נוֹסְעִים. בַּתַּחֲנָה יָרְדוּ 15 נוֹסְעִים וְעָלוּ 14 נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?","options":["9","23","38","53"],"answer":1,"exp":"⁦24 − 15 = 9⁩, וְאָז ⁦9 + 14 = 23⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּסֵּפֶר יֵשׁ 50 עַמּוּדִים. לֵהּ קָרְאָה 15 עַמּוּדִים בְּיוֹם רִאשׁוֹן, ו־12 עַמּוּדִים בְּיוֹם שֵׁנִי. כַּמָּה עַמּוּדִים נִשְׁאֲרוּ לָהּ לִקְרֹא?","options":["23","27","33","35"],"answer":0,"exp":"⁦15 + 12 = 27⁩ עַמּוּדִים נִקְרְאוּ. ⁦50 − 27 = 23⁩.","id":"m14","sec":"math"}]},{"n":8,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"צַב הַיָּם","lines":["צַבֵּי יָם חַיִּים רֹב הַזְּמַן בַּמַּיִם, וְשׁוֹחִים לְמֶרְחַקִּים אֲרֻכִּים מְאוֹד.","בְּנִגּוּד לַצָּב הַיַּבָּשָׁה, לַצָּב הַיָּם יֵשׁ רַגְלַיִם שְׁטוּחוֹת שֶׁנִּרְאוֹת כְּמוֹ מְשׁוֹטִים.","הֵן עוֹזְרוֹת לוֹ לִשְׂחוֹת מַהֵר, אֲבָל בַּיַּבָּשָׁה הוּא זָז לְאַט וּבְקֹשִׁי.","בְּכָל זֹאת, הַנְּקֵבָה יוֹצֵאת אֶל הַחוֹף כְּדֵי לְהַטִּיל בֵּיצִים.","הִיא חוֹפֶרֶת בּוֹר בַּחוֹל, מְטִילָה בּוֹ בֵּיצִים רַבּוֹת, מְכַסָּה אוֹתָן וְחוֹזֶרֶת לַיָּם.","הַחֹם שֶׁל הַחוֹל מְחַמֵּם אֶת הַבֵּיצִים. אַחֲרֵי כְּחָדְשַׁיִם בּוֹקְעִים מֵהֶן צַבִּים קְטַנִּים.","הַצַּבִּים הַקְּטַנִּים זוֹחֲלִים מִיָּד אֶל הַיָּם. רֻבָּם יוֹצְאִים בַּלַּיְלָה, כְּשֶׁקָּשֶׁה לִרְאוֹת אוֹתָם.","כַּיּוֹם צַבֵּי הַיָּם בְּסַכָּנָה: הֵם אוֹכְלִים בְּטָעוּת שַׂקִּיּוֹת נַיְלוֹן שֶׁנִּרְאוֹת לָהֶם כְּמוֹ מֵדוּזוֹת.","לָכֵן חָשׁוּב מְאוֹד לֹא לְהַשְׁאִיר אַשְׁפָּה עַל הַחוֹף."]},{"kind":"story","title":"הַמֵּרוֹץ","lines":["בְּיוֹם הַסְּפּוֹרְט שֶׁל בֵּית הַסֵּפֶר, עִדּוֹ חִכָּה בְּעִקָּר לְדָבָר אֶחָד: הַמֵּרוֹץ.","כָּל הַשָּׁבוּעַ הוּא הִתְאַמֵּן בְּרִיצָה בֶּחָצֵר, וְהָיָה בָּטוּחַ שֶׁיְּנַצֵּחַ.","כְּשֶׁנִּשְׁמְעָה הַשְּׁרִיקָה, עִדּוֹ פָּרַץ קָדִימָה, וְתוֹךְ רֶגַע כְּבָר הָיָה רִאשׁוֹן.","בְּאֶמְצַע הַדֶּרֶךְ הוּא שָׁמַע מֵאֲחוֹרָיו צְעָקָה. הוּא הִסְתּוֹבֵב וְרָאָה אֶת גַּיְא שׁוֹכֵב עַל הַדֶּשֶׁא.","גַּיְא נָפַל, וְהַבֶּרֶךְ שֶׁלּוֹ נִשְׂרְטָה וְדִמְּמָה. הוּא הֶחְזִיק אוֹתָהּ וּבָכָה.","עִדּוֹ עָמַד רֶגַע בַּמָּקוֹם. הוּא הִסְתַּכֵּל עַל קַו הַסִּיּוּם, וְאַחַר כָּךְ עַל גַּיְא.","כָּל הַיְּלָדִים הָאֲחֵרִים כְּבָר עָקְפוּ אוֹתוֹ וְרָצוּ הָלְאָה.","עִדּוֹ חָזַר אֶל גַּיְא, עָזַר לוֹ לָקוּם, וְתָמַךְ בּוֹ עַד שֶׁהִגִּיעוּ יַחַד אֶל הַמּוֹרָה.","הַמֵּרוֹץ נִגְמַר. עִדּוֹ לֹא קִבֵּל מֵדַלְיָה, וַאֲפִלּוּ לֹא הִגִּיעַ בְּמָקוֹם שְׁלִישִׁי.","בַּדֶּרֶךְ הַבַּיְתָה הוּא הָיָה שָׁקֵט. \"הִתְאַמַּנְתִּי כָּל כָּךְ,\" אָמַר לְאִמָּא, \"וּבַסּוֹף לֹא נִצַּחְתִּי.\"","לְמָחֳרָת, בִּתְחִלַּת הַבֹּקֶר, הַמְּנַהֶלֶת עָלְתָה לַבָּמָה שֶׁבֶּחָצֵר.","\"אֶתְמוֹל רָאִיתִי נִצָּחוֹן מְיֻחָד,\" אָמְרָה, \"נִצָּחוֹן שֶׁלֹּא מְקַבְּלִים עָלָיו מֵדַלְיָה רְגִילָה.\"","הִיא קָרְאָה לְעִדּוֹ וְנָתְנָה לוֹ תְּעוּדָה. עַל הַתְּעוּדָה הָיָה כָּתוּב: \"פְּרָס הֶחָבֵר הַטּוֹב\".","גַּיְא, עִם פְּלַסְטֵר גָּדוֹל עַל הַבֶּרֶךְ, מָחָא כַּפַּיִם הֲכִי חָזָק."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"אֵיךְ נִרְאוֹת הָרַגְלַיִם שֶׁל צַב הַיָּם?","options":["אֲרֻכּוֹת וְדַקּוֹת","קְצָרוֹת וַעֲגֻלּוֹת","שְׁטוּחוֹת, כְּמוֹ מְשׁוֹטִים","עִם צִפָּרְנַיִם חַדּוֹת"],"answer":2,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהָרַגְלַיִם שְׁטוּחוֹת וְנִרְאוֹת כְּמוֹ מְשׁוֹטִים."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"בְּקֹשִׁי\" (שׁוּרָה 3)?","options":["מַהֵר מְאוֹד","בְּשֶׁקֶט","בְּמַאֲמָץ גָּדוֹל, לֹא בְּקַלּוּת","בְּשִׂמְחָה"],"answer":2,"exp":"בַּיַּבָּשָׁה צַב הַיָּם זָז לְאַט וּבְקֹשִׁי – קָשֶׁה לוֹ לָלֶכֶת שָׁם."},{"id":"r3","sec":"read","p":0,"tag":"c","type":"mc","q":"מָה הַהֶבְדֵּל בֵּין צַב הַיָּם לַצָּב הַיַּבָּשָׁה, לְפִי שׁוּרָה 2?","options":["לַצָּב הַיָּם יֵשׁ רַגְלַיִם שְׁטוּחוֹת כְּמוֹ מְשׁוֹטִים","לַצָּב הַיָּם אֵין שִׁרְיוֹן","צַב הַיָּם גָּדוֹל יוֹתֵר","צַב הַיָּם אוֹכֵל מֵדוּזוֹת"],"answer":0,"exp":"בְּשׁוּרָה 2 כָּתוּב: \"בְּנִגּוּד לַצָּב הַיַּבָּשָׁה, לַצָּב הַיָּם יֵשׁ רַגְלַיִם שְׁטוּחוֹת\"."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"לָמָּה טוֹב לַצַּבִּים הַקְּטַנִּים לָצֵאת אֶל הַיָּם בַּלַּיְלָה?","options":["כִּי בַּלַּיְלָה קָשֶׁה לִחְיוֹת אֲחֵרוֹת לִרְאוֹת אוֹתָם","כִּי בַּלַּיְלָה הַיָּם חַם יוֹתֵר","כִּי בְּיוֹם הַחוֹל קַר מִדַּי","כִּי בַּיּוֹם הֵם יְשֵׁנִים"],"answer":0,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁבַּלַּיְלָה קָשֶׁה לִרְאוֹת אוֹתָם – כָּךְ הֵם שְׁמוּרִים יוֹתֵר."},{"id":"r5","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 9 שֶׁחָשׁוּב לֹא לְהַשְׁאִיר אַשְׁפָּה עַל הַחוֹף?","options":["כִּי צַבִּים אוֹהֲבִים לְשַׂחֵק בְּשַׂקִּיּוֹת","כִּי הָאַשְׁפָּה מְחַמֶּמֶת אֶת הַבֵּיצִים","כִּי עַל הַחוֹף אֵין פַּחִים","כִּי שַׂקִּיּוֹת מֵהַחוֹף יְכוֹלוֹת לְהַגִּיעַ לַיָּם וְלִפְגֹּעַ בְּצַבִּים"],"answer":3,"exp":"בְּשׁוּרָה 8 כָּתוּב שֶׁהַצַּבִּים אוֹכְלִים שַׂקִּיּוֹת בְּטָעוּת. לָכֵן אָסוּר לְהַשְׁאִיר אַשְׁפָּה."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"לָמָּה עִדּוֹ הָיָה בָּטוּחַ שֶׁיְּנַצֵּחַ?","options":["כִּי גַּיְא לֹא הִשְׁתַּתֵּף","כִּי הוּא הִתְאַמֵּן כָּל הַשָּׁבוּעַ","כִּי הוּא הֲכִי גָּבוֹהַּ בַּכִּתָּה","כִּי הַמּוֹרָה אָמְרָה לוֹ"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁעִדּוֹ הִתְאַמֵּן כָּל הַשָּׁבוּעַ."},{"id":"r7","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"פֶּרֶץ קָדִימָה\" (שׁוּרָה 3)?","options":["נָפַל עַל הַדֶּשֶׁא","הִתְחִיל לָרוּץ מַהֵר מְאוֹד","עָצַר בַּמָּקוֹם","שָׁבַר מַשֶּׁהוּ"],"answer":1,"exp":"בְּרֶגַע הַשְּׁרִיקָה עִדּוֹ פָּרַץ קָדִימָה – זִנֵּק וְרָץ מַהֵר, וּמִיָּד הָיָה רִאשׁוֹן."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה מַרְאָה שׁוּרָה 6 עַל עִדּוֹ?","options":["שֶׁהוּא לֹא רָאָה אֶת גַּיְא","שֶׁהוּא הִתְלַבֵּט מָה לַעֲשׂוֹת","שֶׁהוּא הָיָה עָיֵף","שֶׁהוּא כָּעַס עַל גַּיְא"],"answer":1,"exp":"עִדּוֹ הִסְתַּכֵּל עַל קַו הַסִּיּוּם וְאַחַר כָּךְ עַל גַּיְא – הוּא הִתְלַבֵּט: לְהַמְשִׁיךְ אוֹ לַעֲזֹר."},{"id":"r9","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשָׂה עִדּוֹ אַחֲרֵי שֶׁגַּיְא נָפַל?","options":["צָחַק עָלָיו","הִמְשִׁיךְ לָרוּץ לְקַו הַסִּיּוּם","קָרָא לַמּוֹרָה מֵרָחוֹק","חָזַר אֵלָיו וְעָזַר לוֹ לְהַגִּיעַ אֶל הַמּוֹרָה"],"answer":3,"exp":"בְּשׁוּרָה 8 עִדּוֹ חוֹזֵר אֶל גַּיְא, עוֹזֵר לוֹ לָקוּם וְתוֹמֵךְ בּוֹ."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"אֵיךְ הִרְגִּישׁ עִדּוֹ בַּדֶּרֶךְ הַבַּיְתָה?","options":["גֵּאֶה מְאוֹד","שָׂמֵחַ","מְבֹהָל","מְאֻכְזָב"],"answer":3,"exp":"עִדּוֹ הָיָה שָׁקֵט וְאָמַר \"בַּסּוֹף לֹא נִצַּחְתִּי\" – הוּא הָיָה מְאֻכְזָב."},{"id":"r11","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֶּנֶת הַמְּנַהֶלֶת כְּשֶׁהִיא אוֹמֶרֶת \"נִצָּחוֹן מְיֻחָד\" (שׁוּרָה 12)?","options":["לָרִיצָה הַמְּהִירָה שֶׁל עִדּוֹ","לְיֶלֶד שֶׁהִגִּיעַ רִאשׁוֹן בַּמֵּרוֹץ","לְמַעֲשֶׂה הַטּוֹב שֶׁל עִדּוֹ, שֶׁעָזַר לְחַבֵּר","לַפְּלַסְטֵר שֶׁל גַּיְא"],"answer":2,"exp":"הַמְּנַהֶלֶת נָתְנָה לְעִדּוֹ \"פְּרָס הֶחָבֵר הַטּוֹב\" – הַנִּצָּחוֹן הוּא הָעֶזְרָה לְגַיְא."},{"id":"r12","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 14 שֶׁגַּיְא מָחָא כַּפַּיִם \"הֲכִי חָזָק\"?","options":["כְּדֵי לְהַרְאוֹת שֶׁגַּיְא מַעֲרִיךְ מְאוֹד אֶת מָה שֶׁעִדּוֹ עָשָׂה בִּשְׁבִילוֹ","כִּי גַּיְא רָצָה לְקַבֵּל תְּעוּדָה","כִּי לְגַיְא יֵשׁ יָדַיִם חֲזָקוֹת","כִּי גַּיְא נִצֵּחַ בַּמֵּרוֹץ"],"answer":0,"exp":"עִדּוֹ עָזַר לְגַיְא, וְגַיְא שָׂמֵחַ בִּמְיֻחָד בִּשְׁבִילוֹ."},{"type":"open","tag":"calc","expr":"32 + 18 = ___","answer":50,"exp":"⁦32 + 18 = 50⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"42 − 25 = ___","answer":17,"exp":"⁦42 − 25 = 17⁩. בְּדִיקָה: ⁦17 + 25 = 42⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"9 × 5 = ___","answer":45,"exp":"⁦9 × 5 = 45⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"24 : 3 = ___","answer":8,"exp":"⁦24 : 3 = 8⁩, כִּי ⁦3 × 8 = 24⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 22 = 67","answer":45,"exp":"⁦67 − 22 = 45⁩, וְלָכֵן ⁦45 + 22 = 67⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"83 − ___ = 49","answer":34,"exp":"⁦83 − 49 = 34⁩, וְלָכֵן ⁦83 − 34 = 49⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 4 = 9","answer":36,"exp":"⁦36 : 4 = 9⁩, כִּי ⁦4 × 9 = 36⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"9 × 4 < 9 × ___","min":5,"max":999,"exp":"בִּשְׁנֵי הַצְּדָדִים כּוֹפְלִים ב־9. צָרִיךְ מִסְפָּר גָּדוֹל מ־4, לְמָשָׁל 5.","answer":5,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ − 7 = 11","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":3,"exp":"נְצִיב ⁦△ = 9: 9 + 9 − 7 = 11⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ − 7 = 11","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 6: 6 + 6 + 6 − 7 = 11⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square","square"],21],[["square","star"],9]],"ask":["star","star"]},"options":["3","4","5","6"],"answer":1,"exp":"שְׁלוֹשָׁה רִבּוּעִים = 21, אָז רִבּוּעַ = 7. כּוֹכָב = ⁦9 − 7 = 2⁩. שְׁנֵי כּוֹכָבִים: ⁦2 + 2 = 4⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"לֵהּ קָנְתָה 4 מַחְבָּרוֹת. כָּל מַחְבֶּרֶת עוֹלֶה 9 ₪. לֵהּ שִׁלְּמָה בִּשְׁטָר שֶׁל 50 ₪. כַּמָּה עֹדֶף קִבְּלָה?","options":["14","23","36","41"],"answer":0,"exp":"⁦4 × 9 = 36⁩ ₪ וְאָז ⁦50 − 36 = 14⁩ ₪ עֹדֶף.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"לְאַלּוֹן יֵשׁ 50 חֲרוּזִים, וּלְאָחִיו יֵשׁ 34 חֲרוּזִים. כַּמָּה חֲרוּזִים יֵשׁ לְאַלּוֹן יוֹתֵר מֵאֲשֶׁר לְאָחִיו?","options":["6","16","26","84"],"answer":1,"exp":"מְחַפְּשִׂים אֶת הַהֶפְרֵשׁ: ⁦50 − 34 = 16⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּסַּל הָיוּ 14 תַּפּוּחִים. נֹעָה הוֹצִיאָה מֵהַסַּל חֲצִי מֵהַתַּפּוּחִים, וְאַחַר כָּךְ הוֹסִיפָה לַסַּל עוֹד 6 תַּפּוּחִים. כַּמָּה תַּפּוּחִים יֵשׁ עַכְשָׁו בַּסַּל?","options":["7","8","13","20"],"answer":2,"exp":"חֵצִי מ־14 הוּא 7. נִשְׁאֲרוּ 7, וְעוֹד ⁦6: 13⁩.","id":"m14","sec":"math"}]},{"n":9,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַיַּנְשׁוּף","lines":["הַיַּנְשׁוּף הוּא עוֹף דּוֹרֵס שֶׁפָּעִיל בְּעִקָּר בַּלַּיְלָה.","יֵשׁ לוֹ עֵינַיִם גְּדוֹלוֹת מְאוֹד, שֶׁעוֹזְרוֹת לוֹ לִרְאוֹת גַּם כְּשֶׁיֵּשׁ מְעַט אוֹר.","הָעֵינַיִם שֶׁל הַיַּנְשׁוּף לֹא זָזוֹת לַצְּדָדִים, כְּמוֹ הָעֵינַיִם שֶׁלָּנוּ.","לָכֵן, כְּדֵי לְהִסְתַּכֵּל הַצִּדָּה, הוּא מְסוֹבֵב אֶת כָּל הָרֹאשׁ, כִּמְעַט עַד הַגַּב.","גַּם הַשְּׁמִיעָה שֶׁל הַיַּנְשׁוּף חַדָּה מְאוֹד. הוּא שׁוֹמֵעַ עַכְבָּר שֶׁזָּז בֵּין הֶעָלִים, גַּם בַּחֹשֶׁךְ.","הַנּוֹצוֹת שֶׁל הַיַּנְשׁוּף רַכּוֹת, וְלָכֵן הוּא עָף בְּשֶׁקֶט, כִּמְעַט בְּלִי שׁוּם רַעַשׁ.","כָּךְ הוּא יָכוֹל לְהִתְקָרֵב אֶל הַטֶּרֶף בְּלִי שֶׁהַטֶּרֶף יִשְׁמַע אוֹתוֹ.","חַקְלָאִים רַבִּים בּוֹנִים לַיַּנְשׁוּפִים תֵּבוֹת קִנּוּן בַּשָּׂדוֹת.","הֵם שְׂמֵחִים לַעֲזֹר לַיַּנְשׁוּפִים, כִּי הַיַּנְשׁוּפִים צָדִים עַכְבָּרִים שֶׁאוֹכְלִים אֶת הַיְּבוּל."]},{"kind":"story","title":"הָעוּגָה הַשְּׁחֹרָה","lines":["בְּיוֹם שִׁשִּׁי אִמָּא נָסְעָה לְבַקֵּר אֶת דּוֹדָה רִנָּה, וְאַבָּא נִשְׁאַר בַּבַּיִת עִם מִיכַל וְעִם אָחִיהָ הַקָּטָן, יוֹאָב.","\"בּוֹאוּ נָכִין לְאִמָּא הַפְתָּעָה,\" הִצִּיעָה מִיכַל. \"נֶאֱפָה לָהּ עוּגַת שׁוֹקוֹלָד!\"","אַבָּא הִסְכִּים, וְהוֹצִיא מֵהָאָרוֹן קְעָרָה, קֶמַח, בֵּיצִים וְקָקָאוֹ.","מִיכַל קָרְאָה אֶת הַמַּתְכּוֹן בְּקוֹל, וְיוֹאָב שָׁפַךְ וְעִרְבֵּב. הַקֶּמַח עָף לְכָל עֵבֶר.","כְּשֶׁהָעוּגָה נִכְנְסָה לַתַּנּוּר, הֵם הָלְכוּ לַחֶדֶר לְשַׂחֵק בְּמִשְׂחַק קֻפְסָה.","הֵם שִׂחֲקוּ וְשִׂחֲקוּ, וְכָל אֶחָד רָצָה לְנַצֵּחַ.","פִּתְאוֹם יוֹאָב רִחְרֵחַ בָּאֲוִיר. \"מָה הָרֵיחַ הַמּוּזָר הַזֶּה?\" שָׁאַל.","\"הָעוּגָה!\" צָעֲקָה מִיכַל, וְרָצָה לַמִּטְבָּח. מֵהַתַּנּוּר יָצָא עָשָׁן אָפֹר.","אַבָּא הוֹצִיא אֶת הָעוּגָה. הִיא הָיְתָה שְׁחֹרָה מִלְּמַעְלָה וְקָשָׁה כְּמוֹ אֶבֶן.","יוֹאָב הִתְחִיל לִבְכּוֹת. \"עַכְשָׁו אֵין לָנוּ הַפְתָּעָה לְאִמָּא.\"","מִיכַל חָשְׁבָה רֶגַע. \"יֵשׁ לָנוּ עוֹד קֶמַח וְעוֹד בֵּיצִים,\" אָמְרָה. \"נְנַסֶּה שׁוּב, וְהַפַּעַם נְכַוֵּן שָׁעוֹן.\"","הֵם אַפּוֹ עוּגָה חֲדָשָׁה, וּמִיכַל לֹא זָזָה מֵהַמִּטְבָּח עַד שֶׁהַשָּׁעוֹן צִלְצֵל.","כְּשֶׁאִמָּא חָזְרָה, הִיא מָצְאָה עַל הַשֻּׁלְחָן עוּגַת שׁוֹקוֹלָד, וּלְיָדָהּ פֶּתֶק: \"אִמָּא, אֲנַחְנוּ אוֹהֲבִים אוֹתָךְ\".","\"וּמָה זֶה?\" שָׁאֲלָה אִמָּא, וְהִצְבִּיעָה עַל הָעוּגָה הַשְּׁחֹרָה. כֻּלָּם פָּרְצוּ בִּצְחוֹק."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"לָמָּה הַיַּנְשׁוּף מְסוֹבֵב אֶת כָּל הָרֹאשׁ?","options":["כִּי הוּא שׁוֹמֵעַ רַעַשׁ מֵאֲחוֹרָיו","כִּי הָרֹאשׁ שֶׁלּוֹ כָּבֵד","כִּי הוּא עָיֵף","כִּי הָעֵינַיִם שֶׁלּוֹ לֹא זָזוֹת לַצְּדָדִים"],"answer":3,"exp":"בְּשׁוּרוֹת 3–4: הָעֵינַיִם לֹא זָזוֹת לַצְּדָדִים, לָכֵן הוּא מְסוֹבֵב אֶת כָּל הָרֹאשׁ."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"חַדָּה\" (שׁוּרָה 5)?","options":["חַלָּשָׁה","טוֹבָה מְאוֹד","רוֹעֶשֶׁת","כּוֹאֶבֶת"],"answer":1,"exp":"שְׁמִיעָה חַדָּה הִיא שְׁמִיעָה טוֹבָה מְאוֹד: הַיַּנְשׁוּף שׁוֹמֵעַ עַכְבָּר קָטָן בַּחֹשֶׁךְ."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 6 שֶׁהַנּוֹצוֹת שֶׁל הַיַּנְשׁוּף רַכּוֹת?","options":["כְּדֵי לְהַסְבִּיר לָמָּה הַיַּנְשׁוּף רוֹאֶה בַּחֹשֶׁךְ","כְּדֵי לְהַסְבִּיר לָמָּה הַיַּנְשׁוּף עָף בְּשֶׁקֶט","כְּדֵי לְהַסְבִּיר לָמָּה הוּא חַי בַּשָּׂדוֹת","כְּדֵי לְהַגִּיד שֶׁנָּעִים לְלַטֵּף אוֹתוֹ"],"answer":1,"exp":"בְּשׁוּרָה 6 כָּתוּב: הַנּוֹצוֹת רַכּוֹת, \"וְלָכֵן הוּא עָף בְּשֶׁקֶט\"."},{"id":"r4","sec":"read","p":0,"tag":"r","type":"mc","q":"לְמִי מִתְכַּוְּנִים בַּמִּלָּה \"הֵם\" בִּתְחִלַּת שׁוּרָה 9?","options":["לְעַכְבָּרִים","לַחַקְלָאִים","לְעָלִים","לַיַּנְשׁוּפִים"],"answer":1,"exp":"בְּשׁוּרָה 8 מְדֻבָּר עַל הַחַקְלָאִים, ו\"הם שְׂמֵחִים לַעֲזֹר לַיַּנְשׁוּפִים\"."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מָה צֶבַע הַנּוֹצוֹת שֶׁל הַיַּנְשׁוּף?","לָמָּה הַחַקְלָאִים שְׂמֵחִים לַעֲזֹר לַיַּנְשׁוּפִים?","אֵיךְ הַיַּנְשׁוּף מִתְקָרֵב לַטֶּרֶף בְּלִי שֶׁיִּשְׁמְעוּ אוֹתוֹ?","לָמָּה הַיַּנְשׁוּף רוֹאֶה גַּם כְּשֶׁיֵּשׁ מְעַט אוֹר?"],"answer":0,"exp":"הַקֶּטַע מְסַפֵּר שֶׁהַנּוֹצוֹת רַכּוֹת, אֲבָל לֹא מְסַפֵּר מָה הַצֶּבַע שֶׁלָּהֶן."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מִי נִשְׁאַר בַּבַּיִת בְּיוֹם שִׁשִּׁי?","options":["אִמָּא וְיוֹאָב","דּוֹדָה רִנָּה וּמִיכַל","רַק מִיכַל","אַבָּא, מִיכַל וְיוֹאָב"],"answer":3,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁאַבָּא נִשְׁאַר בַּבַּיִת עִם מִיכַל וְעִם יוֹאָב."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה מִיכַל רָצְתָה לֶאֱפוֹת עוּגָה?","options":["כִּי דּוֹדָה רִנָּה בִּקְּשָׁה","כִּי הִיא הָיְתָה רְעֵבָה","כְּדֵי לְהַפְתִּיעַ אֶת אִמָּא","כְּדֵי לְנַצֵּחַ בַּמִּשְׂחָק"],"answer":2,"exp":"בְּשׁוּרָה 2 מִיכַל אוֹמֶרֶת: \"בּוֹאוּ נָכִין לְאִמָּא הַפְתָּעָה\"."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"רִחְרֵחַ\" (שׁוּרָה 7)?","options":["הֵרִיחַ כַּמָּה פְּעָמִים, כְּדֵי לְגַלּוֹת מַשֶּׁהוּ","טַעַם מֵהָעוּגָה","שָׁמַע קוֹל חָזָק","רָאָה עָשָׁן"],"answer":0,"exp":"יוֹאָב רִחְרֵחַ בָּאֲוִיר וְגִלָּה רֵיחַ מוּזָר – הֵרִיחַ שׁוּב וָשׁוּב."},{"id":"r9","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה הָעוּגָה הָרִאשׁוֹנָה נִשְׂרְפָה?","options":["כִּי הֵם שִׂחֲקוּ וְשָׁכְחוּ אוֹתָהּ בַּתַּנּוּר","כִּי לֹא הָיָה לָהֶם מַתְכּוֹן","כִּי יוֹאָב שָׁפַךְ יוֹתֵר מִדַּי קֶמַח","כִּי לֹא הָיוּ לָהֶם בֵּיצִים"],"answer":0,"exp":"בְּשׁוּרוֹת 5–6 הֵם שִׂחֲקוּ וְשִׂחֲקוּ, וְשָׁכְחוּ שֶׁהָעוּגָה בַּתַּנּוּר."},{"id":"r10","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה מִיכַל אָמְרָה \"וְהַפַּעַם נְכַוֵּן שָׁעוֹן\" (שׁוּרָה 11)?","options":["כִּי הִיא רָצְתָה לְנַצֵּחַ בַּמִּשְׂחָק","כְּדֵי לָדַעַת מָתַי אִמָּא חוֹזֶרֶת","כִּי הַשָּׁעוֹן בַּבַּיִת הִתְקַלְקֵל","כְּדֵי שֶׁלֹּא יִשְׁכְּ
