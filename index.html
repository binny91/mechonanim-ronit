חוּ שׁוּב אֶת הָעוּגָה בַּתַּנּוּר"],"answer":3,"exp":"הַשָּׁעוֹן יַזְכִּיר לָהֶם לְהוֹצִיא אֶת הָעוּגָה בַּזְּמַן, כְּדֵי שֶׁלֹּא תִּשָּׂרֵף שׁוּב."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לִלְמֹד עַל מִיכַל מֵהַסִּפּוּר?","options":["שֶׁהִיא לֹא אוֹהֶבֶת שׁוֹקוֹלָד","שֶׁהִיא כּוֹעֶסֶת עַל יוֹאָב","שֶׁהִיא לֹא מְוַתֶּרֶת כְּשֶׁמַּשֶּׁהוּ לֹא מַצְלִיחַ","שֶׁהִיא מְפַחֶדֶת מֵהַתַּנּוּר"],"answer":2,"exp":"הָעוּגָה נִשְׂרְפָה, וּמִיכַל מִיָּד הִצִּיעָה לְנַסּוֹת שׁוּב – הִיא לֹא וִתְּרָה."},{"id":"r12","sec":"read","p":1,"tag":"y","type":"mc","q":"בְּאֵיזֶה זוּג הַמִּלִּים הֵן הֲפָכִים?","options":["פָּרְצוּ בִּצְחוֹק – הִתְחִילוּ לִצְחֹק","מוּזָר – מְשֻׁנֶּה","הִסְכִּים – סֵרֵב","צְעָקָה – קָרְאָה בְּקוֹל"],"answer":2,"exp":"\"הִסְכִּים\" וְ\"סֵרֵב\" הֵם הֲפָכִים. בִּשְׁאַר הַזּוּגוֹת הַמִּלִּים דּוֹמוֹת בַּמַּשְׁמָעוּת."},{"type":"open","tag":"calc","expr":"61 + 29 = ___","answer":90,"exp":"⁦61 + 29 = 90⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"52 − 16 = ___","answer":36,"exp":"⁦52 − 16 = 36⁩. בְּדִיקָה: ⁦36 + 16 = 52⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"7 × 4 = ___","answer":28,"exp":"⁦7 × 4 = 28⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"36 : 6 = ___","answer":6,"exp":"⁦36 : 6 = 6⁩, כִּי ⁦6 × 6 = 36⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 23 = 42","answer":19,"exp":"⁦42 − 23 = 19⁩, וְלָכֵן ⁦19 + 23 = 42⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"62 − ___ = 25","answer":37,"exp":"⁦62 − 25 = 37⁩, וְלָכֵן ⁦62 − 37 = 25⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 4 = 6","answer":24,"exp":"⁦24 : 4 = 6⁩, כִּי ⁦4 × 6 = 24⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"53 + 28 < 53 + ___","min":29,"max":999,"exp":"מִצַּד שְׂמֹאל וּמִצַּד יָמִין יֵשׁ 53. כְּדֵי שֶׁהַצַּד הַיְּמָנִי יִהְיֶה גָּדוֹל יוֹתֵר, צָרִיךְ מִסְפָּר גָּדוֹל מ־28, לְמָשָׁל 29.","answer":29,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ − 4 = 20","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 8 + 8 + 8 − 4 = 20⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + 9 = △ + △","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":3,"exp":"נְצִיב ⁦△ = 9: 9 + 9 = 9 + 9⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square","square"],15],[["square","circle"],12]],"ask":["circle","circle"]},"options":["13","14","15","16"],"answer":1,"exp":"שְׁלוֹשָׁה רִבּוּעִים = 15, אָז רִבּוּעַ = 5. עִגּוּל = ⁦12 − 5 = 7⁩. שְׁנֵי עִגּוּלִים: ⁦7 + 7 = 14⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"גַּלִּי קָטְפָה 18 תּוּתִים וְחִלְּקָה אוֹתָם שָׁוֶה בְּשָׁוֶה בֵּין 6 חֲבֵרִים. כַּמָּה תּוּתִים קִבֵּל כָּל חָבֵר?","options":["3","6","9","12"],"answer":0,"exp":"⁦18 : 6 = 3⁩, כִּי ⁦6 × 3 = 18⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בָּאוֹטוֹבּוּס הָיוּ 20 נוֹסְעִים. בַּתַּחֲנָה יָרְדוּ 5 נוֹסְעִים וְעָלוּ 5 נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?","options":["10","15","20","30"],"answer":2,"exp":"⁦20 − 5 = 15⁩, וְאָז ⁦15 + 5 = 20⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"אִיתַי סִדֵּר כִּסְּאוֹת ב־6 שׁוּרוֹת, וּבְכָל שׁוּרָה 8 כִּסְאוֹת. אַחַר כָּךְ הֵבִיא עוֹד 7 כִּסְאוֹת. כַּמָּה כִּסְאוֹת יֵשׁ בְּסַךְ הַכֹּל?","options":["21","48","55","90"],"answer":2,"exp":"⁦6 × 8 = 48⁩, וְעוֹד ⁦7: 55⁩.","id":"m14","sec":"math"}]},{"n":10,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַבָּרָק וְהָרַעַם","lines":["בַּחֹרֶף, בִּזְמַן סְעָרָה, אֶפְשָׁר לִרְאוֹת בַּשָּׁמַיִם הֶבְזֵק שֶׁל אוֹר – זֶה הַבָּרָק.","הַבָּרָק הוּא נִיצוֹץ חַשְׁמַלִּי עֲנָק, שֶׁעוֹבֵר בֵּין הָעֲנָנִים אוֹ בֵּין עָנָן לַאֲדָמָה.","הַבָּרָק חַם מְאוֹד, וְלָכֵן הוּא מְחַמֵּם אֶת הָאֲוִיר שֶׁסְּבִיבוֹ בְּבַת אַחַת.","הָאֲוִיר הַחַם מִתְרַחֵב מַהֵר מְאוֹד, וְזֶה יוֹצֵר קוֹל חָזָק: הָרַעַם.","הַבָּרָק וְהָרַעַם קוֹרִים בְּאוֹתוֹ רֶגַע, אֲבָל אֲנַחְנוּ רוֹאִים אֶת הַבָּרָק לִפְנֵי שֶׁאֲנַחְנוּ שׁוֹמְעִים אֶת הָרַעַם.","זֶה קוֹרֶה כִּי הָאוֹר עוֹבֵר מַהֵר הַרְבֵּה יוֹתֵר מֵהַקּוֹל.","אִם סוֹפְרִים אֶת הַשְּׁנִיּוֹת מֵהַבָּרָק וְעַד הָרַעַם, אֶפְשָׁר לָדַעַת אִם הַסְּעָרָה קְרוֹבָה אוֹ רְחוֹקָה.","כְּכָל שֶׁהַזְּמַן קָצָר יוֹתֵר, הַסְּעָרָה קְרוֹבָה יוֹתֵר.","בִּזְמַן סַעֲרַת בְּרָקִים כְּדַאי לְהִשָּׁאֵר בְּתוֹךְ הַבַּיִת, וְלֹא לַעֲמֹד לְיַד עֵצִים גְּבוֹהִים."]},{"kind":"story","title":"הַמַּפְתֵּחַ הָאָבוּד","lines":["כָּל יוֹם, כְּשֶׁאֲבִיגַיִל חָזְרָה מִבֵּית הַסֵּפֶר, הִיא פָּתְחָה אֶת דֶּלֶת הַבַּיִת בַּמַּפְתֵּחַ שֶׁלָּהּ.","הַמַּפְתֵּחַ הָיָה תָּלוּי עַל שְׂרוֹךְ אָדֹם, וְהִיא שָׁמְרָה אוֹתוֹ בַּכִּיס הַקָּטָן שֶׁל הַתִּיק.","בְּיוֹם שְׁלִישִׁי הִיא הִגִּיעָה הַבַּיְתָה, פָּתְחָה אֶת הַכִּיס – וְהוּא הָיָה רֵיק.","אֲבִיגַיִל חִפְּשָׂה בְּכָל הַתִּיק, הָפְכָה אוֹתוֹ וְנִעֲרָה אוֹתוֹ. הַמַּפְתֵּחַ לֹא הָיָה.","הַלֵּב שֶׁלָּהּ דָּפַק מַהֵר. אִמָּא חוֹזֶרֶת מֵהָעֲבוֹדָה רַק בְּעוֹד שָׁעָה.","הִיא הִתְיַשְּׁבָה עַל הַמַּדְרֵגוֹת וְנִסְּתָה לְהִזָּכֵר: אֵיפֹה רָאֲתָה אֶת הַמַּפְתֵּחַ בַּפַּעַם הָאַחֲרוֹנָה?","\"בַּהַפְסָקָה הוֹצֵאתִי אֶת הַקַּלְמָר מֵהַכִּיס,\" חָשְׁבָה, \"אוּלַי הַמַּפְתֵּחַ נָפַל אָז.\"","הִיא דָּפְקָה בַּדֶּלֶת שֶׁל הַשְּׁכֵנָה, הַגְּבֶרֶת מִזְרָחִי, וּבִקְּשָׁה לְטַלְפֵּן לְאִמָּא.","אִמָּא עָנְתָה מִיָּד. \"אַל תִּדְאֲגִי,\" אָמְרָה, \"חַכִּי אֵצֶל הַגְּבֶרֶת מִזְרָחִי. אֲנִי כְּבָר יוֹצֵאת.\"","הַגְּבֶרֶת מִזְרָחִי הֵכִינָה לָהּ תֶּה עִם לִימוֹן, וְהֵן שִׂחֲקוּ יַחַד דַּמְקָה.","לְמָחֳרָת בַּבֹּקֶר, הַשּׁוֹמֵר שֶׁל בֵּית הַסֵּפֶר עָצַר אוֹתָהּ בַּשַּׁעַר.","\"זֶה שֶׁלָּךְ?\" שָׁאַל, וְהֵרִים שְׂרוֹךְ אָדֹם שֶׁהָיָה תָּלוּי עָלָיו מִפְתַּח.","אֲבִיגַיִל קָפְצָה מִשִּׂמְחָה. מֵאוֹתוֹ יוֹם הִיא תָּלְתָה אֶת הַמַּפְתֵּחַ עַל הַצַּוָּאר, מִתַּחַת לַחֻלְצָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה יוֹצֵר אֶת הַקּוֹל שֶׁל הָרַעַם?","options":["גֶּשֶׁם שֶׁנּוֹפֵל עַל הַגַּג","אֲוִיר חַם שֶׁמִּתְרַחֵב מַהֵר מְאוֹד","עֲנָנִים שֶׁמִּתְנַגְּשִׁים זֶה בָּזֶה","רוּחַ חֲזָקָה"],"answer":1,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁהָאֲוִיר הַחַם מִתְרַחֵב מַהֵר, וְזֶה יוֹצֵר אֶת הָרַעַם."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה אֲנַחְנוּ רוֹאִים אֶת הַבָּרָק לִפְנֵי שֶׁאֲנַחְנוּ שׁוֹמְעִים אֶת הָרַעַם?","options":["כִּי הַבָּרָק קוֹרֶה לִפְנֵי הָרַעַם","כִּי הָרַעַם רָחוֹק יוֹתֵר מֵהַבָּרָק","כִּי הָאָזְנַיִם שֶׁלָּנוּ אִטִּיּוֹת","כִּי הָאוֹר עוֹבֵר מַהֵר יוֹתֵר מֵהַקּוֹל"],"answer":3,"exp":"בְּשׁוּרָה 6 כָּתוּב שֶׁהָאוֹר עוֹבֵר מַהֵר יוֹתֵר מֵהַקּוֹל. שִׂימִי לֵב: לְפִי שׁוּרָה 5 הֵם קוֹרִים בְּאוֹתוֹ רֶגַע."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"בְּבַת אַחַת\" (שׁוּרָה 3)?","options":["מַהֵר מְאוֹד, בְּרֶגַע אֶחָד","רַק בַּחֹרֶף","לְאַט לְאַט","פַּעַם בְּשָׁנָה"],"answer":0,"exp":"הַבָּרָק מְחַמֵּם אֶת הָאֲוִיר בְּבַת אַחַת – בְּבַת אַחַת, מִיָּד."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"דָּנָה סָפְרָה 2 שְׁנִיּוֹת מֵהַבָּרָק וְעַד הָרַעַם. יוֹאָב סֵפֶר 10 שְׁנִיּוֹת. מָה נָכוֹן?","options":["אִי אֶפְשָׁר לָדַעַת","הַסְּעָרָה הָיְתָה קְרוֹבָה יוֹתֵר לְיוֹאָב","הַסְּעָרָה הָיְתָה בְּאוֹתוֹ מֶרְחָק מִשְּׁנֵיהֶם","הַסְּעָרָה הָיְתָה קְרוֹבָה יוֹתֵר לְדָנָה"],"answer":3,"exp":"בְּשׁוּרָה 8 כָּתוּב: כְּכָל שֶׁהַזְּמַן קָצָר יוֹתֵר, הַסְּעָרָה קְרוֹבָה יוֹתֵר. אֵצֶל דָּנָה הַזְּמַן קָצָר יוֹתֵר."},{"id":"r5","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה הַקֶּטַע מַמְלִיץ לַעֲשׂוֹת בִּזְמַן סַעֲרַת בְּרָקִים?","options":["לִסְפֹּר אֶת הָעֲנָנִים","לָצֵאת הַחוּצָה לִרְאוֹת אֶת הַבְּרָקִים","לַעֲמֹד לְיַד עֵץ גָּבוֹהַּ","לְהִשָּׁאֵר בְּתוֹךְ הַבַּיִת"],"answer":3,"exp":"בְּשׁוּרָה 9 כָּתוּב שֶׁכְּדַאי לְהִשָּׁאֵר בְּתוֹךְ הַבַּיִת."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"אֵיפֹה אֲבִיגַיִל שָׁמְרָה בְּדֶרֶךְ כְּלָל אֶת הַמַּפְתֵּחַ?","options":["מִתַּחַת לַשָּׁטִיחַ","בְּתוֹךְ הַקַּלְמָר","בַּכִּיס הַקָּטָן שֶׁל הַתִּיק","עַל הַצַּוָּאר"],"answer":2,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהִיא שָׁמְרָה אוֹתוֹ בַּכִּיס הַקָּטָן שֶׁל הַתִּיק. עַל הַצַּוָּאר הִיא תָּלְתָה אוֹתוֹ רַק בַּסּוֹף."},{"id":"r7","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נִעֲרָה\" (שׁוּרָה 4)?","options":["קִפְּלָה","הֵזִיזָה חָזָק, כְּדֵי שֶׁדְּבָרִים יִפְּלוּ הַחוּצָה","סָגְרָה טוֹב","שָׁטְפָה בַּמַּיִם"],"answer":1,"exp":"אֲבִיגַיִל נִעֲרָה אֶת הַתִּיק – טִלְטְלָה אוֹתוֹ – כְּדֵי לִרְאוֹת אִם הַמַּפְתֵּחַ יִפֹּל מִמֶּנּוּ."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה הַלֵּב שֶׁל אֲבִיגַיִל דָּפַק מַהֵר (שׁוּרָה 5)?","options":["כִּי הִיא נִבְהֲלָה, כִּי לֹא הָיְתָה לָהּ דֶּרֶךְ לְהִכָּנֵס הַבַּיְתָה","כִּי הִיא שִׂחֲקָה דַּמְקָה","כִּי הִיא רָצָה מִבֵּית הַסֵּפֶר","כִּי הִיא שְׂמֵחָה לַחְזֹר הַבַּיְתָה"],"answer":0,"exp":"הַמַּפְתֵּחַ אָבַד וְאִמָּא חוֹזֶרֶת רַק בְּעוֹד שָׁעָה – אֲבִיגַיִל נִבְהֲלָה."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אֲבִיגַיִל נִסְּתָה לְהִזָּכֵר אֵיפֹה רָאֲתָה אֶת הַמַּפְתֵּחַ בַּפַּעַם הָאַחֲרוֹנָה?","options":["כִּי הִיא רָצְתָה לְצַיֵּר אוֹתוֹ","כִּי הַמּוֹרָה בִּקְּשָׁה","כְּדֵי לְנַחֵשׁ אֵיפֹה הוּא נָפַל","כְּדֵי לְסַפֵּר לַשְּׁכֵנָה"],"answer":2,"exp":"הִיא נִזְכְּרָה בַּהַפְסָקָה וּבַקַּלְמָר, וְנִחֲשָׁה שֶׁהַמַּפְתֵּחַ נָפַל אָז."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשְׂתָה אֲבִיגַיִל כְּדֵי לְקַבֵּל עֶזְרָה?","options":["בָּכְתָה עַד שֶׁאִמָּא הִגִּיעָה","חֲזָרָה לְבֵית הַסֵּפֶר","דָּפְקָה אֵצֶל הַשְּׁכֵנָה וּבִקְּשָׁה לְטַלְפֵּן לְאִמָּא","חִכְּתָה עַל הַמַּדְרֵגוֹת עַד הָעֶרֶב"],"answer":2,"exp":"בְּשׁוּרָה 8 כָּתוּב שֶׁהִיא דָּפְקָה אֵצֶל הַגְּבֶרֶת מִזְרָחִי וּבִקְּשָׁה לְטַלְפֵּן לְאִמָּא."},{"id":"r11","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמִי הָיָה שַׁיָּךְ הַשְּׂרוֹךְ הָאָדֹם שֶׁהַשּׁוֹמֵר הֵרִים (שׁוּרָה 12)?","options":["לְאִמָּא","לַאֲבִיגַיִל","לִגְבֶרֶת מִזְרָחִי","לַשּׁוֹמֵר"],"answer":1,"exp":"זֶה הַמַּפְתֵּחַ שֶׁל אֲבִיגַיִל עַל הַשְּׂרוֹךְ הָאָדֹם (שׁוּרָה 2). הִיא קָפְצָה מִשִּׂמְחָה כְּשֶׁרָאֲתָה אוֹתוֹ."},{"id":"r12","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אֲבִיגַיִל הִתְחִילָה לִתְלוֹת אֶת הַמַּפְתֵּחַ עַל הַצַּוָּאר?","options":["כְּדֵי שֶׁלֹּא יֹאבַד לָהּ שׁוּב","כִּי הַשּׁוֹמֵר בִּקֵּשׁ מִמֶּנָּה","כְּדֵי שֶׁכֻּלָּם יִרְאוּ אוֹתוֹ","כִּי הַשְּׂרוֹךְ הִתְקַצֵּר"],"answer":0,"exp":"הִיא תָּלְתָה אוֹתוֹ מִתַּחַת לַחֻלְצָה – לֹא כְּדֵי שֶׁיִּרְאוּ, אֶלָּא כְּדֵי שֶׁלֹּא יִפֹּל שׁוּב."},{"type":"open","tag":"calc","expr":"65 + 15 = ___","answer":80,"exp":"⁦65 + 15 = 80⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"50 − 35 = ___","answer":15,"exp":"⁦50 − 35 = 15⁩. בְּדִיקָה: ⁦15 + 35 = 50⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"4 × 6 = ___","answer":24,"exp":"⁦4 × 6 = 24⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"54 : 6 = ___","answer":9,"exp":"⁦54 : 6 = 9⁩, כִּי ⁦6 × 9 = 54⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 45 = 89","answer":44,"exp":"⁦89 − 45 = 44⁩, וְלָכֵן ⁦44 + 45 = 89⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"89 − ___ = 26","answer":63,"exp":"⁦89 − 26 = 63⁩, וְלָכֵן ⁦89 − 63 = 26⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 6 = 6","answer":36,"exp":"⁦36 : 6 = 6⁩, כִּי ⁦6 × 6 = 36⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"81 − 15 > 81 − ___","min":16,"max":81,"exp":"כְּשֶׁמּוֹרִידִים יוֹתֵר, נִשְׁאַר פָּחוֹת. צָרִיךְ לְהוֹרִיד יוֹתֵר מ־15, לְמָשָׁל 16.","answer":16,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + 4 = △ + △","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 4: 4 + 4 = 4 + 4⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"1△ + △ = 28","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":3,"exp":"נְצִיב ⁦△ = 9: 19 + 9 = 28⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle","circle"],21],[["circle","heart"],15]],"ask":["heart","heart"]},"options":["15","16","17","18"],"answer":1,"exp":"שְׁלוֹשָׁה עִגּוּלִים = 21, אָז עִגּוּל = 7. לֵב = ⁦15 − 7 = 8⁩. שְׁנֵי לְבָבוֹת: ⁦8 + 8 = 16⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"עוּגִיָּה עוֹלָה 8 ₪, וְשׁוֹקוֹ עוֹלֶה 6 ₪. עִדּוֹ קָנָה 2 עוּגִיּוֹת וְשׁוֹקוֹ אֶחָד. כַּמָּה שִׁלֵּם?","options":["14","20","22","28"],"answer":2,"exp":"2 עוּגִיּוֹת: ⁦8 + 8 = 16⁩. וְעוֹד שׁוֹקוֹ: ⁦16 + 6 = 22⁩ ₪.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"גַּלִּי קוֹרֵאת סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרְאָה 5 עַמּוּדִים. בְּכָל יוֹם הִיא קָרְאָה 2 עַמּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרְאָה בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["9","15","17","21"],"answer":3,"exp":"יוֹם ⁦1: 5⁩, יוֹם ⁦2: 7⁩, יוֹם ⁦3: 9⁩. בְּיַחַד: 21.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"אֵלָה חוֹסֶכֶת 4 ₪ בְּכָל שָׁבוּעַ. אַחֲרֵי כַּמָּה שָׁבוּעוֹת יִהְיוּ לָהּ 12 ₪?","options":["2","3","4","8"],"answer":1,"exp":"⁦4 × 3 = 12⁩, לָכֵן אַחֲרֵי 3 שָׁבוּעוֹת.","id":"m14","sec":"math"}]},{"n":11,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַבַּקְבּוּק שֶׁחוֹזֵר","lines":["כָּל יוֹם אֲנָשִׁים זוֹרְקִים לַפַּח הַרְבֵּה בַּקְבּוּקִים מִפְּלַסְטִיק.","פְּלַסְטִיק הוּא חֹמֶר חָזָק, שֶׁמַּחֲזִיק מַעֲמָד זְמַן רַב מְאוֹד. זֶה טוֹב כְּשֶׁמִּשְׁתַּמְּשִׁים בּוֹ,","אֲבָל זֶה רַע כְּשֶׁזּוֹרְקִים אוֹתוֹ: בַּקְבּוּק שֶׁנִּזְרַק לָאֲדָמָה יָכוֹל לְהִשָּׁאֵר שָׁם מֵאוֹת שָׁנִים.","כְּדֵי שֶׁהַפְּלַסְטִיק לֹא יִצְטַבֵּר, אֶפְשָׁר לְמַחְזֵר אוֹתוֹ.","לְמַחְזֵר פֵּרוּשׁוֹ לְהִשְׁתַּמֵּשׁ שׁוּב בְּחֹמֶר שֶׁל דָּבָר יָשָׁן, כְּדֵי לְיַצֵּר מִמֶּנּוּ דָּבָר חָדָשׁ.","אֶת הַבַּקְבּוּקִים שָׂמִים בִּמְכַל מְיֻחָד. מִשָּׁם הֵם מַגִּיעִים לַמִּפְעָל,","וְשָׁם חוֹתְכִים אוֹתָם לַחֲתִיכוֹת קְטַנּוֹת, שׁוֹטְפִים אוֹתָם וּמְמִסִּים אוֹתָם.","מֵהַחֹמֶר הַזֶּה אֶפְשָׁר לְהָכִין דְּבָרִים חֲדָשִׁים: כִּסְאוֹת לַגִּנָּה, צַעֲצוּעִים וַאֲפִלּוּ בְּגָדִים חַמִּים.","כְּשֶׁאֲנַחְנוּ מְמַחְזְרִים, אֲנַחְנוּ שׁוֹמְרִים עַל הַטֶּבַע וְעַל כַּדּוּר הָאָרֶץ."]},{"kind":"story","title":"הַגִּיטָרָה שֶׁל דָּוִד אַבְנֵר","lines":["בַּחֲנֻכָּה דּוֹד אַבְנֵר הֵבִיא לְאוּרִי מַתָּנָה מְיֻחֶדֶת: גִּיטָרָה קְטַנָּה וּמַבְרִיקָה.","\"כְּשֶׁהָיִיתִי בְּגִילְךָ, נִגַּנְתִּי כָּל יוֹם,\" אָמַר הַדּוֹד. \"אוּלַי גַּם אַתָּה תֹּאהַב.\"","אוּרִי נִסָּה לְנַגֵּן מִיָּד. הוּא לָחַץ עַל הַמֵּיתָרִים, אֲבָל יָצְאוּ רַק קוֹלוֹת צוֹרְמִים.","גַּם הָאֶצְבָּעוֹת כָּאֲבוּ לוֹ, וְהוּא הֵנִיחַ אֶת הַגִּיטָרָה בַּצַּד.","\"זֶה קָשֶׁה מִדַּי,\" אָמַר. \"אֲנִי אַף פַּעַם לֹא אֵדַע לְנַגֵּן.\"","אֲחוֹתוֹ הַגְּדוֹלָה, נַעֲמָה, שָׁמְעָה וְאָמְרָה: \"זוֹכֵר כְּשֶׁלָּמַדְתָּ לִרְכֹּב עַל אוֹפַנַּיִם? נָפַלְתָּ כָּל הַזְּמַן.\"","\"נָכוֹן,\" צָחַק אוּרִי, \"וְהַיּוֹם אֲנִי רוֹכֵב הֲכִי מַהֵר בַּשְּׁכוּנָה.\"","\"גַּם עִם הַגִּיטָרָה זֶה כָּכָה,\" אָמְרָה נַעֲמָה. \"רַק שֶׁבִּמְקוֹם לִפֹּל, הָאֶצְבָּעוֹת כּוֹאֲבוֹת קְצָת.\"","מֵאוֹתוֹ יוֹם אוּרִי הִתְאַמֵּן עֶשֶׂר דַּקּוֹת בְּכָל עֶרֶב. בַּהַתְחָלָה הוּא לָמַד צְלִיל אֶחָד, וְאַחַר כָּךְ עוֹד אֶחָד.","אַחֲרֵי חֹדֶשׁ הוּא כְּבָר יָדַע לְנַגֵּן שִׁיר קָצָר – לְאַט, אֲבָל בְּלִי טָעוּיוֹת.","בְּפֶסַח, כְּשֶׁכָּל הַמִּשְׁפָּחָה יָשְׁבָה סְבִיב הַשֻּׁלְחָן, אוּרִי הֵבִיא אֶת הַגִּיטָרָה.","הוּא נִגֵּן אֶת הַשִּׁיר, וְכֻלָּם שָׁרוּ אִתּוֹ.","דּוֹד אַבְנֵר הִסְתַּכֵּל עָלָיו בְּעֵינַיִם נוֹצְצוֹת. \"יָדַעְתִּי,\" אָמַר בְּשֶׁקֶט, \"יָדַעְתִּי.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"מַחְזִיק מַעֲמָד\" (שׁוּרָה 2)?","options":["נִשְׁבַּר מַהֵר","מַחְזִיק מַשֶּׁהוּ בַּיָּד","עוֹמֵד עַל רֶגֶל אַחַת","לֹא נֶהֱרַס, וְנִשְׁאַר שָׁלֵם הַרְבֵּה זְמַן"],"answer":3,"exp":"פְּלַסְטִיק מַחְזִיק מַעֲמָד זְמַן רַב – הוּא לֹא נֶהֱרַס, וְלָכֵן הוּא יָכוֹל לְהִשָּׁאֵר בָּאֲדָמָה מֵאוֹת שָׁנִים."},{"id":"r2","sec":"read","p":0,"tag":"c","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 2 שֶׁזֶּה טוֹב, וּבְשׁוּרָה 3 שֶׁזֶּה רַע?","options":["כִּי פְּלַסְטִיק טוֹב רַק בַּקַּיִץ","כִּי אוֹתָהּ תְּכוּנָה עוֹזֶרֶת כְּשֶׁמִּשְׁתַּמְּשִׁים בְּבַקְבּוּק, וּמַזִּיקָה כְּשֶׁזּוֹרְקִים אוֹתוֹ","כִּי פַּעַם אַחַת מְדַבְּרִים עַל זְכוּכִית","כִּי יֵשׁ שְׁנֵי סוּגִים שֶׁל פְּלַסְטִיק"],"answer":1,"exp":"הַפְּלַסְטִיק חָזָק: זֶה טוֹב כְּשֶׁמִּשְׁתַּמְּשִׁים בּוֹ, וְרַע כְּשֶׁהוּא נִשְׁאָר בָּאֲדָמָה מֵאוֹת שָׁנִים."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"יִצְטַבֵּר\" (שׁוּרָה 4)?","options":["יִתְקַלְקֵל","יֵעָלֵם","יִהְיֶה מִמֶּנּוּ יוֹתֵר וְיוֹתֵר, כְּמוֹ עֲרֵמָה שֶׁגָּדְלָה","יִתְבַּשֵּׁל"],"answer":2,"exp":"אִם לֹא מְמַחְזְרִים, הַפְּלַסְטִיק נֶאֱסַף וְנֶאֱסַף – הוּא מִצְטַבֵּר."},{"id":"r4","sec":"read","p":0,"tag":"s","type":"mc","q":"מָה עוֹשִׂים לְבַקְבּוּקִים בַּמִּפְעָל לִפְנֵי שֶׁמְּמִסִּים אוֹתָם?","options":["זוֹרְקִים אוֹתָם לָאֲדָמָה","חוֹתְכִים אוֹתָם לַחֲתִיכוֹת קְטַנּוֹת וְשׁוֹטְפִים אוֹתָם","מְכִינִים מֵהֶם צַעֲצוּעִים","קוֹנִים אוֹתָם בַּחֲנוּת"],"answer":1,"exp":"בְּשׁוּרָה 7: חוֹתְכִים, שׁוֹטְפִים, וְרַק אָז מְמִסִּים."},{"id":"r5","sec":"read","p":0,"tag":"m","type":"mc","q":"מָה הַמַּטָּרָה שֶׁל הַקֶּטַע?","options":["לְהַסְבִּיר לָמָּה וְאֵיךְ מְמַחְזְרִים בַּקְבּוּקֵי פְּלַסְטִיק","לְלַמֵּד אֵיךְ מְכִינִים בַּקְבּוּק","לְסַפֵּר סִפּוּר עַל יֶלֶד שֶׁזָּרַק בַּקְבּוּק","לְסַפֵּר עַל מִפְעָל שֶׁל צַעֲצוּעִים"],"answer":0,"exp":"הַקֶּטַע מַסְבִּיר לָמָּה הַפְּלַסְטִיק מַזִּיק לַטֶּבַע, וְאֵיךְ מְמַחְזְרִים אוֹתוֹ."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מִי נָתַן לְאוּרִי אֶת הַגִּיטָרָה?","options":["דָּוִד אַבְנֵר","הַמּוֹרָה לְמוּזִיקָה","אַבָּא","נַעֲמָה"],"answer":0,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁדָּוִד אַבְנֵר הֵבִיא לְאוּרִי אֶת הַגִּיטָרָה."},{"id":"r7","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"צוֹרְמִים\" (שׁוּרָה 3)?","options":["שְׁקֵטִים מְאוֹד","יָפִים מְאוֹד","אֲרֻכִּים","לֹא נְעִימִים לָאֹזֶן"],"answer":3,"exp":"קוֹלוֹת צוֹרְמִים הֵם קוֹלוֹת לֹא נְעִימִים – כָּךְ נִשְׁמָע מִי שֶׁעוֹד לֹא יוֹדֵעַ לְנַגֵּן."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה אוּרִי הִנִּיחַ אֶת הַגִּיטָרָה בַּצַּד (שׁוּרוֹת 3–5)?","options":["כִּי הוּא רָצָה לִרְכֹּב עַל אוֹפַנַּיִם","כִּי הָיָה לוֹ קָשֶׁה וְהוּא הִתְיָאֵשׁ","כִּי הַגִּיטָרָה נִשְׁבְּרָה","כִּי אִמָּא קָרְאָה לוֹ"],"answer":1,"exp":"אוּרִי אָמַר \"זֶה קָשֶׁה מִדַּי\" וְ\"אֲנִי אַף פַּעַם לֹא אֵדַע\" – הוּא הִתְיָאֵשׁ."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה נַעֲמָה הִזְכִּירָה לְאוּרִי אֶת הָאוֹפַנַּיִם?","options":["כִּי הִיא רָצְתָה אוֹפַנַּיִם חֲדָשִׁים","כְּדֵי לְהַצִּיעַ לוֹ לָצֵאת לִרְכֹּב","כְּדֵי לִצְחֹק עָלָיו שֶׁנָּפַל","כְּדֵי לְהַרְאוֹת לוֹ שֶׁגַּם דָּבָר קָשֶׁה אֶפְשָׁר לִלְמֹד בְּאִמּוּן"],"answer":3,"exp":"בָּאוֹפַנַּיִם הוּא נָפַל הַרְבֵּה וּבַסּוֹף הִצְלִיחַ. נַעֲמָה רָצְתָה שֶׁיָּבִין שֶׁגַּם בְּגִיטָרָה זֶה כָּךְ."},{"id":"r10","sec":"read","p":1,"tag":"s","type":"mc","q":"כַּמָּה זְמַן עָבַר מֵהַיּוֹם שֶׁאוּרִי הִתְחִיל לְהִתְאַמֵּן וְעַד שֶׁיָּדַע לְנַגֵּן שִׁיר קָצָר?","options":["בְּעֵרֶךְ חֹדֶשׁ","יוֹם אֶחָד","עֶשֶׂר דַּקּוֹת","שָׁנָה"],"answer":0,"exp":"בְּשׁוּרָה 10 כָּתוּב: \"אַחֲרֵי חֹדֶשׁ הוּא כְּבָר יָדַע לְנַגֵּן שִׁיר קָצָר\". עֶשֶׂר דַּקּוֹת זֶה הָאִמּוּן בְּכָל עֶרֶב."},{"id":"r11","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֵּן דָּוִד אַבְנֵר כְּשֶׁהוּא אוֹמֵר \"יָדַעְתִּי\" (שׁוּרָה 13)?","options":["שֶׁהוּא יָדַע שֶׁהַגִּיטָרָה תִּשָּׁבֵר","שֶׁהוּא יָדַע שֶׁתִּהְיֶה אֲרוּחָה","שֶׁהוּא יָדַע מֵהַהַתְחָלָה שֶׁאוּרִי יַצְלִיחַ לְנַגֵּן","שֶׁהוּא יָדַע אֶת הַמִּלִּים שֶׁל הַשִּׁיר"],"answer":2,"exp":"הַדּוֹד הֶאֱמִין בְּאוּרִי כְּבָר כְּשֶׁנָּתַן לוֹ אֶת הַגִּיטָרָה (שׁוּרָה 2), וְשָׂמַח לִרְאוֹת שֶׁצָּדַק."},{"id":"r12","sec":"read","p":1,"tag":"y","type":"mc","q":"בְּאֵיזֶה זוּג הַמִּלִּים הֵן הֲפָכִים?","options":["בְּשֶׁקֶט – בְּלַחַשׁ","הִתְאַמֵּן – תִּרְגֵּל","קָשֶׁה – קַל","מַבְרִיקָה – נוֹצֶצֶת"],"answer":2,"exp":"\"קָשֶׁה\" ו\"קל\" הֵם הֲפָכִים. בִּשְׁאַר הַזּוּגוֹת הַמִּלִּים דּוֹמוֹת בַּמַּשְׁמָעוּת."},{"type":"open","tag":"calc","expr":"58 + 18 = ___","answer":76,"exp":"⁦58 + 18 = 76⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"94 − 49 = ___","answer":45,"exp":"⁦94 − 49 = 45⁩. בְּדִיקָה: ⁦45 + 49 = 94⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"7 × 5 = ___","answer":35,"exp":"⁦7 × 5 = 35⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"24 : 6 = ___","answer":4,"exp":"⁦24 : 6 = 4⁩, כִּי ⁦6 × 4 = 24⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 47 = 80","answer":33,"exp":"⁦80 − 47 = 33⁩, וְלָכֵן ⁦33 + 47 = 80⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"78 − ___ = 47","answer":31,"exp":"⁦78 − 47 = 31⁩, וְלָכֵן ⁦78 − 31 = 47⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 4 = 5","answer":20,"exp":"⁦20 : 4 = 5⁩, כִּי ⁦4 × 5 = 20⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"5 × 5 < 5 × ___","min":6,"max":999,"exp":"בִּשְׁנֵי הַצְּדָדִים כּוֹפְלִים ב־5. צָרִיךְ מִסְפָּר גָּדוֹל מ־5, לְמָשָׁל 6.","answer":6,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"1△ + △ = 26","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 18 + 8 = 26⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ − 7 = 3","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 5: 5 + 5 − 7 = 3⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle","circle"],18],[["circle","star"],8]],"ask":["star","star"]},"options":["3","4","5","6"],"answer":1,"exp":"שְׁלוֹשָׁה עִגּוּלִים = 18, אָז עִגּוּל = 6. כּוֹכָב = ⁦8 − 6 = 2⁩. שְׁנֵי כּוֹכָבִים: ⁦2 + 2 = 4⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"טַלְיָה סִדְּרָה כִּסְּאוֹת ב־3 שׁוּרוֹת, וּבְכָל שׁוּרָה 4 כִּסְּאוֹת. אַחַר כָּךְ הֵבִיאָה עוֹד 5 כִּסְאוֹת. כַּמָּה כִּסְאוֹת יֵשׁ בְּסַךְ הַכֹּל?","options":["12","17","21","27"],"answer":1,"exp":"⁦3 × 4 = 12⁩, וְעוֹד ⁦5: 17⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"אֲרִיאֵל חוֹסֵךְ 10 ₪ בְּכָל שָׁבוּעַ. אַחֲרֵי כַּמָּה שָׁבוּעוֹת יִהְיוּ לוֹ 70 ₪?","options":["6","7","8","60"],"answer":1,"exp":"⁦10 × 7 = 70⁩, לָכֵן אַחֲרֵי 7 שָׁבוּעוֹת.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"יָעֵל בַּת 7. אֲחוֹתָהּ הַגְּדוֹלָה מְבֻגֶּרֶת מִמֶּנָּה ב־4 שָׁנִים. בַּת כַּמָּה תִּהְיֶה הָאָחוֹת בְּעוֹד 5 שָׁנִים?","options":["6","11","12","16"],"answer":3,"exp":"עַכְשָׁו הָאָחוֹת בַּת ⁦7 + 4 = 11⁩. בְּעוֹד 5 שָׁנִים: ⁦11 + 5 = 16⁩.","id":"m14","sec":"math"}]},{"n":12,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַמַּסָּע שֶׁל הַמַּיִם","lines":["הַמַּיִם שֶׁאֲנַחְנוּ שׁוֹתִים הַיּוֹם אוּלַי הָיוּ פַּעַם בַּיָּם, בֶּעָנָן אוֹ אֲפִלּוּ בְּקַרְחוֹן רָחוֹק.","זֶה קוֹרֶה כִּי הַמַּיִם בַּטֶּבַע עוֹבְרִים כָּל הַזְּמַן מִמָּקוֹם לְמָקוֹם, בְּמַסְלוּל שֶׁחוֹזֵר עַל עַצְמוֹ.","הַשֶּׁמֶשׁ מְחַמֶּמֶת אֶת הַמַּיִם בַּיָּם, בָּאֲגַמִּים וּבַנְּהָרוֹת. חֵלֶק מֵהַמַּיִם הוֹפְכִים לְאֵדִים,","וְהָאֵדִים עוֹלִים לְמַעְלָה, אֶל הַשָּׁמַיִם. שָׁם, גָּבוֹהַּ, קַר יוֹתֵר.","בְּקֹר הָאֵדִים הוֹפְכִים לְטִפּוֹת קְטַנְטַנּוֹת שֶׁל מַיִם, וְהַטִּפּוֹת יַחַד יוֹצְרוֹת עֲנָנִים.","כְּשֶׁהַטִּפּוֹת בֶּעָנָן מִתְחַבְּרוֹת וְנַעֲשׂוֹת כְּבֵדוֹת, הֵן נוֹפְלוֹת לְמַטָּה: זֶה הַגֶּשֶׁם.","מֵי הַגֶּשֶׁם זוֹרְמִים לַנְּהָרוֹת, נִסְפָּגִים בָּאֲדָמָה אוֹ חוֹזְרִים אֶל הַיָּם,","וְשָׁם הַשֶּׁמֶשׁ מְחַמֶּמֶת אוֹתָם שׁוּב – וְהַמַּסְלוּל מַתְחִיל מֵחָדָשׁ.","בִּגְלַל הַמַּסְלוּל הַזֶּה הַמַּיִם בַּטֶּבַע חוֹזְרִים שׁוּב וָשׁוּב, וְלָכֵן חָשׁוּב לִשְׁמֹר שֶׁיִּהְיוּ נְקִיִּים."]},{"kind":"story","title":"הַדָּג שֶׁל הַכִּתָּה","lines":["בַּכִּתָּה שֶׁל שָׁקֵד הָיָה אַקְוַרְיוּם קָטָן, וּבוֹ דַּג זָהָב כָּתֹם בְּשֵׁם נֶמוֹ.","בְּכָל שָׁבוּעַ יֶלֶד אַחֵר הָיָה אַחְרַאי לְהַאֲכִיל אוֹתוֹ. הַשָּׁבוּעַ זֶה הָיָה הַתּוֹר שֶׁל שָׁקֵד.","בְּיוֹם רִאשׁוֹן שָׁקֵד נָתְנָה לְנֶמוֹ קַמְצוּץ אֹכֶל, בְּדִיּוּק כְּמוֹ שֶׁהַמּוֹרָה הִסְבִּירָה.","בְּיוֹם שֵׁנִי הִיא שָׁכְחָה. בְּיוֹם שְׁלִישִׁי הִיא שׁוּב שָׁכְחָה, כִּי מִהֲרָה לַחֲזָרָה שֶׁל הַהַצָּגָה.","בְּיוֹם רְבִיעִי בַּבֹּקֶר שָׁקֵד רָאֲתָה שֶׁנֶּמוֹ שׂוֹחֶה לְאַט מְאוֹד, לְיַד הַקַּרְקָעִית שֶׁל הָאַקְוַרְיוּם.","\"אוֹי, לֹא!\" חָשְׁבָה, וְהִרְגִּישָׁה צְבִיטָה בַּבֶּטֶן. \"זֶה בִּגְלָלִי.\"","הִיא רָצָה אֶל הַמּוֹרָה דַּלְיָה וְסִפְּרָה לָהּ הַכֹּל, בְּלִי לְהַסְתִּיר דָּבָר.","הַמּוֹרָה הִקְשִׁיבָה, וְאָז הִסְבִּירָה: \"דָּגִים יְכוֹלִים לְהִסְתַּדֵּר כַּמָּה יָמִים בְּלִי אֹכֶל, אֲבָל לֹא הַרְבֵּה.\"","\"טוֹב שֶׁסִּפַּרְתָּ לִי מִיָּד. בּוֹאִי נַאֲכִיל אוֹתוֹ עַכְשָׁו, וְנִרְאֶה מָה יִקְרֶה.\"","שָׁקֵד פִּזְּרָה מְעַט אֹכֶל עַל הַמַּיִם. אַחֲרֵי רֶגַע נֶמוֹ עָלָה לְמַעְלָה וְהִתְחִיל לֶאֱכֹל.","עַד הַצָּהֳרַיִם הוּא כְּבָר שָׂחָה מַהֵר, מִצַּד לְצַד, כְּאִלּוּ לֹא קָרָה כְּלוּם.","בְּאוֹתוֹ עֶרֶב שָׁקֵד הֵכִינָה שֶׁלֶט קָטָן, וּלְמָחֳרָת תָּלְתָה אוֹתוֹ לְיַד הָאַקְוַרְיוּם:","\"הַאֲכָלָתָם אֶת נֶמוֹ הַיּוֹם? סַמְּנוּ V!\" וּמִתַּחַת לַשֶּׁלֶט – טַבְלָה עִם כָּל יְמֵי הַשָּׁבוּעַ."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 1 שֶׁהַמַּיִם \"אוּלַי הָיוּ פַּעַם בַּיָּם, בֶּעָנָן אוֹ בְּקַרְחוֹן\"?","options":["כִּי בְּקַרְחוֹן יֵשׁ הַרְבֵּה מַיִם","כְּדֵי לְעוֹרֵר סַקְרָנוּת, וּלְהַרְאוֹת שֶׁהַמַּיִם עוֹבְרִים מִמָּקוֹם לְמָקוֹם","כְּדֵי לְסַפֵּר עַל טִיּוּל לַיָּם","כִּי מַיִם מֵהַיָּם טוֹבִים לִשְׁתִיָּה"],"answer":1,"exp":"הַמִּשְׁפָּט הָרִאשׁוֹן מַפְתִּיעַ אוֹתָנוּ, וּבְשׁוּרָה 2 מֻסְבָּר שֶׁהַמַּיִם עוֹבְרִים כָּל הַזְּמַן מִמָּקוֹם לְמָקוֹם."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה קוֹרֶה לָאֵדִים כְּשֶׁהֵם מַגִּיעִים לְמָקוֹם קַר?","options":["הֵם הוֹפְכִים לַשֶּׁמֶשׁ","הֵם נֶעֱלָמִים","הֵם הוֹפְכִים לְטִפּוֹת קְטַנְטַנּוֹת שֶׁל מַיִם","הֵם יוֹרְדִים מִיָּד לַיָּם"],"answer":2,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"בְּקֹר הָאֵדִים הוֹפְכִים לְטִפּוֹת קְטַנְטַנּוֹת שֶׁל מַיִם\"."},{"id":"r3","sec":"read","p":0,"tag":"s","type":"mc","q":"מָה קוֹרֶה אַחֲרֵי שֶׁהַטִּפּוֹת בֶּעָנָן מִתְחַבְּרוֹת וְנַעֲשׂוֹת כְּבֵדוֹת?","options":["הֵן הוֹפְכוֹת לְאֵדִים","הֵן עוֹלוֹת לְמַעְלָה","הֵן נַעֲשׂוֹת קְטַנּוֹת יוֹתֵר","הֵן נוֹפְלוֹת לְמַטָּה כְּגֶשֶׁם"],"answer":3,"exp":"בְּשׁוּרָה 6 כָּתוּב שֶׁהַטִּפּוֹת הַכְּבֵדוֹת נוֹפְלוֹת לְמַטָּה: זֶה הַגֶּשֶׁם."},{"id":"r4","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נִסְפָּגִים\" (שׁוּרָה 7)?","options":["עָפִים לַשָּׁמַיִם","נַעֲשִׂים מְלֻכְלָכִים","נִכְנָסִים לְתוֹךְ הָאֲדָמָה","קֻפָּאִים"],"answer":2,"exp":"מַיִם שֶׁנִּסְפָּגִים בָּאֲדָמָה נִכְנָסִים לְתוֹכָהּ, כְּמוֹ מַיִם שֶׁנִּכְנָסִים לִסְפֹּג."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["כַּמָּה גֶּשֶׁם יוֹרֵד בַּחֹרֶף?","מָה גּוֹרֵם לְמַיִם לַהֲפֹךְ לְאֵדִים?","לְאָן הוֹלְכִים מֵי הַגֶּשֶׁם?","אֵיךְ נוֹצָרִים הָעֲנָנִים?"],"answer":0,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה גֶּשֶׁם יוֹרֵד. שְׁאַר הַשְּׁאֵלוֹת נַעֲנוֹת בְּשׁוּרוֹת 3–7."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיָה הַתַּפְקִיד שֶׁל שָׁקֵד הַשָּׁבוּעַ?","options":["לִקְנוֹת דָּג חָדָשׁ","לְהָכִין הַצָּגָה","לְנַקּוֹת אֶת הָאַקְוַרְיוּם","לְהַאֲכִיל אֶת הַדָּג"],"answer":3,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁבְּכָל שָׁבוּעַ יֶלֶד אַחֵר אַחְרַאי לְהַאֲכִיל אֶת הַדָּג, וְהַשָּׁבוּעַ – שָׁקֵד."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה שָׁקֵד שָׁכְחָה לְהַאֲכִיל אֶת הַדָּג בְּיוֹם שְׁלִישִׁי?","options":["כִּי הַמּוֹרָה אָמְרָה לֹא לְהַאֲכִיל","כִּי הִיא מִהֲרָה לַחֲזָרָה שֶׁל הַהַצָּגָה","כִּי נִגְמַר הָאֹכֶל","כִּי הִיא הָיְתָה חוֹלָה"],"answer":1,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁבְּיוֹם שְׁלִישִׁי הִיא שָׁכְחָה כִּי מִהֲרָה לַחֲזָרָה שֶׁל הַהַצָּגָה."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"קַמְצוּץ\" (שׁוּרָה 3)?","options":["שַׂקִּית שְׁלֵמָה","כַּמּוּת קְטַנָּה מְאוֹד","כַּף גְּדוֹלָה","טִפָּה שֶׁל מַיִם"],"answer":1,"exp":"קַמְצוּץ הוּא כַּמּוּת קְטַנָּה – כַּמָּה שֶׁאֶפְשָׁר לְהַחְזִיק בֵּין שְׁתֵּי אֶצְבָּעוֹת."},{"id":"r9","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה שָׁקֵד הִרְגִּישָׁה \"צְבִיטָה בַּבֶּטֶן\" (שׁוּרָה 6)?","options":["כִּי הִיא הָיְתָה רְעֵבָה","כִּי הִיא אָכְלָה יוֹתֵר מִדַּי","כִּי הִיא הִרְגִּישָׁה אַשְׁמָה וּדְאָגָה לַדָּג","כִּי מִישֶׁהוּ צָבַט אוֹתָהּ"],"answer":2,"exp":"שָׁקֵד אָמְרָה \"זֶה בִּגְלָלִי\" – הִיא דָּאֲגָה לְנֶמוֹ וְהִרְגִּישָׁה אַשְׁמָה."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה אָמְרָה הַמּוֹרָה עַל דָּגִים?","options":["שֶׁנֶּמוֹ חוֹלֶה מְאוֹד","שֶׁהֵם לֹא צְרִיכִים אֹכֶל בִּכְלָל","שֶׁהֵם צְרִיכִים לֶאֱכֹל כָּל שָׁעָה","שֶׁהֵם יְכוֹלִים לְהִסְתַּדֵּר כַּמָּה יָמִים בְּלִי אֹכֶל, אֲבָל לֹא הַרְבֵּה"],"answer":3,"exp":"בְּשׁוּרָה 8 הַמּוֹרָה מַסְבִּירָה שֶׁדָּגִים יְכוֹלִים לְהִסְתַּדֵּר כַּמָּה יָמִים בְּלִי אֹכֶל, אֲבָל לֹא הַרְבֵּה."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לְהָבִין מִשּׁוּרָה 11?","options":["שֶׁנֶּמוֹ הִרְגִּישׁ טוֹב שׁוּב","שֶׁנֶּמוֹ יָשָׁן כָּל הַיּוֹם","שֶׁנֶּמוֹ קָפַץ מֵהָאַקְוַרְיוּם","שֶׁנֶּמוֹ הָיָה עָיֵף מְאוֹד"],"answer":0,"exp":"נֶמוֹ שָׂחָה מַהֵר מִצַּד לְצַד, \"כְּאִלּוּ לֹא קָרָה כְּלוּם\" – הוּא הִתְאוֹשֵׁשׁ."},{"id":"r12","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה שָׁקֵד הֵכִינָה אֶת הַשֶּׁלֶט עִם הַטַּבְלָה?","options":["כְּדֵי שֶׁאַף אֶחָד לֹא יִשְׁכַּח לְהַאֲכִיל אֶת נֶמוֹ","כְּדֵי לְלַמֵּד אֶת נֶמוֹ לִקְרֹא","כְּדֵי לְקַשֵּׁט אֶת הַכִּתָּה","כִּי הַמּוֹרָה רָצְתָה לְהַעֲנִישׁ אוֹתָהּ"],"answer":0,"exp":"בַּטַּבְלָה מְסַמְּנִים בְּכָל יוֹם V, וְכָךְ רוֹאִים אִם נֶמוֹ כְּבָר קִבֵּל אֹכֶל."},{"type":"open","tag":"calc","expr":"27 + 28 = ___","answer":55,"exp":"⁦27 + 28 = 55⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"90 − 47 = ___","answer":43,"exp":"⁦90 − 47 = 43⁩. בְּדִיקָה: ⁦43 + 47 = 90⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"8 × 4 = ___","answer":32,"exp":"⁦8 × 4 = 32⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"20 : 4 = ___","answer":5,"exp":"⁦20 : 4 = 5⁩, כִּי ⁦4 × 5 = 20⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 20 = 50","answer":30,"exp":"⁦50 − 20 = 30⁩, וְלָכֵן ⁦30 + 20 = 50⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"53 − ___ = 34","answer":19,"exp":"⁦53 − 34 = 19⁩, וְלָכֵן ⁦53 − 19 = 34⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 5 = 9","answer":45,"exp":"⁦45 : 5 = 9⁩, כִּי ⁦5 × 9 = 45⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"42 + 19 < 42 + ___","min":20,"max":999,"exp":"מִצַּד שְׂמֹאל וּמִצַּד יָמִין יֵשׁ 42. כְּדֵי שֶׁהַצַּד הַיְּמָנִי יִהְיֶה גָּדוֹל יוֹתֵר, צָרִיךְ מִסְפָּר גָּדוֹל מ־19, לְמָשָׁל 20.","answer":20,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ − 3 = 11","options":["⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 7: 7 + 7 − 3 = 11⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ − 5 = 4","options":["⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 3: 3 + 3 + 3 − 5 = 4⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square","square"],24],[["square","circle"],10]],"ask":["circle","circle"]},"options":["3","4","5","6"],"answer":1,"exp":"שְׁלוֹשָׁה רִבּוּעִים = 24, אָז רִבּוּעַ = 8. עִגּוּל = ⁦10 − 8 = 2⁩. שְׁנֵי עִגּוּלִים: ⁦2 + 2 = 4⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"שָׁקֵד קָנְתָה 3 סְפָרִים. כָּל סֵפֶר עוֹלֶה 9 ₪. שָׁקֵד שִׁלְּמָה בִּשְׁטָר שֶׁל 50 ₪. כַּמָּה עֹדֶף קִבְּלָה?","options":["23","27","32","41"],"answer":0,"exp":"⁦3 × 9 = 27⁩ ₪ וְאָז ⁦50 − 27 = 23⁩ ₪ עֹדֶף.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"לַאֲרִיאֵל יֵשׁ 52 חֲרוּזִים, וּלְאָחִיו יֵשׁ 20 חֲרוּזִים. כַּמָּה חֲרוּזִים יֵשׁ לַאֲרִיאֵל יוֹתֵר מֵאֲשֶׁר לְאָחִיו?","options":["22","32","42","72"],"answer":1,"exp":"מְחַפְּשִׂים אֶת הַהֶפְרֵשׁ: ⁦52 − 20 = 32⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"עוּגִיָּה עוֹלָה 8 ₪, וְשׁוֹקוֹ עוֹלֶה 6 ₪. מַאיָה קָנְתָה 2 עוּגִיּוֹת וְשׁוֹקוֹ אֶחָד. כַּמָּה שִׁלְּמָה?","options":["14","20","22","28"],"answer":2,"exp":"2 עוּגִיּוֹת: ⁦8 + 8 = 16⁩. וְעוֹד שׁוֹקוֹ: ⁦16 + 6 = 22⁩ ₪.","id":"m14","sec":"math"}]},{"n":13,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַזִּקִּית","lines":["הַזִּקִּית הִיא זוֹחֵל קָטָן שֶׁחַי עַל עֵצִים וְעַל שִׂיחִים, גַּם בְּיִשְׂרָאֵל.","הַדָּבָר הַמְּפֻרְסָם בְּיוֹתֵר אֵצֶל הַזִּקִּית הוּא שֶׁהִיא יְכוֹלָה לְשַׁנּוֹת אֶת הַצֶּבַע שֶׁלָּהּ.","אֲנָשִׁים רַבִּים חוֹשְׁבִים שֶׁהִיא מְשַׁנָּה צֶבַע כְּדֵי לְהַתְאִים אֶת עַצְמָהּ לַמָּקוֹם שֶׁהִיא עוֹמֶדֶת בּוֹ.","אֲבָל הַחוֹקְרִים גִּלּוּ שֶׁזֶּה לֹא בְּדִיּוּק כָּךְ: לָרֹב הַזִּקִּית מְשַׁנָּה צֶבַע לְפִי מַצַּב הָרוּחַ שֶׁלָּהּ,","אוֹ כְּדֵי לְהִתְחַמֵּם וּלְהִתְקָרֵר. בְּבֹקֶר קַר הִיא נַעֲשֵׂית כֵּהֶה, כִּי צֶבַע כֵּהֶה סוֹפֵג יוֹתֵר חֹם.","גַּם הָעֵינַיִם שֶׁל הַזִּקִּית מְיֻחָדוֹת: כָּל עַיִן יְכוֹלָה לָזוּז לְבַד, לְכִוּוּן אַחֵר.","כָּךְ הַזִּקִּית יְכוֹלָה לְהִסְתַּכֵּל קָדִימָה וַאֲחוֹרָה בְּאוֹתוֹ זְמַן.","כְּשֶׁהִיא רוֹאָה חֶרֶק, הִיא שׁוֹלַחַת אֵלָיו לָשׁוֹן אֲרֻכָּה וּדְבִיקָה, אֲרֻכָּה כִּמְעַט כְּמוֹ הַגּוּף שֶׁלָּהּ,","וְתוֹךְ רֶגַע הַחֶרֶק כְּבָר בְּתוֹךְ הַפֶּה."]},{"kind":"story","title":"הַפַּרְפַּר הַכָּחֹל","lines":["בַּטִּיּוּל הַשְּׁנָתִי הַכִּתָּה שֶׁל אֵיתָן הָלְכָה בִּשְׁבִיל אָרֹךְ בַּיַּעַר.","הַמּוֹרָה בִּקְּשָׁה שֶׁכֻּלָּם יֵלְכוּ יַחַד, וְשֶׁאַף אֶחָד לֹא יִתְרַחֵק מֵהַקְּבוּצָה.","אֵיתָן רָאָה בְּצַד הַשְּׁבִיל פַּרְפַּר כָּחֹל עֲנָק, שֶׁעָף מִפֶּרַח לְפֶרַח.","\"רַק רֶגַע,\" אָמַר לְעַצְמוֹ, וְהָלַךְ אַחֲרָיו בֵּין הָעֵצִים.","הַפַּרְפַּר עָף רָחוֹק יוֹתֵר וְיוֹתֵר, וְאֵיתָן הָלַךְ אַחֲרָיו, בְּלִי לָשִׂים לֵב לַזְּמַן.","כְּשֶׁהַפַּרְפַּר נֶעֱלַם, אֵיתָן הִסְתּוֹבֵב – וְלֹא רָאָה אַף אֶחָד. מִסָּבִיב הָיוּ רַק עֵצִים.","הוּא קָרָא בְּקוֹל: \"הַמּוֹרָה! יוֹאָב!\" אֲבָל רַק הָרוּחַ עָנְתָה לוֹ, בְּרִשְׁרוּשׁ שֶׁל עָלִים.","אֵיתָן נִבְהַל. הוּא רָצָה לָרוּץ לְכָל הַכִּוּוּנִים, אֲבָל אָז נִזְכַּר בְּמָה שֶׁאַבָּא לִמֵּד אוֹתוֹ:","\"אִם הָלַכְתָּ לְאִבּוּד – עֲצֹר, הִשָּׁאֵר בַּמָּקוֹם, וַעֲשֵׂה רַעַשׁ כְּדֵי שֶׁיִּמְצְאוּ אוֹתְךָ.\"","אֵיתָן הִתְיַשֵּׁב עַל סֶלַע, לָקַח אֶת הַמַּשְׁרוֹקִית שֶׁהָיְתָה תְּלוּיָה עַל הַתִּיק, וְשָׁרַק חָזָק.","אַחֲרֵי כַּמָּה דַּקּוֹת הוּא שָׁמַע קוֹלוֹת. הַמּוֹרָה וּשְׁנֵי הוֹרִים מְלַוִּים רָצוּ לְעֶבְרוֹ.","\"אֵיתָן! חִפַּשְׂנוּ אוֹתְךָ בְּכָל מָקוֹם,\" אָמְרָה הַמּוֹרָה, וְחִבְּקָה אוֹתוֹ.","בָּעֶרֶב, בַּבַּיִת, אֵיתָן סִפֵּר לְאַבָּא עַל הַפַּרְפַּר, עַל הַפַּחַד וְעַל הַמַּשְׁרוֹקִית.","\"עָשִׂיתָ בְּדִיּוּק אֶת הַדָּבָר הַנָּכוֹן,\" אָמַר אַבָּא. \"אֲבָל בַּפַּעַם הַבָּאָה – הַפַּרְפַּר יְחַכֶּה.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה הַדָּבָר הַמְּפֻרְסָם בְּיוֹתֵר אֵצֶל הַזִּקִּית?","options":["שֶׁיֵּשׁ לָהּ לָשׁוֹן אֲרֻכָּה","שֶׁהִיא יְכוֹלָה לְשַׁנּוֹת צֶבַע","שֶׁהָעֵינַיִם שֶׁלָּהּ גְּדוֹלוֹת","שֶׁהִיא חַיָּה בְּיִשְׂרָאֵל"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַדָּבָר הַמְּפֻרְסָם בְּיוֹתֵר הוּא שֶׁהִיא מְשַׁנָּה צֶבַע."},{"id":"r2","sec":"read","p":0,"tag":"c","type":"mc","q":"מָה גִּלּוּ הַחוֹקְרִים, שׁוֹנֶה מִמָּה שֶׁאֲנָשִׁים רַבִּים חוֹשְׁבִים?","options":["שֶׁהַזִּקִּית מְשַׁנָּה צֶבַע רַק בַּלַּיְלָה","שֶׁהַזִּקִּית לֹא מְשַׁנָּה צֶבַע בִּכְלָל","שֶׁהַזִּקִּית מְשַׁנָּה צֶבַע כְּדֵי לְהַתְאִים לַמָּקוֹם","שֶׁלָּרֹב הַזִּקִּית מְשַׁנָּה צֶבַע לְפִי מַצַּב הָרוּחַ וּלְפִי הַחֹם"],"answer":3,"exp":"אֲנָשִׁים חוֹשְׁבִים שֶׁהִיא מַתְאִימָה אֶת עַצְמָהּ לַמָּקוֹם (שׁוּרָה 3), אֲבָל הַחוֹקְרִים גִּלּוּ מַשֶּׁהוּ אַחֵר (שׁוּרוֹת 4–5)."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַזִּקִּית נַעֲשֵׂית כֵּהֶה בְּבֹקֶר קַר?","options":["כִּי הִיא מִתְחַבֵּאת מֵחֲרָקִים","כִּי הִיא עֲצוּבָה בַּבֹּקֶר","כִּי בַּבֹּקֶר עוֹד חָשׁוּךְ","כִּי צֶבַע כֵּהֶה סוֹפֵג יוֹתֵר חֹם, וְכָךְ הִיא מִתְחַמֶּמֶת"],"answer":3,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"צֶבַע כֵּהֶה סוֹפֵג יוֹתֵר חֹם\"."},{"id":"r4","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"סוֹפֵג\" (שׁוּרָה 5)?","options":["מְקָרֵר","מַכְנִיס לְתוֹכוֹ","מַפְחִיד","מַסְתִּיר"],"answer":1,"exp":"צֶבַע כֵּהֶה סוֹפֵג חֹם – מַכְנִיס יוֹתֵר חֹם לְתוֹכוֹ, וְלָכֵן מְחַמֵּם."},{"id":"r5","sec":"read","p":0,"tag":"i","type":"mc","q":"לָמָּה טוֹב לְזִקִּית שֶׁכָּל עַיִן שֶׁלָּהּ יְכוֹלָה לָזוּז לְבַד?","options":["כִּי כָּךְ הִיא רוֹאָה לְכַמָּה כִּוּוּנִים בְּבַת אַחַת","כִּי כָּךְ הִיא יְכוֹלָה לְשַׁנּוֹת צֶבַע","כִּי כָּךְ הִיא שׁוֹמַעַת טוֹב יוֹתֵר","כִּי כָּךְ הַלָּשׁוֹן שֶׁלָּהּ אֲרֻכָּה יוֹתֵר"],"answer":0,"exp":"בְּשׁוּרָה 7: הִיא יְכוֹלָה לְהִסְתַּכֵּל קָדִימָה וַאֲחוֹרָה בְּאוֹתוֹ זְמַן."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה בִּקְּשָׁה הַמּוֹרָה בַּטִּיּוּל?","options":["שֶׁכֻּלָּם יֵלְכוּ יַחַד וְלֹא יִתְרַחֲקוּ מֵהַקְּבוּצָה","שֶׁכֻּלָּם יֵשְׁבוּ עַל סֶלַע","שֶׁכֻּלָּם יִשְׁרְקוּ בְּמַשְׁרוֹקִית","שֶׁכָּל אֶחָד יְחַפֵּשׂ פַּרְפָּרִים"],"answer":0,"exp":"בְּשׁוּרָה 2 הַמּוֹרָה מְבַקֶּשֶׁת שֶׁכֻּלָּם יֵלְכוּ יַחַד, וְשֶׁאַף אֶחָד לֹא יִתְרַחֵק."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אֵיתָן הִתְרַחֵק מֵהַקְּבוּצָה?","options":["כִּי הוּא חִפֵּשׂ אֶת יוֹאָב","כִּי הוּא שָׁמַע קוֹלוֹת","כִּי הוּא הָלַךְ אַחֲרֵי פַּרְפַּר כָּחֹל","כִּי הוּא רָצָה לַחְזֹר הַבַּיְתָה"],"answer":2,"exp":"בְּשׁוּרוֹת 3–4 אֵיתָן רָאָה פַּרְפַּר וְהָלַךְ אַחֲרָיו בֵּין הָעֵצִים."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"רִשְׁרוּשׁ\" (שׁוּרָה 7)?","options":["שֶׁקֶט מֻחְלָט","צְעָקָה חֲזָקָה","שִׁירָה","קוֹל שָׁקֵט שֶׁל דְּבָרִים שֶׁזָּזִים, כְּמוֹ עָלִים בָּרוּחַ"],"answer":3,"exp":"רִשְׁרוּשׁ הוּא הַקּוֹל הַשָּׁקֵט שֶׁעָלִים עוֹשִׂים כְּשֶׁהָרוּחַ מְזִיזָה אוֹתָם."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 7 ש\"רק הָרוּחַ עָנְתָה לוֹ\"?","options":["כִּי הָרוּחַ יוֹדַעַת לְדַבֵּר","כִּי הַמּוֹרָה עָנְתָה לוֹ מֵרָחוֹק","כְּדֵי לְהַרְאוֹת שֶׁאַף אֶחָד לֹא שָׁמַע אֶת אֵיתָן","כִּי יוֹאָב צָחַק עָלָיו"],"answer":2,"exp":"אֵיתָן קָרָא, וְאַף אֶחָד לֹא עָנָה – רַק הֶעָלִים רִשְׁרְשׁוּ בָּרוּחַ. הוּא הָיָה לְבַד."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה לִמֵּד אַבָּא אֶת אֵיתָן לַעֲשׂוֹת אִם הוּא הוֹלֵךְ לְאִבּוּד?","options":["לָרוּץ מַהֵר לְכָל הַכִּוּוּנִים","לְטַפֵּס עַל עֵץ","לַעֲצֹר, לְהִשָּׁאֵר בַּמָּקוֹם וְלַעֲשׂוֹת רַעַשׁ","לָלֶכֶת הַבַּיְתָה לְבַד"],"answer":2,"exp":"בְּשׁוּרָה 9: \"עֲצֹר, הִשָּׁאֵר בַּמָּקוֹם, וַעֲשֵׂה רַעַשׁ כְּדֵי שֶׁיִּמְצְאוּ אוֹתְךָ\"."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה אֵיתָן שָׁרַק בְּמַשְׁרוֹקִית?","options":["כִּי הוּא רָצָה לְשַׂחֵק","כְּדֵי שֶׁיִּשְׁמְעוּ אוֹתוֹ וְיִמְצְאוּ אוֹתוֹ","כְּדֵי לִקְרֹא לְפַרְפֵּר","כִּי הוּא שָׂמֵחַ"],"answer":1,"exp":"הוּא עָשָׂה מָה שֶׁאַבָּא לִמֵּד: לַעֲשׂוֹת רַעַשׁ כְּדֵי שֶׁיִּמְצְאוּ אוֹתוֹ."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֵּן אַבָּא כְּשֶׁהוּא אוֹמֵר \"בַּפַּעַם הַבָּאָה – הַפַּרְפַּר יְחַכֶּה\" (שׁוּרָה 14)?","options":["שֶׁבַּפַּעַם הַבָּאָה אֵיתָן צָרִיךְ לְהִשָּׁאֵר עִם הַקְּבוּצָה","שֶׁאִתָּן צָרִיךְ לְחַכּוֹת לְפַרְפֵּר בַּיַּעַר","שֶׁאַבָּא יִקְנֶה לוֹ פַּרְפַּר","שֶׁהַפַּרְפַּר יַחְזֹר מָחָר"],"answer":0,"exp":"אַבָּא אוֹמֵר: הַפַּרְפַּר לֹא חָשׁוּב יוֹתֵר מִלְּהִשָּׁאֵר עִם הַקְּבוּצָה."},{"type":"open","tag":"calc","expr":"29 + 23 = ___","answer":52,"exp":"⁦29 + 23 = 52⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"57 − 29 = ___","answer":28,"exp":"⁦57 − 29 = 28⁩. בְּדִיקָה: ⁦28 + 29 = 57⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"5 × 5 = ___","answer":25,"exp":"⁦5 × 5 = 25⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"21 : 3 = ___","answer":7,"exp":"⁦21 : 3 = 7⁩, כִּי ⁦3 × 7 = 21⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 21 = 41","answer":20,"exp":"⁦41 − 21 = 20⁩, וְלָכֵן ⁦20 + 21 = 41⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"87 − ___ = 35","answer":52,"exp":"⁦87 − 35 = 52⁩, וְלָכֵן ⁦87 − 52 = 35⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 4 = 4","answer":16,"exp":"⁦16 : 4 = 4⁩, כִּי ⁦4 × 4 = 16⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"72 − 23 > 72 − ___","min":24,"max":72,"exp":"כְּשֶׁמּוֹרִידִים יוֹתֵר, נִשְׁאַר פָּחוֹת. צָרִיךְ לְהוֹרִיד יוֹתֵר מ־23, לְמָשָׁל 24.","answer":24,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + △ + △ − 4 = 5","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 3: 3 + 3 + 3 − 4 = 5⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + 8 = △ + △","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 8 + 8 = 8 + 8⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["heart","heart","heart"],21],[["heart","square"],11]],"ask":["square","square"]},"options":["7","8","9","10"],"answer":1,"exp":"שְׁלוֹשָׁה לְבָבוֹת = 21, אָז לֵב = 7. רִבּוּעַ = ⁦11 − 7 = 4⁩. שְׁנֵי רִבּוּעִים: ⁦4 + 4 = 8⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"תָּמָר קָטַף 24 תּוּתִים וְחִלֵּק אוֹתָם שָׁוֶה בְּשָׁוֶה בֵּין 6 חֲבֵרִים. כַּמָּה תּוּתִים קִבֵּל כָּל חָבֵר?","options":["4","8","10","18"],"answer":0,"exp":"⁦24 : 6 = 4⁩, כִּי ⁦6 × 4 = 24⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בָּאוֹטוֹבּוּס הָיוּ 29 נוֹסְעִים. בַּתַּחֲנָה יָרְדוּ 12 נוֹסְעִים וְעָלוּ 10 נוֹסְעִים. כַּמָּה נוֹסְעִים יֵשׁ עַכְשָׁו בָּאוֹטוֹבּוּס?","options":["7","17","27","51"],"answer":2,"exp":"⁦29 − 12 = 17⁩, וְאָז ⁦17 + 10 = 27⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"מִיכַל קוֹרֵאת סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרְאָה 5 עַמּוּדִים. בְּכָל יוֹם הִיא קָרְאָה 4 עַמּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרְאָה בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["13","15","19","27"],"answer":3,"exp":"יוֹם ⁦1: 5⁩, יוֹם ⁦2: 9⁩, יוֹם ⁦3: 13⁩. בְּיַחַד: 27.","id":"m14","sec":"math"}]},{"n":14,"level":"בינוני","printable":false,"passages":[{"kind":"info","title":"הַקֶּשֶׁת בֶּעָנָן","lines":["לִפְעָמִים, אַחֲרֵי גֶּשֶׁם, כְּשֶׁהַשֶּׁמֶשׁ יוֹצֵאת, מוֹפִיעָה בַּשָּׁמַיִם קֶשֶׁת בֶּעָנָן.","נִדְמֶה לָנוּ שֶׁהָאוֹר שֶׁל הַשֶּׁמֶשׁ לָבָן, אֲבָל בְּעֶצֶם יֵשׁ בּוֹ הַרְבֵּה צְבָעִים, מְעֻרְבָּבִים יַחַד.","כְּשֶׁהָאוֹר עוֹבֵר דֶּרֶךְ טִפּוֹת הַמַּיִם שֶׁנִּשְׁאֲרוּ בָּאֲוִיר, הַטִּפּוֹת מַפְרִידוֹת בֵּין הַצְּבָעִים.","כָּךְ אֲנַחְנוּ רוֹאִים פַּס שֶׁל צְבָעִים: אָדֹם, כָּתֹם, צָהֹב, יָרֹק, כָּחֹל וְסָגֹל.","הַצְּבָעִים בַּקֶּשֶׁת מוֹפִיעִים תָּמִיד בְּאוֹתוֹ סֵדֶר: הָאָדֹם לְמַעְלָה, וְהַסָּגֹל לְמַטָּה.","כְּדֵי לִרְאוֹת קֶשֶׁת, צָרִיךְ לַעֲמֹד כְּשֶׁהַשֶּׁמֶשׁ מֵאֲחוֹרֵינוּ וְהַטִּפּוֹת מוּלֵנוּ.","לָכֵן בַּבֹּקֶר נִרְאֶה אֶת הַקֶּשֶׁת בַּמַּעֲרָב, וְאַחַר הַצָּהֳרַיִם – בַּמִּזְרָח.","אֶפְשָׁר לִיצֹר קֶשֶׁת קְטַנָּה גַּם בַּבַּיִת: עוֹמְדִים בַּגִּנָּה בְּיוֹם שֶׁמֶשׁ, עִם הַגַּב לַשֶּׁמֶשׁ,","וּמַתִּיזִים מַיִם מֵהַצִּנּוֹר. בְּתוֹךְ הַטִּפּוֹת תּוֹפִיעַ קֶשֶׁת קְטַנָּה."]},{"kind":"story","title":"שָׁלוֹשׁ דְּפִיקוֹת","lines":["בְּכָל עֶרֶב, כְּשֶׁהֲדַר נִכְנְסָה לַמִּטָּה, הִיא שָׁמְעָה מִבַּעַד לַקִּיר צְלִילִים שֶׁל פְּסַנְתֵּר.","הַצְּלִילִים הִגִּיעוּ מֵהַדִּירָה שֶׁל הַשָּׁכֵן הֶחָדָשׁ, שֶׁגָּר מֵעֵבֶר לַקִּיר.","בַּהַתְחָלָה הִיא כָּעֲסָה. \"אֵיךְ אֶפְשָׁר לְהֵרָדֵם עִם כָּל הָרַעַשׁ הַזֶּה?\" הִתְלוֹנְנָה לְאִמָּא.","אֲבָל לְאַט לְאַט הִיא הִתְרַגְּלָה. הַצְּלִילִים הָיוּ שְׁקֵטִים וַעֲדִינִים, וְאַחֲרֵי כַּמָּה עֲרָבִים הִיא כְּבָר חִכְּתָה לָהֶם.","בְּכָל עֶרֶב הַשָּׁכֵן נִגֵּן אֶת אוֹתָהּ מַנְגִּינָה, שׁוּב וָשׁוּב, וּבְכָל פַּעַם הִיא נִשְׁמְעָה קְצָת יוֹתֵר יָפֶה.","עֶרֶב אֶחָד הַפְּסַנְתֵּר שָׁתַק. גַּם בָּעֶרֶב שֶׁאַחֲרָיו לֹא נִשְׁמַע שׁוּם צְלִיל.","הֲדַר שָׁכְבָה בַּמִּטָּה וְלֹא הִצְלִיחָה לְהֵרָדֵם. מַשֶּׁהוּ הָיָה חָסֵר לָהּ.","\"אוּלַי קָרָה לוֹ מַשֶּׁהוּ?\" שָׁאֲלָה אֶת אִמָּא בַּבֹּקֶר.","אַחֲרֵי בֵּית הַסֵּפֶר הֲדַר וְאִמָּא דָּפְקוּ בַּדֶּלֶת שֶׁל הַשָּׁכֵן. פָּתַח לָהֶן אִישׁ מְבֻגָּר, עִם צָעִיף עַל הַצַּוָּאר.","\"הִצְטַנַּנְתִּי, וְאֵין לִי כּוֹחַ לְנַגֵּן,\" אָמַר בְּקוֹל צָרוּד. \"אֲבָל אֵיךְ יְדַעְתֶּן?\"","הֲדַר הִסְמִיקָה. \"אֲנִי שׁוֹמַעַת אוֹתְךָ מְנַגֵּן בְּכָל עֶרֶב,\" אָמְרָה. \"זֶה עוֹזֵר לִי לְהֵרָדֵם.\"","הָאִישׁ חִיֵּךְ חִיּוּךְ רָחָב. \"אֲנִי מִתְאַמֵּן לִקְרַאת הוֹפָעָה,\" סִפֵּר. \"חָשַׁבְתִּי שֶׁאֲנִי מַפְרִיעַ לְכֻלָּם.\"","כַּעֲבֹר כַּמָּה יָמִים הַפְּסַנְתֵּר חָזַר לְנַגֵּן. הַפַּעַם, בְּסוֹף הַמַּנְגִּינָה, נִשְׁמְעוּ שָׁלוֹשׁ דְּפִיקוֹת קְטַנּוֹת עַל הַקִּיר.","הֲדַר חִיְּכָה, וְדָפְקָה בַּחֲזָרָה שָׁלוֹשׁ פְּעָמִים: \"לַיְלָה טוֹב\"."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 2 \"נִדְמֶה לָנוּ שֶׁהָאוֹר שֶׁל הַשֶּׁמֶשׁ לָבָן\"?","options":["כִּי בַּחֹרֶף הָאוֹר לָבָן","כִּי הַשֶּׁמֶשׁ לְבָנָה","כְּדֵי לְהַסְבִּיר שֶׁבֶּאֱמֶת יֵשׁ בָּאוֹר הַרְבֵּה צְבָעִים, גַּם אִם הוּא נִרְאֶה לָבָן","כְּדֵי לְהַגִּיד שֶׁאֵין צְבָעִים בָּאוֹר"],"answer":2,"exp":"\"נִדְמֶה לָנוּ\" – כָּךְ זֶה נִרְאֶה, אֲבָל \"בְּעֶצֶם\" יֵשׁ בָּאוֹר הַרְבֵּה צְבָעִים."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה מַפְרִיד בֵּין הַצְּבָעִים שֶׁל הָאוֹר?","options":["הָעֲנָנִים","הַשֶּׁמֶשׁ עַצְמָהּ","טִפּוֹת הַמַּיִם שֶׁבָּאֲוִיר","הָרוּחַ"],"answer":2,"exp":"בְּשׁוּרָה 3 כָּתוּב: \"הַטִּפּוֹת מַפְרִידוֹת בֵּין הַצְּבָעִים\"."},{"id":"r3","sec":"read","p":0,"tag":"d","type":"mc","q":"אֵיזֶה צֶבַע נִמְצָא בַּחֵלֶק הָעֶלְיוֹן שֶׁל הַקֶּשֶׁת?","options":["יָרֹק","אָדֹם","סָגֹל","כָּחֹל"],"answer":1,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"הָאָדֹם לְמַעְלָה, וְהַסָּגֹל לְמַטָּה\"."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"נֹעָה רוֹאָה קֶשֶׁת בֶּעָנָן מוּלָהּ. אֵיפֹה נִמְצֵאת הַשֶּׁמֶשׁ?","options":["מֵאֲחוֹרַי נֹעָה","בְּתוֹךְ הֶעָנָן","מֵעַל הַקֶּשֶׁת","מוּל נֹעָה"],"answer":0,"exp":"לְפִי שׁוּרָה 6, רוֹאִים קֶשֶׁת כְּשֶׁהַשֶּׁמֶשׁ מֵאֲחוֹרֵינוּ וְהַטִּפּוֹת מוּלֵנוּ."},{"id":"r5","sec":"read","p":0,"tag":"m","type":"mc","q":"מָה הַמַּטָּרָה שֶׁל שׁוּרוֹת 8–9?","options":["לְסַפֵּר עַל גִּנָּה יָפֶה","לְהַסְבִּיר אֵיךְ אֶפְשָׁר לִיצֹר קֶשֶׁת לְבַד","לְהַסְבִּיר מָתַי יוֹרֵד גֶּשֶׁם","לְלַמֵּד אֵיךְ מַשְׁקִים צְמָחִים"],"answer":1,"exp":"שׁוּרוֹת 8–9 מַסְבִּירוֹת אֵיךְ לִיצֹר קֶשֶׁת קְטַנָּה בַּבַּיִת, בְּעֶזְרַת צִנּוֹר מַיִם."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֵאֵיפֹה הִגִּיעוּ הַצְּלִילִים שֶׁל הַפְּסַנְתֵּר?","options":["מֵהַטֵּלֵוִיזְיָה","מֵהַחֶדֶר שֶׁל אִמָּא","מִבֵּית הַסֵּפֶר","מֵהַדִּירָה שֶׁל הַשָּׁכֵן שֶׁמֵּעֵבֶר לַקִּיר"],"answer":3,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַצְּלִילִים הִגִּיעוּ מֵהַדִּירָה שֶׁל הַשָּׁכֵן הֶחָדָשׁ."},{"id":"r7","sec":"read","p":1,"tag":"c","type":"mc","q":"אֵיךְ הִשְׁתַּנְּתָה הַהַרְגָּשָׁה שֶׁל הֲדַר כְּלַפֵּי הַנְּגִינָה?","options":["הִיא אַף פַּעַם לֹא שָׂמָה לֵב לִנְגִינָה","בַּהַתְחָלָה הִיא שְׂמֵחָה, וְאַחַר כָּךְ כָּעֲסָה","הִיא כָּעֲסָה כָּל הַזְּמַן","בַּהַתְחָלָה הִיא כָּעֲסָה, וְאַחַר כָּךְ חִכְּתָה לִנְגִינָה"],"answer":3,"exp":"בְּשׁוּרָה 3 הִיא כָּעֲסָה, וּבְשׁוּרָה 4 הִיא כְּבָר חִכְּתָה לַצְּלִילִים."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה הֲדַר לֹא הִצְלִיחָה לְהֵרָדֵם כְּשֶׁהַפְּסַנְתֵּר שָׁתַק?","options":["כִּי הִיא הָיְתָה חוֹלָה","כִּי אִמָּא נִגְּנָה","כִּי הִיא הִתְרַגְּלָה לְהֵרָדֵם עִם הַנְּגִינָה, וְהַנְּגִינָה חֲסֵרָה לָהּ","כִּי הָיָה רַעַשׁ חָזָק"],"answer":2,"exp":"בְּשׁוּרָה 7: \"מַשֶּׁהוּ הָיָה חָסֵר לָהּ\" – הַנְּגִינָה שֶׁהִיא הִתְרַגְּלָה אֵלֶיהָ."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"צָרוּד\" (שׁוּרָה 10)?","options":["קוֹל גָּבוֹהַּ וְחַד","קוֹל חַלָּשׁ וּמְחֻסְפָּס, כְּמוֹ כְּשֶׁחוֹלִים","קוֹל שֶׁל פְּסַנְתֵּר","קוֹל רָם וְשָׂמֵחַ"],"answer":1,"exp":"הַשָּׁכֵן הִצְטַנֵּן, וְלָכֵן הַקּוֹל שֶׁלּוֹ הָיָה צָרוּד."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה הֲדַר הִסְמִיקָה (שׁוּרָה 11)?","options":["כִּי הִיא כָּעֲסָה עַל הַשָּׁכֵן","כִּי הָיָה חַם מְאוֹד","כִּי הִיא רָצָה מַהֵר","כִּי הִיא הִתְבַּיְּשָׁה קְצָת לְסַפֵּר שֶׁהִיא מַקְשִׁיבָה לוֹ"],"answer":3,"exp":"מַסְמִיקִים כְּשֶׁמִּתְבַּיְּשִׁים. הָיָה לָהּ קְצָת מֵבִיךְ לְסַפֵּר שֶׁהִיא מַקְשִׁיבָה לַנְּגִינָה שֶׁלּוֹ."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה הַשָּׁכֵן חִיֵּךְ חִיּוּךְ רָחָב?","options":["כִּי שָׂמֵחַ לִשְׁמֹעַ שֶׁהַנְּגִינָה שֶׁלּוֹ עוֹזֶרֶת לַהֲדַר, וְלֹא מַפְרִיעָה","כִּי הוּא אָהַב אֶת הַצָּעִיף","כִּי הוּא הִבְרִיא לְגַמְרֵי","כִּי הֲדַר הֵבִיאָה לוֹ עוּגָה"],"answer":0,"exp":"בְּשׁוּרָה 12 הוּא אוֹמֵר שֶׁחָשַׁב שֶׁהוּא מַפְרִיעַ לְכֻלָּם – וְהִתְבָּרֵר שֶׁהוּא בְּעֶצֶם עוֹזֵר."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"מָה פֵּרוּשׁ שְׁלוֹשׁ הַדְּפִיקוֹת עַל הַקִּיר (שׁוּרוֹת 13–14)?","options":["דֶּרֶךְ שֶׁלָּהֶם לְהַגִּיד \"לַיְלָה טוֹב\" זֶה לָזֶה","סִימָן שֶׁהַשָּׁכֵן חוֹלֶה","בַּקָּשָׁה לְשֶׁקֶט","סִימָן שֶׁמִּישֶׁהוּ בַּדֶּלֶת"],"answer":0,"exp":"הֲדַר דָּפְקָה בַּחֲזָרָה שָׁלוֹשׁ פְּעָמִים: \"לַיְלָה טוֹב\"."},{"type":"open","tag":"calc","expr":"58 + 23 = ___","answer":81,"exp":"⁦58 + 23 = 81⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"61 − 17 = ___","answer":44,"exp":"⁦61 − 17 = 44⁩. בְּדִיקָה: ⁦44 + 17 = 61⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"6 × 5 = ___","answer":30,"exp":"⁦6 × 5 = 30⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"36 : 4 = ___","answer":9,"exp":"⁦36 : 4 = 9⁩, כִּי ⁦4 × 9 = 36⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 26 = 43","answer":17,"exp":"⁦43 − 26 = 17⁩, וְלָכֵן ⁦17 + 26 = 43⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"58 − ___ = 35","answer":23,"exp":"⁦58 − 35 = 23⁩, וְלָכֵן ⁦58 − 23 = 35⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"___ : 6 = 7","answer":42,"exp":"⁦42 : 6 = 7⁩, כִּי ⁦6 × 7 = 42⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"7 × 7 < 7 × ___","min":8,"max":999,"exp":"בִּשְׁנֵי הַצְּדָדִים כּוֹפְלִים ב־7. צָרִיךְ מִסְפָּר גָּדוֹל מ־7, לְמָשָׁל 8.","answer":8,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△ + 7 = △ + △","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 7: 7 + 7 = 7 + 7⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"1△ + △ = 22","options":["⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 6: 16 + 6 = 22⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square","square"],18],[["square","circle"],15]],"ask":["circle","circle"]},"options":["17","18","19","20"],"answer":1,"exp":"שְׁלוֹשָׁה רִבּוּעִים = 18, אָז רִבּוּעַ = 6. עִגּוּל = ⁦15 − 6 = 9⁩. שְׁנֵי עִגּוּלִים: ⁦9 + 9 = 18⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"עוּגִיָּה עוֹלָה 6 ₪, וְשׁוֹקוֹ עוֹלֶה 4 ₪. אֵיתָן קָנָה 2 עוּגִיּוֹת וְשׁוֹקוֹ אֶחָד. כַּמָּה שִׁלֵּם?","options":["10","14","16","20"],"answer":2,"exp":"2 עוּגִיּוֹת: ⁦6 + 6 = 12⁩. וְעוֹד שׁוֹקוֹ: ⁦12 + 4 = 16⁩ ₪.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"רוֹעִי קוֹרֵא סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרָא 5 עַמּוּדִים. בְּכָל יוֹם הוּא קָרָא 4 עַמּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרָא בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["13","15","19","27"],"answer":3,"exp":"יוֹם ⁦1: 5⁩, יוֹם ⁦2: 9⁩, יוֹם ⁦3: 13⁩. בְּיַחַד: 27.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּסַּל הָיוּ 14 תַּפּוּחִים. שִׁירָה הוֹצִיאָה מֵהַסַּל חֲצִי מֵהַתַּפּוּחִים, וְאַחַר כָּךְ הוֹסִיפָה לַסַּל עוֹד 7 תַּפּוּחִים. כַּמָּה תַּפּוּחִים יֵשׁ עַכְשָׁו בַּסַּל?","options":["7","14","15","21"],"answer":1,"exp":"חֵצִי מ־14 הוּא 7. נִשְׁאֲרוּ 7, וְעוֹד ⁦7: 14⁩.","id":"m14","sec":"math"}]},{"n":15,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"הָעֲטַלֵּף","lines":["הָעֲטַלֵּף הוּא הַיּוֹנֵק הַיָּחִיד שֶׁיָּכוֹל לָעוּף בֶּאֱמֶת. הַכְּנָפַיִם שֶׁלּוֹ עֲשׂוּיוֹת עוֹר דַּק,","שֶׁמָּתוּחַ בֵּין אֶצְבָּעוֹת אֲרֻכּוֹת מְאוֹד. בִּזְמַן מְנוּחָה הוּא תּוֹלֶה אֶת עַצְמוֹ הָפוּךְ,","כְּשֶׁהוּא נֶאֱחַז בְּרַגְלַיִם בַּתִּקְרָה שֶׁל מְעָרָה אוֹ בַּעֲנַף.","רֹב הָעֲטַלֵּפִים יוֹצְאִים לָצוּד בַּלַּיְלָה. אֲבָל אֵיךְ אֶפְשָׁר לִמְצֹא חֶרֶק קָטָן בַּחֹשֶׁךְ?","הָעֲטַלֵּף מַשְׁמִיעַ צְלִילִים גְּבוֹהִים מְאוֹד, שֶׁהָאֹזֶן שֶׁלָּנוּ בִּכְלָל לֹא שׁוֹמַעַת.","הַצְּלִילִים פּוֹגְעִים בְּחֶרֶק וְחוֹזְרִים אֶל הָעֲטַלֵּף, כְּמוֹ הֵד.","לְפִי הַהֵד הָעֲטַלֵּף יוֹדֵעַ אֵיפֹה הַחֶרֶק נִמְצָא, כַּמָּה הוּא גָּדוֹל וּלְאָן הוּא עָף.","יֵשׁ עֲטַלֵּפִים שֶׁאוֹכְלִים פֵּרוֹת. בַּלַּיְלָה הֵם עָפִים לְמֶרְחַקִּים וּמְפַזְּרִים אֶת הַזְּרָעִים,","וְכָךְ עוֹזְרִים לְעֵצִים חֲדָשִׁים לִצְמֹחַ. לָכֵן חָשׁוּב לִשְׁמֹר עַל הַמְּעָרוֹת שֶׁבָּהֶן הֵם חַיִּים."]},{"kind":"story","title":"הַפֶּתֶק","lines":["בְּבֹקֶר יוֹם רִאשׁוֹן, טַלְיָה מָצְאָה עַל הַשֻּׁלְחָן שֶׁלָּהּ בַּכִּתָּה פֶּתֶק מְקֻפָּל.","עַל הַפֶּתֶק הָיָה כָּתוּב רַק מִשְׁפָּט אֶחָד: \"אַל תָּבוֹאִי אִתָּנוּ לַטִּירָה. אֲנַחְנוּ לֹא צְרִיכוֹת אוֹתָךְ.\"","טַלְיָה הִסְתַּכְּלָה מִסָּבִיב. בַּפִּנָּה עָמְדוּ הֲדַס וּמַאיָה, הַחֲבֵרוֹת הֲכִי טוֹבוֹת שֶׁלָּהּ, וְלָחֲשׁוּ.","הַבֶּטֶן שֶׁלָּהּ הִתְכַּוְּצָה. כָּל הַיּוֹם הִיא לֹא דִּבְּרָה אִתָּן, וְגַם לֹא עָנְתָה כְּשֶׁהֵן קָרְאוּ לָהּ.","בַּהַפְסָקָה הִיא יָשְׁבָה לְבַד בַּסִּפְרִיָּה, וּבַצָּהֳרַיִם הָלְכָה הַבַּיְתָה בְּלִי לְהִפָּרֵד.","\"מָה קָרָה?\" שָׁאֲלָה אִמָּא כְּשֶׁרָאֲתָה אֶת הַפָּנִים שֶׁלָּהּ. טַלְיָה הוֹצִיאָה אֶת הַפֶּתֶק וּבָכְתָה.","אִמָּא קָרְאָה אוֹתוֹ פַּעֲמַיִם. \"לִפְעָמִים דְּבָרִים הֵם לֹא מָה שֶׁהֵם נִרְאִים,\" אָמְרָה. \"אוּלַי כְּדַאי לִשְׁאֹל אוֹתָן?\"","טַלְיָה לֹא רָצְתָה, אֲבָל בַּסּוֹף הִסְכִּימָה לְהִתְקַשֵּׁר לַהֲדַס.","\"קִבַּלְתִּי אֶת הַפֶּתֶק שֶׁלָּכֶן,\" אָמְרָה בְּקוֹל רוֹעֵד. \"לָמָּה אַתֶּן לֹא רוֹצוֹת אוֹתִי?\"","בַּצַּד הַשֵּׁנִי הָיָה שֶׁקֶט, וְאָז הֲדַס פָּרְצָה בִּצְחוֹק. \"טַלְיָה! זֶה בִּכְלָל לֹא בִּשְׁבִילֵךְ!\"","הִתְבָּרֵר שֶׁזֶּה מִשְׁפָּט מִתּוֹךְ הַצָּגָה קְטַנָּה שֶׁהֵן כָּתְבוּ, עַל מְכַשֵּׁפָה שֶׁלֹּא מַזְמִינִים אוֹתָהּ לַטִּירָה.","הַפֶּתֶק נָפַל מֵהַתִּיק שֶׁל מַאיָה, וּמִישֶׁהוּ מָצָא אוֹתוֹ עַל הָרִצְפָּה וְהִנִּיחַ אוֹתוֹ עַל הַשֻּׁלְחָן שֶׁל טַלְיָה.","\"וְלָמָּה לָחַשְׁנוּ?\" הוֹסִיפָה הֲדַס. \"כִּי אֲנַחְנוּ מְכִינוֹת לָךְ הַפְתָּעָה לְיוֹם הַהֻלֶּדֶת!\"","טַלְיָה צָחֲקָה וּבָכְתָה בְּאוֹתוֹ זְמַן. לְמָחֳרָת הִיא הֵבִיאָה לִשְׁתֵּיהֶן עוּגִיּוֹת שֶׁאָפְתָה בְּעַצְמָהּ."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מִמָּה עֲשׂוּיוֹת הַכְּנָפַיִם שֶׁל הָעֲטַלֵּף?","options":["מִנּוֹצוֹת","מִשַּׂעֲרוֹת אֲרֻכּוֹת","מְקַשְׁקְשִׁים","מֵעוֹר דַּק שֶׁמָּתוּחַ בֵּין אֶצְבָּעוֹת אֲרֻכּוֹת"],"answer":3,"exp":"בְּשׁוּרוֹת 1–2 כָּתוּב שֶׁהַכְּנָפַיִם עֲשׂוּיוֹת עוֹר דַּק שֶׁמָּתוּחַ בֵּין אֶצְבָּעוֹת אֲרֻכּוֹת."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 4 \"אֲבָל אֵיךְ אֶפְשָׁר לִמְצֹא חֶרֶק קָטָן בַּחֹשֶׁךְ?\"","options":["כְּדֵי לְהַגִּיד שֶׁעֲטַלֵּפִים לֹא אוֹכְלִים חֲרָקִים","כְּדֵי לִשְׁאֹל שְׁאֵלָה שֶׁהַשּׁוּרוֹת הַבָּאוֹת עוֹנוֹת עָלֶיהָ","כִּי אֵין תְּשׁוּבָה לַשְּׁאֵלָה הַזֹּאת","כִּי הַכּוֹתֵב לֹא יוֹדֵעַ אֶת הַתְּשׁוּבָה"],"answer":1,"exp":"הַכּוֹתֵב שׁוֹאֵל שְׁאֵלָה, וּבְשׁוּרוֹת 5–7 מַסְבִּיר אֶת הַתְּשׁוּבָה."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"הֵד\" (שׁוּרָה 6)?","options":["אוֹר חָזָק","חֶרֶק קָטָן","כָּנָף שֶׁל עֲטַלֵּף","קוֹל שֶׁחוֹזֵר אַחֲרֵי שֶׁהוּא פּוֹגֵעַ בְּמַשֶּׁהוּ"],"answer":3,"exp":"הֵד הוּא קוֹל שֶׁפּוֹגֵעַ בְּמַשֶּׁהוּ וְחוֹזֵר אֵלֵינוּ, כְּמוֹ כְּשֶׁצּוֹעֲקִים בַּמְּעָרָה."},{"id":"r4","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["כַּמָּה שָׁנִים חַי עֲטַלֵּף?","אֵיךְ הָעֲטַלֵּף נָח?","אֵיךְ הָעֲטַלֵּף מוֹצֵא חֲרָקִים בַּחֹשֶׁךְ?","אֵיךְ עֲטַלֵּפִים עוֹזְרִים לָעֵצִים לִצְמֹחַ?"],"answer":0,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה שָׁנִים חַי עֲטַלֵּף."},{"id":"r5","sec":"read","p":0,"tag":"i","type":"mc","q":"לָמָּה אֲנַחְנוּ לֹא שׁוֹמְעִים אֶת הָעֲטַלֵּפִים כְּשֶׁהֵם צָדִים?","options":["כִּי הֵם צָדִים רַק בְּיוֹם","כִּי הֵם צָדִים רָחוֹק מְאוֹד","כִּי הַצְּלִילִים שֶׁלָּהֶם גְּבוֹהִים מִדַּי בִּשְׁבִיל הָאֹזֶן שֶׁלָּנוּ","כִּי הֵם שׁוֹתְקִים כָּל הַלַּיְלָה"],"answer":2,"exp":"בְּשׁוּרָה 5 כָּתוּב שֶׁהָאֹזֶן שֶׁלָּנוּ בִּכְלָל לֹא שׁוֹמַעַת אֶת הַצְּלִילִים הַגְּבוֹהִים הָאֵלֶּה."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיָה כָּתוּב בַּפֶּתֶק?","options":["\"נִפְגָּשִׁים בַּסִּפְרִיָּה.\"","\"אַל תָּבוֹאִי אִתָּנוּ לַטִּירָה. אֲנַחְנוּ לֹא צְרִיכוֹת אוֹתָךְ.\"","\"יוֹם הֻלֶּדֶת שָׂמֵחַ!\"","\"בּוֹאִי לְשַׂחֵק אִתָּנוּ בַּהַפְסָקָה.\""],"answer":1,"exp":"בְּשׁוּרָה 2 מוֹפִיעַ הַמִּשְׁפָּט שֶׁהָיָה כָּתוּב בַּפֶּתֶק."},{"id":"r7","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה טַלְיָה לֹא דִּבְּרָה עִם הֲדַס וּמַאיָה כָּל הַיּוֹם?","options":["כִּי הִיא הָיְתָה חוֹלָה","כִּי הַמּוֹרָה אָסְרָה לְדַבֵּר","כִּי הִיא חָשְׁבָה שֶׁהֵן לֹא רוֹצוֹת לִהְיוֹת חֲבֵרוֹת שֶׁלָּהּ","כִּי הֵן לֹא הָיוּ בְּבֵית הַסֵּפֶר"],"answer":2,"exp":"טַלְיָה חָשְׁבָה שֶׁהַפֶּתֶק נִכְתַּב בִּשְׁבִילָהּ, וְנֶעֶלְבָה."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"הַבֶּטֶן שֶׁלָּהּ הִתְכַּוְּצָה\" (שׁוּרָה 4)?","options":["הִיא צָחֲקָה הַרְבֵּה","הִיא הִרְגִּישָׁה צַעַר וּפַחַד בְּתוֹךְ הַגּוּף","הִיא אָכְלָה יוֹתֵר מִדַּי","הִיא הָיְתָה רְעֵבָה מְאוֹד"],"answer":1,"exp":"כְּשֶׁעֲצוּבִים אוֹ מְפַחֲדִים, לִפְעָמִים מַרְגִּישִׁים שֶׁהַבֶּטֶן מִתְכַּוֶּצֶת."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אִמָּא אָמְרָה \"לִפְעָמִים דְּבָרִים הֵם לֹא מָה שֶׁהֵם נִרְאִים\"?","options":["כְּדֵי לִרְמֹז שֶׁאוּלַי טַלְיָה לֹא הֵבִינָה נָכוֹן אֶת הַפֶּתֶק","כִּי אִמָּא לֹא רָאֲתָה טוֹב","כְּדֵי שֶׁטַּלְיָה תִּשְׁכַּח מֵהַפֶּתֶק","כְּדֵי לְהַגִּיד שֶׁהַפֶּתֶק מַצְחִיק"],"answer":0,"exp":"אִמָּא הִצִּיעָה לִשְׁאֹל אֶת הַחֲבֵרוֹת, כִּי אוּלַי הַפֶּתֶק לֹא אוֹמֵר מָה שֶׁטַּלְיָה חָשְׁבָה."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לְהָבִין מִכָּךְ שֶׁטַּלְיָה דִּבְּרָה \"בְּקוֹל רוֹעֵד\" (שׁוּרָה 9)?","options":["שֶׁהַטֵּלֵפוֹן הָיָה מְקֻלְקָל","שֶׁהָיָה לָהּ קַר","שֶׁהִיא הָיְתָה נִרְגֶּשֶׁת וַעֲצוּבָה","שֶׁהִיא צָחֲקָה"],"answer":2,"exp":"הַקּוֹל רוֹעֵד כְּשֶׁמִּתְרַגְּשִׁים מְאוֹד אוֹ כְּשֶׁקָּשֶׁה לָנוּ."},{"id":"r11","sec":"read","p":1,"tag":"d","type":"mc","q":"אֵיךְ הִגִּיעַ הַפֶּתֶק לַשֻּׁלְחָן שֶׁל טַלְיָה?","options":["הוּא נָפַל מֵהַתִּיק שֶׁל מַאיָה, וּמִישֶׁהוּ הִנִּיחַ אוֹתוֹ עַל הַשֻּׁלְחָן שֶׁלָּהּ","הֲדַס שָׂמָה אוֹתוֹ שָׁם בְּכַוָּנָה","טַלְיָה כָּתְבָה אוֹתוֹ לְעַצְמָהּ","הַמּוֹרָה כָּתְבָה אוֹתוֹ"],"answer":0,"exp":"בְּשׁוּרָה 12 כָּתוּב שֶׁהַפֶּתֶק נָפַל, וּמִישֶׁהוּ הִנִּיחַ אוֹתוֹ עַל הַשֻּׁלְחָן שֶׁל טַלְיָה."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה הַמֶּסֶר שֶׁל הַסִּפּוּר?","options":["לֹא כְּדַאי לִכְתֹּב פְּתָקִים","אָסוּר לִלְחֹשׁ בַּכִּתָּה","עָדִיף לָשֶׁבֶת לְבַד בַּהַפְסָקָה","כְּדַאי לְבָרֵר וְלִשְׁאֹל לִפְנֵי שֶׁנֶּעֱלָבִים"],"answer":3,"exp":"טַלְיָה נֶעֶלְבָה בִּגְלַל טָעוּת. כְּשֶׁהִיא שָׁאֲלָה – הִתְבָּרֵר שֶׁהַכֹּל בְּסֵדֶר."},{"type":"open","tag":"calc","expr":"59 + 38 = ___","answer":97,"exp":"⁦59 + 38 = 97⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"60 − 41 = ___","answer":19,"exp":"⁦60 − 41 = 19⁩. בְּדִיקָה: ⁦19 + 41 = 60⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"8 × 6 = ___","answer":48,"exp":"⁦8 × 6 = 48⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"27 : 9 = ___","answer":3,"exp":"⁦27 : 9 = 3⁩, כִּי ⁦9 × 3 = 27⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 40 = 69","answer":29,"exp":"⁦69 − 40 = 29⁩, וְלָכֵן ⁦29 + 40 = 69⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"67 − ___ = 21","answer":46,"exp":"⁦67 − 21 = 46⁩, וְלָכֵן ⁦67 − 46 = 21⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"7 × ___ = 18 + 17","answer":5,"exp":"⁦18 + 17 = 35⁩, ו־⁦7 × 5 = 35⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"32 + 18 < 31 + ___","min":20,"max":999,"exp":"בְּצַד יָמִין יֵשׁ 31, אֶחָד פָּחוֹת מ־32. לָכֵן צָרִיךְ מִסְפָּר גָּדוֹל מ־19, לְמָשָׁל 20.","answer":20,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"3 × △ + △ = 8","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 2: 3 × 2 + 2 = 8⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△7 + 2△ = 49","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 2: 27 + 22 = 49⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle"],18],[["circle","heart"],15],[["heart","star"],13]],"ask":["star"]},"options":["6","7","8","9"],"answer":1,"exp":"שְׁנֵי עִגּוּלִים = 18, אָז עִגּוּל = 9. לֵב = ⁦15 − 9 = 6⁩. כּוֹכָב = ⁦13 − 6 = 7⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"יוֹאָב בֶּן 9. אֲחוֹתוֹ הַגְּדוֹלָה מְבֻגֶּרֶת מִמֶּנּוּ ב־2 שָׁנִים. בַּת כַּמָּה תִּהְיֶה הָאָחוֹת בְּעוֹד 8 שָׁנִים?","options":["3","11","17","19"],"answer":3,"exp":"עַכְשָׁו הָאָחוֹת בַּת ⁦9 + 2 = 11⁩. בְּעוֹד 8 שָׁנִים: ⁦11 + 8 = 19⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"34 יְלָדִים יוֹצְאִים לְטִיּוּל. בְּכָל מְכוֹנִית יֵשׁ מָקוֹם ל־5 יְלָדִים. כַּמָּה מְכוֹנִיּוֹת צָרִיךְ כְּדֵי שֶׁכָּל הַיְּלָדִים יִסְּעוּ?","options":["6","7","8","9"],"answer":1,"exp":"ב־6 מְכוֹנִיּוֹת יֵשׁ מָקוֹם ל־30 יְלָדִים, וְנִשְׁאָרִים עוֹד 4. לָכֵן צָרִיךְ עוֹד מְכוֹנִית: 7.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"כַּרְטִיס לְיֶלֶד לְהַצָּגָה עוֹלֶה 8 ₪, וְכַרְטִיס לִמְבֻגָּר עוֹלֶה 10 ₪. כַּמָּה יַעֲלוּ כַּרְטִיסִים ל־2 יְלָדִים וְלִמְבֻגָּר אֶחָד?","options":["18","24","26","30"],"answer":2,"exp":"יְלָדִים: ⁦2 × 8 = 16⁩. מְבֻגָּרִים: ⁦1 × 10 = 10⁩. בְּיַחַד: 26 ₪.","id":"m14","sec":"math"}]},{"n":16,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"מֵאֵיפֹה בָּא הַשּׁוֹקוֹלָד?","lines":["הַשּׁוֹקוֹלָד שֶׁאֲנַחְנוּ אוֹהֲבִים מַתְחִיל אֶת דַּרְכּוֹ בְּעֵץ שֶׁגָּדַל בִּמְקוֹמוֹת חַמִּים וּגְשׁוּמִים: עֵץ הַקָּקָאוֹ.","עַל הַגֶּזַע שֶׁל הָעֵץ גְּדֵלִים פֵּרוֹת גְּדוֹלִים, וּבְתוֹךְ כָּל פְּרִי יֵשׁ עֶשְׂרוֹת זְרָעִים שֶׁנִּקְרָאִים \"פּוֹלֵי קָקָאוֹ\".","לַפּוֹלִים הַטְּרִיִּים יֵשׁ טַעַם מַר מְאוֹד – בִּכְלָל לֹא כְּמוֹ שֶׁל שׁוֹקוֹלָד.","הַחַקְלָאִים מַשְׁאִירִים אוֹתָם כַּמָּה יָמִים מְכֻסִּים בְּעָלִים, וְאַחַר כָּךְ מְיַבְּשִׁים אוֹתָם בַּשֶּׁמֶשׁ.","בַּמִּפְעָל קוֹלִים אֶת הַפּוֹלִים, כְּלוֹמַר מְחַמְּמִים אוֹתָם בַּתַּנּוּר, וְטוֹחֲנִים אוֹתָם לְעִסָּה סְמִיכָה.","רַק אַחֲרֵי שֶׁמּוֹסִיפִים לָעִסָּה סֻכָּר, וְלִפְעָמִים גַּם חָלָב, מְקַבְּלִים אֶת הַשּׁוֹקוֹלָד הַמָּתוֹק.","לִפְנֵי מֵאוֹת שָׁנִים, אֲנָשִׁים שֶׁחָיוּ בְּאָמֵרִיקָה הֵכִינוּ מִפּוֹלֵי הַקָּקָאוֹ מַשְׁקֶה מַר וְחָרִיף.","הַפּוֹלִים הָיוּ חֲשׁוּבִים לָהֶם כָּל כָּךְ, שֶׁהֵם אֲפִלּוּ הִשְׁתַּמְּשׁוּ בָּהֶם כְּמוֹ בְּכֶסֶף, כְּדֵי לִקְנוֹת דְּבָרִים.","הַיּוֹם מְגַדְּלִים קָקָאוֹ בִּמְדִינוֹת רַבּוֹת, וְרֹב הַקָּקָאוֹ בָּעוֹלָם מַגִּיעַ מֵאַפְרִיקָה."]},{"kind":"story","title":"עֵץ הַלִּימוֹן שֶׁל סַבָּא","lines":["בט\"ו בִּשְׁבָט סַבָּא נַחוּם הֵבִיא לְגַלִּי שְׁתִיל קָטָן שֶׁל עֵץ לִימוֹן, וְהֵם שָׁתְלוּ אוֹתוֹ יַחַד בֶּחָצֵר.","\"מָתַי יִהְיוּ לוֹ לִימוֹנִים?\" שָׁאֲלָה גַּלִּי, כְּשֶׁהִשְׁקוּ אוֹתוֹ בַּפַּעַם הָרִאשׁוֹנָה.","\"בְּעוֹד כַּמָּה שָׁנִים,\" עָנָה סַבָּא. \"עֵץ צָרִיךְ זְמַן, כְּמוֹ יַלְדָּה שֶׁגָּדְלָה.\"","גַּלִּי הִתְאַכְזְבָה. כַּמָּה שָׁנִים זֶה הֲמוֹן זְמַן. הִיא רָצְתָה לִימוֹנִים עַכְשָׁו.","בְּכָל זֹאת, בְּכָל שָׁבוּעַ הִיא הִשְׁקְתָה אֶת הִשְׁתִּיל, וְסַבָּא הֶרְאָה לָהּ אֵיךְ לְנַקּוֹת סְבִיבוֹ עֲשָׂבִים.","בַּקַּיִץ הָרִאשׁוֹן הִשְׁתִּיל כִּמְעַט הִתְיַבֵּשׁ. הֶעָלִים שֶׁלּוֹ הִצְהִיבוּ וְנָפְלוּ אֶחָד אַחֲרֵי הַשֵּׁנִי.","\"הוּא מֵת,\" אָמְרָה גַּלִּי בְּעֶצֶב. \"בּוֹא נַעֲקֹר אוֹתוֹ וְנִשְׁתֹּל מַשֶּׁהוּ אַחֵר.\"","סַבָּא כָּרַע עַל הַבִּרְכַּיִם וְגֵרֵד בְּצִפֹּרֶן אֶת הַקְּלִפָּה שֶׁל הַגִּבְעוֹל. מִתַּחְתֶּיהָ הוֹפִיעַ צֶבַע יָרֹק.","\"רוֹאֶה? הוּא עֲדַיִן חַי,\" אָמַר. \"הוּא רַק צָמֵא. צָרִיךְ לְהַשְׁקוֹת אוֹתוֹ יוֹתֵר בַּיָּמִים הַחַמִּים.\"","עָבְרוּ שָׁלוֹשׁ שָׁנִים. הִשְׁתִּיל הָפַךְ לְעֵץ קָטָן, גָּבוֹהַּ כְּמוֹ גַּלִּי עַצְמָהּ.","בָּאָבִיב הוֹפִיעוּ עָלָיו פְּרָחִים לְבָנִים וְרֵיחָנִיִּים, וְאַחֲרֵיהֶם – כַּדּוּרִים יְרֻקִּים קְטַנִּים.","לְאַט לְאַט הַכַּדּוּרִים גָּדְלוּ וְהִצְהִיבוּ. גַּלִּי סָפְרָה אוֹתָם כָּל בֹּקֶר: שִׁבְעָה לִימוֹנִים.","אֶת הַלִּימוֹן הָרִאשׁוֹן הִיא קָטְפָה בִּזְהִירוּת וְהֵבִיאָה לְסַבָּא.","הֵם סָחֲטוּ אוֹתוֹ לְכוֹס מַיִם עִם סֻכָּר, וְשָׁתוּ יַחַד לִימוֹנָדָה. \"זוֹ הַלִּימוֹנָדָה הֲכִי טְעִימָה בָּעוֹלָם,\" אָמַר סַבָּא.","\"כִּי חִכִּינוּ לָהּ שָׁלוֹשׁ שָׁנִים,\" צָחֲקָה גַּלִּי."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"אֵיךְ נִקְרָאִים הַזְּרָעִים שֶׁבְּתוֹךְ פְּרִי הַקָּקָאוֹ?","options":["פּוֹלֵי קָקָאוֹ","פִּרְחֵי קָקָאוֹ","גִּזְעֵי קָקָאוֹ","עֲלֵי קָקָאוֹ"],"answer":0,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַזְּרָעִים נִקְרָאִים \"פּוֹלֵי קָקָאוֹ\"."},{"id":"r2","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"קוֹלִים\" (שׁוּרָה 5)?","options":["מְקָרְרִים","מְחַמְּמִים בַּתַּנּוּר","שׁוֹתְלִים","שׁוֹטְפִים בְּמַיִם"],"answer":1,"exp":"בְּשׁוּרָה 5 מֻסְבָּר: קוֹלִים אֶת הַפּוֹלִים, \"כְּלוֹמַר מְחַמְּמִים אוֹתָם בַּתַּנּוּר\"."},{"id":"r3","sec":"read","p":0,"tag":"s","type":"mc","q":"מָה עוֹשִׂים לְעִסָּה אַחֲרֵי שֶׁטּוֹחֲנִים אֶת הַפּוֹלִים?","options":["מְיַבְּשִׁים אוֹתָהּ בַּשֶּׁמֶשׁ","מְכַסִּים אוֹתָהּ בְּעָלִים","קוֹטְפִים אוֹתָהּ מֵהָעֵץ","מוֹסִיפִים לָהּ סֻכָּר, וְלִפְעָמִים גַּם חָלָב"],"answer":3,"exp":"בְּשׁוּרָה 6: אַחֲרֵי שֶׁמּוֹסִיפִים סֻכָּר וְחָלָב לָעִסָּה – מְקַבְּלִים שׁוֹקוֹלָד."},{"id":"r4","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 8 שֶׁהִשְׁתַּמְּשׁוּ בַּפּוֹלִים \"כְּמוֹ בְּכֶסֶף\"?","options":["כִּי הַיּוֹם קוֹנִים שׁוֹקוֹלָד בְּכֶסֶף","כִּי הַפּוֹלִים עֲגֻלִּים כְּמוֹ מַטְבְּעוֹת","כִּי הַפּוֹלִים מְתוּקִים","כְּדֵי לְהַרְאוֹת כַּמָּה הַפּוֹלִים הָיוּ חֲשׁוּבִים וִיקָרִים לַאֲנָשִׁים"],"answer":3,"exp":"הַפּוֹלִים הָיוּ כָּל כָּךְ חֲשׁוּבִים, שֶׁאֶפְשָׁר הָיָה לִקְנוֹת בָּהֶם דְּבָרִים."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מֵאֵיפֹה מַגִּיעַ רֹב הַקָּקָאוֹ בָּעוֹלָם?","בְּאֵיזֶה מָקוֹם גָּדֵל עֵץ הַקָּקָאוֹ?","כַּמָּה עוֹלֶה חֲפִיסַת שׁוֹקוֹלָד?","מָה הַטַּעַם שֶׁל פּוֹלֵי קָקָאוֹ טְרִיִּים?"],"answer":2,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה עוֹלֶה שׁוֹקוֹלָד."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה שֶׁתָּלוּ גַּלִּי וְסַבָּא?","options":["פְּרָחִים לְבָנִים","עֲשָׂבִים","שְׁתִיל שֶׁל עֵץ לִימוֹן","שְׁתִיל שֶׁל עֵץ תַּפּוּזִים"],"answer":2,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁסַּבָּא הֵבִיא שְׁתִיל קָטָן שֶׁל עֵץ לִימוֹן."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה סַבָּא אָמַר \"עֵץ צָרִיךְ זְמַן, כְּמוֹ יַלְדָּה שֶׁגָּדְלָה\"?","options":["כְּדֵי לְסַפֵּר כַּמָּה גַּלִּי גְּבוֹהָה","כְּדֵי לְהַסְבִּיר שֶׁגַּם עֵץ גָּדֵל לְאַט","כְּדֵי לְהַגִּיד שֶׁגַּלִּי קְטַנָּה מִדַּי","כִּי גַּלִּי בִּקְּשָׁה עֵץ"],"answer":1,"exp":"סַבָּא הִשְׁוָה אֶת הָעֵץ לְיַלְדָּה: שְׁנֵיהֶם גְּדֵלִים לְאַט, לְאַט."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה הִרְגִּישָׁה גַּלִּי כְּשֶׁשָּׁמְעָה שֶׁהַלִּימוֹנִים יַגִּיעוּ רַק בְּעוֹד כַּמָּה שָׁנִים?","options":["פַּחַד","הַפְתָּעָה טוֹבָה","אַכְזָבָה","שִׂמְחָה גְּדוֹלָה"],"answer":2,"exp":"בְּשׁוּרָה 4 כָּתוּב: \"גַּלִּי הִתְאַכְזְבָה\"."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נַעֲקֹר\" (שׁוּרָה 7)?","options":["נִצְבַּע","נִגְזֹם עָנָף","נַשְׁקֶה","נוֹצִיא מֵהָאֲדָמָה, יַחַד עִם הַשָּׁרָשִׁים"],"answer":3,"exp":"לַעֲקֹר צֶמַח זֶה לְהוֹצִיא אוֹתוֹ מֵהָאֲדָמָה, כְּדֵי לִשְׁתֹּל בִּמְקוֹמוֹ מַשֶּׁהוּ אַחֵר."},{"id":"r10","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה סַבָּא גֵּרֵד אֶת הַקְּלִפָּה שֶׁל הַגִּבְעוֹל?","options":["כְּדֵי לַחְתֹּךְ אוֹתוֹ","כְּדֵי לִבְדֹּק אִם הִשְׁתִּיל עוֹד חַי","כְּדֵי לִרְאוֹת אִם יֵשׁ לִימוֹנִים","כְּדֵי לְנַקּוֹת אוֹתוֹ מַאֲבָק"],"answer":1,"exp":"מִתַּחַת לַקְּלִפָּה הוֹפִיעַ צֶבַע יָרֹק – סִימָן שֶׁהִשְׁתִּיל עֲדַיִן חַי."},{"id":"r11","sec":"read","p":1,"tag":"s","type":"mc","q":"מָה הוֹפִיעַ עַל הָעֵץ לִפְנֵי הַכַּדּוּרִים הַיְּרֻקִּים?","options":["פְּרָחִים לְבָנִים","לִימוֹנִים צְהֻבִּים","עָלִים צְהֻבִּים","קְלִפָּה יְרֻקָּה"],"answer":0,"exp":"בְּשׁוּרָה 11: קֹדֶם הוֹפִיעוּ פְּרָחִים לְבָנִים, וְאַחֲרֵיהֶם הַכַּדּוּרִים הַיְּרֻקִּים."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֶּנֶת גַּלִּי כְּשֶׁהִיא אוֹמֶרֶת \"כִּי חִכִּינוּ לָהּ שָׁלוֹשׁ שָׁנִים\" (שׁוּרָה 15)?","options":["שֶׁהַלִּימוֹנָדָה טְעִימָה בִּמְיֻחָד, כִּי טָרְחוּ וְחִכּוּ לָהּ הַרְבֵּה זְמַן","שֶׁהַלִּימוֹנָדָה יְשָׁנָה מְאוֹד","שֶׁהַלִּימוֹנִים הָיוּ גְּדוֹלִים בִּמְיֻחָד","שֶׁשָּׁלוֹשׁ שָׁנִים הֵם לֹא שָׁתוּ לִימוֹנָדָה"],"answer":0,"exp":"גַּלִּי מִתְכַּוֶּנֶת שֶׁכְּשֶׁעוֹבְדִים וּמְחַכִּים הַרְבֵּה, הַתּוֹצָאָה מַרְגִּישָׁה טְעִימָה עוֹד יוֹתֵר."},{"type":"open","tag":"calc","expr":"48 + 35 = ___","answer":83,"exp":"⁦48 + 35 = 83⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"52 − 25 = ___","answer":27,"exp":"⁦52 − 25 = 27⁩. בְּדִיקָה: ⁦27 + 25 = 52⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"6 × 6 = ___","answer":36,"exp":"⁦6 × 6 = 36⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"48 : 6 = ___","answer":8,"exp":"⁦48 : 6 = 8⁩, כִּי ⁦6 × 8 = 48⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 47 = 72","answer":25,"exp":"⁦72 − 47 = 25⁩, וְלָכֵן ⁦25 + 47 = 72⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"76 − ___ = 27","answer":49,"exp":"⁦76 − 27 = 49⁩, וְלָכֵן ⁦76 − 49 = 27⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"8 × ___ = 37 + 19","answer":7,"exp":"⁦37 + 19 = 56⁩, ו־⁦8 × 7 = 56⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"40 − 15 < 40 − ___","min":0,"max":14,"exp":"כְּשֶׁמּוֹרִידִים פָּחוֹת, נִשְׁאַר יוֹתֵר. צָרִיךְ לְהוֹרִיד פָּחוֹת מ־15, לְמָשָׁל 14.","answer":14,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△4 + 1△ = 58","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 4: 44 + 14 = 58⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△△ − △ = 50","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 5: 55 − 5 = 50⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square"],16],[["square","heart"],11],[["heart","circle"],8]],"ask":["circle"]},"options":["4","5","6","7"],"answer":1,"exp":"שְׁנֵי רִבּוּעִים = 16, אָז רִבּוּעַ = 8. לֵב = ⁦11 − 8 = 3⁩. עִגּוּל = ⁦8 − 3 = 5⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"בַּתּוֹר לִגְלִידָה הֲדַר עוֹמֶדֶת בַּמָּקוֹם ה־5 מֵהַהַתְחָלָה. מֵאֲחוֹרֶיהָ עוֹמְדִים עוֹד 5 יְלָדִים. כַּמָּה יְלָדִים יֵשׁ בַּתּוֹר?","options":["5","9","10","11"],"answer":2,"exp":"5 יְלָדִים עַד הֲדַר (כּוֹלֵל אוֹתָהּ), וְעוֹד 5 מֵאָחוֹר: ⁦5 + 5 = 10⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"כַּרְטִיס לְיֶלֶד לְהַצָּגָה עוֹלֶה 5 ₪, וְכַרְטִיס לִמְבֻגָּר עוֹלֶה 7 ₪. כַּמָּה יַעֲלוּ כַּרְטִיסִים ל־2 יְלָדִים וְלִ2 מְבֻגָּרִים?","options":["17","20","24","28"],"answer":2,"exp":"יְלָדִים: ⁦2 × 5 = 10⁩. מְבֻגָּרִים: ⁦2 × 7 = 14⁩. בְּיַחַד: 24 ₪.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"19 יְלָדִים יוֹצְאִים לְטִיּוּל. בְּכָל מְכוֹנִית יֵשׁ מָקוֹם ל־3 יְלָדִים. כַּמָּה מְכוֹנִיּוֹת צָרִיךְ כְּדֵי שֶׁכָּל הַיְּלָדִים יִסְּעוּ?","options":["6","7","8","9"],"answer":1,"exp":"ב־6 מְכוֹנִיּוֹת יֵשׁ מָקוֹם ל־18 יְלָדִים, וְנִשְׁאָרִים עוֹד 1. לָכֵן צָרִיךְ עוֹד מְכוֹנִית: 7.","id":"m14","sec":"math"}]},{"n":17,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"הַמִּגְדַּלּוֹר","lines":["לִפְנֵי שֶׁהָיוּ מַכְשִׁירֵי נִוּוּט, הַיָּם בַּלַּיְלָה הָיָה מָקוֹם מְסֻכָּן מְאוֹד בִּשְׁבִיל סְפִינוֹת.","בַּחֹשֶׁךְ קָשֶׁה לִרְאוֹת סְלָעִים שֶׁמִּסְתַּתְּרִים מִתַּחַת לַמַּיִם, וְקָשֶׁה לָדַעַת אֵיפֹה נִמְצָא הַחוֹף.","כְּדֵי לַעֲזֹר לַסְּפִינוֹת, בָּנוּ עַל הַחוֹף מִגְדָּלִים גְּבוֹהִים, וּבְרֹאשָׁם אֵשׁ גְּדוֹלָה: מִגְדַּלּוֹרִים.","הַיּוֹם, בִּמְקוֹם אֵשׁ, יֵשׁ בְּרֹאשׁ הַמִּגְדַּלּוֹר מְנוֹרָה חֲזָקָה שֶׁמִּסְתּוֹבֶבֶת.","לְכָל מִגְדַּלּוֹר יֵשׁ סִימָן מִשֶּׁלּוֹ: יֵשׁ שֶׁמְּהַבְהֲבִים פַּעַם אַחַת, וְיֵשׁ שֶׁמְּהַבְהֲבִים פַּעֲמַיִם אוֹ שָׁלוֹשׁ.","כָּךְ רַב הַחוֹבֵל יָכוֹל לָדַעַת לְיַד אֵיזֶה מִגְדַּלּוֹר הוּא עוֹבֵר, וּמִזֶּה – אֵיפֹה הַסְּפִינָה שֶׁלּוֹ נִמְצֵאת.","בֶּעָבָר גָּר בְּכָל מִגְדַּלּוֹר שׁוֹמֵר. הוּא דָּאַג שֶׁהָאוֹר יִדָּלֵק בְּכָל עֶרֶב, וְלֹא יְכַבֶּה עַד הַבֹּקֶר.","כַּיּוֹם רֹב הַמִּגְדַּלּוֹרִים פּוֹעֲלִים לְבַד, בְּעֶזְרַת מַחְשֵׁב, וְשׁוֹמְרִים כְּבָר לֹא גָּרִים בָּהֶם.","גַּם בִּנְמַל יָפוֹ עוֹמֵד מִגְדַּלּוֹר יָשָׁן, שֶׁמַּזְכִּיר אֶת הַיָּמִים שֶׁבָּהֶם שָׁמְרוּ הַמִּגְדַּלּוֹרִים עַל הַסְּפִינוֹת."]},{"kind":"story","title":"בּוֹנִי","lines":["מִיכָאֵל פָּחַד מִכְּלָבִים. כְּשֶׁרָאָה כֶּלֶב בָּרְחוֹב, הוּא הָיָה עוֹבֵר לַצַּד הַשֵּׁנִי שֶׁל הַכְּבִישׁ.","בַּקַּיִץ עָבְרָה לָגוּר בַּבִּנְיָן שֶׁלָּהֶם מִשְׁפָּחָה חֲדָשָׁה, וְאִתָּהּ כֶּלֶב גָּדוֹל וְשָׂעִיר בְּשֵׁם בּוֹנִי.","בְּכָל פַּעַם שֶׁמִּיכָאֵל יָצָא מֵהַדִּירָה, בּוֹנִי עָמַד בֶּחָצֵר וְהִתְחִיל לִנְבֹּחַ.","\"הוּא שׂוֹנֵא אוֹתִי,\" אָמַר מִיכָאֵל לְאַבָּא. \"אֲנִי לֹא יוֹצֵא יוֹתֵר לֶחָצֵר.\"","אַבָּא חָשַׁב קְצָת. \"אוּלַי הוּא בִּכְלָל לֹא שׂוֹנֵא אוֹתְךָ. אוּלַי הוּא פָּשׁוּט לֹא מַכִּיר אוֹתְךָ?\"","לְמָחֳרָת הֵם יָרְדוּ יַחַד אֶל הַשְּׁכֵנָה, רוּתִי, שֶׁבּוֹנִי הָיָה הַכֶּלֶב שֶׁלָּהּ.","\"בּוֹנִי נוֹבֵחַ עַל כָּל מִי שֶׁהוּא לֹא מַכִּיר,\" הִסְבִּירָה רוּתִי. \"כָּכָה הוּא שׁוֹמֵר עָלֵינוּ.\"","\"אַתָּה רוֹצֶה לִלְמֹד אֵיךְ לְהִתְיַדֵּד אִתּוֹ?\" שָׁאֲלָה. מִיכָאֵל הִנְהֵן, אֲבָל לֹא הִתְקָרֵב.","רוּתִי נָתְנָה לוֹ עוּגִיָּה לַכְּלָבִים. \"תּוֹשִׁיט אוֹתָהּ בְּיָד פְּתוּחָה, וְתַעֲמֹד בְּשֶׁקֶט.\"","הַלֵּב שֶׁל מִיכָאֵל דָּפַק בְּחָזְקָה. הוּא הוֹשִׁיט אֶת הַיָּד, וְעָצַם אֶת הָעֵינַיִם.","הוּא הִרְגִּישׁ מַשֶּׁהוּ רָטֹב וּמְדַגְדֵּג עַל כַּף הַיָּד. כְּשֶׁפָּקַח אֶת הָעֵינַיִם, הָעוּגִיָּה כְּבָר נֶעֶלְמָה,","וּבוֹנִי יָשַׁב מוּלוֹ וְכִשְׁכֵּשׁ בַּזָּנָב.","מֵאוֹתוֹ יוֹם, בְּכָל בֹּקֶר, מִיכָאֵל עָצַר לְיַד הַגָּדֵר וְאָמַר לְבוֹנִי \"בֹּקֶר טוֹב\".","וּבוֹנִי? הוּא כְּבָר לֹא נָבַח עָלָיו. הוּא רַק הִצְמִיד אֶת הָאַף לַגָּדֵר, וְחִכָּה לִלְטִיפָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַיָּם בַּלַּיְלָה הָיָה מְסֻכָּן לִסְפִינוֹת?","options":["כִּי בַּלַּיְלָה תָּמִיד יֵשׁ סְעָרוֹת","כִּי בַּחֹשֶׁךְ קָשֶׁה לִרְאוֹת סְלָעִים וְלָדַעַת אֵיפֹה הַחוֹף","כִּי בַּלַּיְלָה הַמַּלָּחִים יְשֵׁנִים","כִּי בַּלַּיְלָה יֵשׁ יוֹתֵר גַּלִּים"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁבַּחֹשֶׁךְ קָשֶׁה לִרְאוֹת סְלָעִים, וְקָשֶׁה לָדַעַת אֵיפֹה הַחוֹף."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה יֵשׁ הַיּוֹם בְּרֹאשׁ הַמִּגְדַּלּוֹר, בִּמְקוֹם אֵשׁ?","options":["פַּעֲמוֹן","מַחְשֵׁב","שׁוֹמֵר","מְנוֹרָה חֲזָקָה שֶׁמִּסְתּוֹבֶבֶת"],"answer":3,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁהַיּוֹם יֵשׁ בְּרֹאשׁ הַמִּגְדַּלּוֹר מְנוֹרָה חֲזָקָה שֶׁמִּסְתּוֹבֶבֶת."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה לְכָל מִגְדַּלּוֹר יֵשׁ סִימָן מִשֶּׁלּוֹ?","options":["כְּדֵי שֶׁרַב הַחוֹבֵל יֶדַע לְיַד אֵיזֶה מִגְדַּלּוֹר הוּא עוֹבֵר","כְּדֵי לַחֲסֹךְ חַשְׁמַל","כְּדֵי שֶׁיִּהְיֶה יָפֶה","כְּדֵי לְהָעִיר אֶת הַשּׁוֹמֵר"],"answer":0,"exp":"בְּשׁוּרָה 6: לְפִי הַסִּימָן רַב הַחוֹבֵל יוֹדֵעַ לְיַד אֵיזֶה מִגְדַּלּוֹר הוּא עוֹבֵר, וְאֵיפֹה הַסְּפִינָה."},{"id":"r4","sec":"read","p":0,"tag":"w","type":"mc","q":"מִי הוּא \"רַב הַחוֹבֵל\" (שׁוּרָה 6)?","options":["מִי שֶׁדָּג דָּגִים","מִי שֶׁבּוֹנֶה סְפִינוֹת","מִי שֶׁמְּנַהֵל אֶת הַסְּפִינָה וְאַחְרַאי עָלֶיהָ","מִי שֶׁשּׁוֹמֵר עַל הַמִּגְדַּלּוֹר"],"answer":2,"exp":"רַב הַחוֹבֵל הוּא הַמְּפַקֵּד שֶׁל הַסְּפִינָה. הוּא צָרִיךְ לָדַעַת אֵיפֹה הַסְּפִינָה נִמְצֵאת."},{"id":"r5","sec":"read","p":0,"tag":"c","type":"mc","q":"מָה הַהֶבְדֵּל בֵּין הַמִּגְדַּלּוֹרִים שֶׁל פַּעַם לְבֵין הַמִּגְדַּלּוֹרִים שֶׁל הַיּוֹם?","options":["פַּעַם גָּר בָּהֶם שׁוֹמֵר, וְהַיּוֹם הֵם פּוֹעֲלִים בְּעֶזְרַת מַחְשֵׁב","פַּעַם הֵם הָיוּ בְּתוֹךְ הַיָּם, וְהַיּוֹם הֵם עַל הַחוֹף","אֵין שׁוּם הֶבְדֵּל","פַּעַם הֵם הָיוּ נְמוּכִים, וְהַיּוֹם הֵם גְּבוֹהִים"],"answer":0,"exp":"בְּשׁוּרוֹת 7–8: פַּעַם גָּר בְּכָל מִגְדַּלּוֹר שׁוֹמֵר, וְהַיּוֹם רֻבָּם פּוֹעֲלִים לְבַד בְּעֶזְרַת מַחְשֵׁב."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשָׂה מִיכָאֵל כְּשֶׁרָאָה כֶּלֶב בָּרְחוֹב?","options":["עָבַר לַצַּד הַשֵּׁנִי שֶׁל הַכְּבִישׁ","נָתַן לוֹ עוּגִיָּה","צָעַק עָלָיו","לִטֵּף אוֹתוֹ"],"answer":0,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁמִּיכָאֵל הָיָה עוֹבֵר לַצַּד הַשֵּׁנִי שֶׁל הַכְּבִישׁ."},{"id":"r7","sec":"read","p":1,"tag":"c","type":"mc","q":"מָה מִיכָאֵל חָשַׁב עַל הַנְּבִיחוֹת שֶׁל בּוֹנִי, וּמֶה הָיְתָה הַסִּבָּה הָאֲמִתִּית?","options":["מִיכָאֵל חָשַׁב שֶׁבּוֹנִי מְשַׂחֵק, אֲבָל בּוֹנִי כָּעַס","מִיכָאֵל חָשַׁב שֶׁבּוֹנִי חוֹלֶה, אֲבָל בּוֹנִי הָיָה בָּרִיא","מִיכָאֵל חָשַׁב שֶׁבּוֹנִי רָעֵב, אֲבָל בּוֹנִי הָיָה עָיֵף","מִיכָאֵל חָשַׁב שֶׁבּוֹנִי שׂוֹנֵא אוֹתוֹ, אֲבָל בּוֹנִי נָבַח כִּי לֹא הִכִּיר אוֹתוֹ"],"answer":3,"exp":"מִיכָאֵל אָמַר \"הוּא שׂוֹנֵא אוֹתִי\" (שׁוּרָה 4), וְרוּתִי הִסְבִּירָה שֶׁבּוֹנִי נוֹבֵחַ עַל מִי שֶׁהוּא לֹא מַכִּיר (שׁוּרָה 7)."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"הִנְהֵן\" (שׁוּרָה 8)?","options":["הֵזִיז אֶת הָרֹאשׁ לַצְּדָדִים, כְּמוֹ שֶׁאוֹמְרִים \"לֹא\"","הֵזִיז אֶת הָרֹאשׁ לְמַעְלָה וּלְמַטָּה, כְּמוֹ שֶׁאוֹמְרִים \"כֵּן\"","צָחַק בְּקוֹל","בְּרַח מַהֵר"],"answer":1,"exp":"מִיכָאֵל הִנְהֵן – סִמֵּן \"כֵּן\" עִם הָרֹאשׁ – כִּי רָצָה לִלְמֹד לְהִתְיַדֵּד עִם בּוֹנִי."},{"id":"r9","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה מִיכָאֵל עָצַם אֶת הָעֵינַיִם (שׁוּרָה 10)?","options":["כִּי הוּא הָיָה עָיֵף","כִּי רוּתִי בִּקְּשָׁה מִמֶּנּוּ","כִּי הוּא עֲדַיִן פָּחַד קְצָת","כִּי הַשֶּׁמֶשׁ סִנְוְרָה אוֹתוֹ"],"answer":2,"exp":"הַלֵּב שֶׁלּוֹ דָּפַק בְּחָזְקָה – הוּא עוֹד פָּחַד, וְלָכֵן עָצַם אֶת הָעֵינַיִם."},{"id":"r10","sec":"read","p":1,"tag":"r","type":"mc","q":"מֶה הָיָה \"מַשֶּׁהוּ רָטֹב וּמְדַגְדֵּג\" עַל כַּף הַיָּד שֶׁל מִיכָאֵל (שׁוּרָה 11)?","options":["הַיָּד שֶׁל רוּתִי","הָעוּגִיָּה","טִפַּת גֶּשֶׁם","הַלָּשׁוֹן שֶׁל בּוֹנִי"],"answer":3,"exp":"בּוֹנִי לָקַח אֶת הָעוּגִיָּה עִם הַלָּשׁוֹן, וְלָכֵן הִיא נֶעֶלְמָה."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה מַרְאֶה שֶׁבּוֹנִי \"כִּשְׁכֵּשׁ בַּזָּנָב\" (שׁוּרָה 12)?","options":["שֶׁבּוֹנִי הָיָה עָיֵף","שֶׁבּוֹנִי הָיָה שָׂמֵחַ וִידִידוּתִי","שֶׁבּוֹנִי כָּעַס","שֶׁבּוֹנִי רָצָה לִבְרֹחַ"],"answer":1,"exp":"כֶּלֶב מְכַשְׁכֵּשׁ בַּזָּנָב כְּשֶׁהוּא שָׂמֵחַ וּמַרְגִּישׁ יְדִידוּתִי."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"אֵיזוֹ כּוֹתֶרֶת מַתְאִימָה לַסִּפּוּר?","options":["הַשְּׁכֵנָה הַחֲדָשָׁה שֶׁל אַבָּא","מִיכָאֵל עוֹבֵר דִּירָה","אֵיךְ מִיכָאֵל הִתְיַדֵּד עִם בּוֹנִי","הַכֶּלֶב שֶׁגָּנַב עוּגִיּוֹת"],"answer":2,"exp":"הַסִּפּוּר מְסַפֵּר אֵיךְ מִיכָאֵל, שֶׁפָּחַד מִכְּלָבִים, הָפַךְ לְחָבֵר שֶׁל בּוֹנִי."},{"type":"open","tag":"calc","expr":"52 + 39 = ___","answer":91,"exp":"⁦52 + 39 = 91⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"43 − 19 = ___","answer":24,"exp":"⁦43 − 19 = 24⁩. בְּדִיקָה: ⁦24 + 19 = 43⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"3 × 8 = ___","answer":24,"exp":"⁦3 × 8 = 24⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"40 : 8 = ___","answer":5,"exp":"⁦40 : 8 = 5⁩, כִּי ⁦8 × 5 = 40⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 46 = 86","answer":40,"exp":"⁦86 − 46 = 40⁩, וְלָכֵן ⁦40 + 46 = 86⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"63 − ___ = 49","answer":14,"exp":"⁦63 − 49 = 14⁩, וְלָכֵן ⁦63 − 14 = 49⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"6 × ___ = 29 + 19","answer":8,"exp":"⁦29 + 19 = 48⁩, ו־⁦6 × 8 = 48⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"28 + 10 > 10 + ___","min":0,"max":27,"exp":"⁦28 + 10⁩ זֶה כְּמוֹ ⁦10 + 28⁩. צָרִיךְ מִסְפָּר קָטָן מ־28, לְמָשָׁל 27.","answer":27,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△△ − △ = 20","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 2: 22 − 2 = 20⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△1 − 1△ = 72","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":3,"exp":"נְצִיב ⁦△ = 9: 91 − 19 = 72⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["star","star"],12],[["star","square"],10],[["square","heart"],7]],"ask":["heart"]},"options":["2","3","4","5"],"answer":1,"exp":"שְׁנֵי כּוֹכָבִים = 12, אָז כּוֹכָב = 6. רִבּוּעַ = ⁦10 − 6 = 4⁩. לֵב = ⁦7 − 4 = 3⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"שִׁירָה קוֹרֵאת סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרְאָה 8 עַמּוּדִים. בְּכָל יוֹם הִיא קָרְאָה 3 עַמ
