ּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרְאָה בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["14","24","27","33"],"answer":3,"exp":"יוֹם ⁦1: 8⁩, יוֹם ⁦2: 11⁩, יוֹם ⁦3: 14⁩. בְּיַחַד: 33.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בַּסַּל הָיוּ 20 תַּפּוּחִים. גַּיְא הוֹצִיא מֵהַסַּל חֲצִי מֵהַתַּפּוּחִים, וְאַחַר כָּךְ הוֹסִיף לַסַּל עוֹד 8 תַּפּוּחִים. כַּמָּה תַּפּוּחִים יֵשׁ עַכְשָׁו בַּסַּל?","options":["10","12","18","28"],"answer":2,"exp":"חֵצִי מ־20 הוּא 10. נִשְׁאֲרוּ 10, וְעוֹד ⁦8: 18⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בֶּחָצֵר שֶׁל גַּלִּי יֵשׁ 8 תַּרְנְגוֹלוֹת ו־2 כְּלָבִים. כַּמָּה רַגְלַיִם יֵשׁ לְכֻלָּם יַחַד?","options":["10","20","24","40"],"answer":2,"exp":"לְתַרְנְגֹלֶת 2 רַגְלַיִם: ⁦8 × 2 = 16⁩. לַכֶּלֶב 4 רַגְלַיִם: ⁦2 × 4 = 8⁩. בְּיַחַד: 24.","id":"m14","sec":"math"}]},{"n":18,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"לָמָּה צָרִיךְ לִישֹׁן?","lines":["בְּכָל לַיְלָה אֲנַחְנוּ יְשֵׁנִים כַּמָּה שָׁעוֹת, וְלִפְעָמִים נִדְמֶה לָנוּ שֶׁזֶּה בִּזְבּוּז זְמַן.","אֲבָל בִּזְמַן הַשֵּׁנָה הַגּוּף וְהַמֹּחַ עוֹבְדִים קָשֶׁה מְאוֹד.","בִּזְמַן הַשֵּׁנָה הַגּוּף מְתַקֵּן אֶת עַצְמוֹ: פְּצָעִים מַחֲלִימִים, וְהַשְּׁרִירִים מִתְחַזְּקִים.","אֵצֶל יְלָדִים, הַגּוּף מַפְרִישׁ בַּשֵּׁנָה חֹמֶר שֶׁעוֹזֵר לָהֶם לִגְדֹּל.","גַּם הַמּוֹחַ לֹא נָח. הוּא עוֹבֵר עַל מָה שֶׁלָּמַדְנוּ בְּמֶשֶׁךְ הַיּוֹם, וְשׁוֹמֵר אֶת הַדְּבָרִים הַחֲשׁוּבִים.","לָכֵן יֶלֶד שֶׁיָּשַׁן הֵיטֵב זוֹכֵר טוֹב יוֹתֵר אֶת מָה שֶׁלָּמַד, וְקַל לוֹ יוֹתֵר לְהִתְרַכֵּז.","יְלָדִים בְּגִיל בֵּית הַסֵּפֶר צְרִיכִים לִישֹׁן בְּעֵרֶךְ עָשָׂר שָׁעוֹת בְּכָל לַיְלָה.","כְּדֵי לְהֵרָדֵם בְּקַלּוּת, כְּדַאי לָלֶכֶת לִישֹׁן בְּכָל עֶרֶב בְּאוֹתָהּ שָׁעָה,","וּלְכַבּוֹת מָסַכִּים זְמַן מָה לִפְנֵי הַשֵּׁנָה, כִּי הָאוֹר שֶׁלָּהֶם מְבַלְבֵּל אֶת הַמּוֹחַ וְגוֹרֵם לוֹ לַחֲשֹׁב שֶׁעֲדַיִן יוֹם."]},{"kind":"story","title":"הַצִּיּוּר שֶׁל עֲדִי","lines":["בְּבֵית הַסֵּפֶר הִכְרִיזוּ עַל תַּחֲרוּת צִיּוּר: \"הַצִּיּוּר הֲכִי יָפֶה עַל הַחֹרֶף יִתָּלֶה בַּכְּנִיסָה לְבֵית הַסֵּפֶר.\"","עֲדִי רָצְתָה מְאוֹד לְנַצֵּחַ. בַּבַּיִת הִיא צִיְּרָה עֵץ בַּגֶּשֶׁם, אֲבָל לֹא הָיְתָה מְרֻצָּה.","\"הָעֲנָנִים יָצְאוּ כְּמוֹ כְּתָמִים,\" הִתְלוֹנְנָה. \"וְהַגֶּשֶׁם נִרְאָה כְּמוֹ קַוִּים עֲקֻמִּים.\"","אָחִיהָ הַגָּדוֹל, אֲרִיאֵל, שֶׁלּוֹמֵד אָמָּנוּת בַּתִּיכוֹן, הֵצִיץ בְּצִיּוּר. \"אֲנִי יָכוֹל לְתַקֵּן לָךְ,\" הִצִּיעַ.","תּוֹךְ כַּמָּה דַּקּוֹת הוּא הוֹסִיף צְלָלִים, בָּרָק מְסַנְוֵר וְטִפּוֹת שֶׁנִּרְאוּ מַמָּשׁ אֲמִתִּיּוֹת.","הַצִּיּוּר נִהְיָה מַדְהִים. עֲדִי הִגִּישָׁה אוֹתוֹ לְתַחֲרוּת, וְכַעֲבֹר שָׁבוּעַ הוֹדִיעוּ: הַצִּיּוּר שֶׁלָּהּ זָכָה!","כֻּלָּם מָחֲאוּ לָהּ כַּפַּיִם, וְהַמּוֹרָה לְאָמָּנוּת אָמְרָה: \"עֲדִי, יֵשׁ לָךְ כִּשָּׁרוֹן נָדִיר.\"","אֲבָל עֲדִי לֹא הִרְגִּישָׁה שִׂמְחָה. בְּכָל פַּעַם שֶׁעָבְרָה בַּכְּנִיסָה וְרָאֲתָה אֶת הַצִּיּוּר, הִרְגִּישָׁה כֹּבֶד בַּלֵּב.","\"זֶה לֹא בֶּאֱמֶת הַצִּיּוּר שֶׁלִּי,\" חָשְׁבָה. \"אֶת הַבָּרָק וְאֶת הַטִּפּוֹת אֲנִי לֹא יוֹדַעַת לְצַיֵּר.\"","אַחֲרֵי שְׁלוֹשָׁה יָמִים הִיא לֹא יָכְלָה יוֹתֵר. הִיא נִגְּשָׁה לַמּוֹרָה לְאָמָּנוּת וְסִפְּרָה לָהּ הַכֹּל.","הַמּוֹרָה שָׁתְקָה רֶגַע. \"לֹא הָיָה פָּשׁוּט לְסַפֵּר לִי,\" אָמְרָה. \"אֲנִי מַעֲרִיכָה אֶת זֶה מְאוֹד.\"","הַצִּיּוּר הֻחְלַף בְּצִיּוּר שֶׁל יֶלֶד אַחֵר, וַעֲדִי חָשְׁבָה שֶׁתַּרְגִּישׁ עֲצוּבָה.","אֲבָל, בְּאֹפֶן מוּזָר, הִיא הִרְגִּישָׁה קַלָּה, כְּאִלּוּ יָרְדָה מִמֶּנָּה אֶבֶן כְּבֵדָה.","בַּשָּׁבוּעַ שֶׁאַחֲרֵי, הַמּוֹרָה הִזְמִינָה אוֹתָהּ לְחוּג צִיּוּר. \"כְּדֵי שֶׁבַּפַּעַם הַבָּאָה,\" אָמְרָה, \"כָּל הַבְּרָקִים יִהְיוּ שֶׁלְּךָ.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 1 \"נִדְמֶה לָנוּ שֶׁזֶּה בִּזְבּוּז זְמַן\"?","options":["כְּדֵי לְהַצִּיג מַחְשָׁבָה שֶׁהַקֶּטַע מַרְאֶה שֶׁהִיא לֹא נְכוֹנָה","כִּי שֵׁנָה בֶּאֱמֶת מְבַזְבֶּזֶת זְמַן","כְּדֵי לְהַגִּיד שֶׁצָּרִיךְ לִישֹׁן פָּחוֹת","כִּי יְלָדִים לֹא אוֹהֲבִים לִישֹׁן"],"answer":0,"exp":"מִיָּד בְּשׁוּרָה 2 כָּתוּב \"אֲבָל\" – בִּזְמַן הַשֵּׁנָה הַגּוּף וְהַמֹּחַ עוֹבְדִים קָשֶׁה. זֶה לֹא בִּזְבּוּז זְמַן."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מָה עוֹשֶׂה הַמּוֹחַ בִּזְמַן הַשֵּׁנָה?","options":["רַק חוֹלֵם חֲלוֹמוֹת","שׁוֹכֵחַ אֶת כָּל מָה שֶׁלָּמַדְנוּ","נָח וְלֹא עוֹשֶׂה כְּלוּם","עוֹבֵר עַל מָה שֶׁלָּמַדְנוּ, וְשׁוֹמֵר אֶת הַדְּבָרִים הַחֲשׁוּבִים"],"answer":3,"exp":"בְּשׁוּרָה 5 כָּתוּב שֶׁהַמֹּחַ עוֹבֵר עַל מָה שֶׁלָּמַדְנוּ וְשׁוֹמֵר אֶת הַדְּבָרִים הַחֲשׁוּבִים."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"מַחְלִימִים\" (שׁוּרָה 3)?","options":["כּוֹאֲבִים יוֹתֵר","נִרְפָּאִים, וְנַעֲשִׂים בְּרִיאִים שׁוּב","נִפְתָּחִים","מִתְלַכְלְכִים"],"answer":1,"exp":"פֶּצַע שֶׁמַּחְלִים הוּא פֶּצַע שֶׁנִּרְפָּא וְנִסְגַּר."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"דָּן וְאִיתַי לָמְדוּ שִׁיר חָדָשׁ. דָּן יָשַׁן הֵיטֵב בַּלַּיְלָה, וְאִתִּי יָשַׁן מְעַט. לְפִי הַקֶּטַע, מָה הֲכִי סָבִיר?","options":["דָּן יִזְכֹּר אֶת הַשִּׁיר טוֹב יוֹתֵר","שְׁנֵיהֶם יִשְׁכְּחוּ אֶת הַשִּׁיר","אִי אֶפְשָׁר לִלְמֹד שִׁירִים בַּלַּיְלָה","אִיתַי יִזְכֹּר אֶת הַשִּׁיר טוֹב יוֹתֵר"],"answer":0,"exp":"לְפִי שׁוּרָה 6, מִי שֶׁיָּשַׁן הֵיטֵב זוֹכֵר טוֹב יוֹתֵר אֶת מָה שֶׁלָּמַד."},{"id":"r5","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כְּדַאי לְכַבּוֹת מָסַכִּים זְמַן מָה לִפְנֵי הַשֵּׁנָה?","options":["כִּי הַמָּסַכִּים מִתְחַמְּמִים","כִּי הַמָּסַכִּים רוֹעֲשִׁים","כִּי הָאוֹר שֶׁלָּהֶם גּוֹרֵם לַמּוֹחַ לַחֲשֹׁב שֶׁעֲדַיִן יוֹם","כִּי בָּעֶרֶב אֵין תָּכְנִיּוֹת טוֹבוֹת"],"answer":2,"exp":"בְּשׁוּרָה 9 כָּתוּב שֶׁהָאוֹר שֶׁל הַמָּסַכִּים מְבַלְבֵּל אֶת הַמּוֹחַ וְגוֹרֵם לוֹ לַחֲשֹׁב שֶׁעֲדַיִן יוֹם."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיָה הַנּוֹשֵׂא שֶׁל תַּחֲרוּת הַצִּיּוּר?","options":["הַקַּיִץ","הַמִּשְׁפָּחָה","בֵּית הַסֵּפֶר","הַחֹרֶף"],"answer":3,"exp":"בְּשׁוּרָה 1: \"הַצִּיּוּר הֲכִי יָפֶה עַל הַחֹרֶף\"."},{"id":"r7","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה עֲדִי לֹא הָיְתָה מְרֻצָּה מֵהַצִּיּוּר הָרִאשׁוֹן שֶׁלָּהּ?","options":["כִּי אֲרִיאֵל צָחַק עָלֶיהָ","כִּי הִיא חָשְׁבָה שֶׁהָעֲנָנִים וְהַגֶּשֶׁם לֹא יָצְאוּ יָפֶה","כִּי הִיא צִיְּרָה אֶת הַקַּיִץ","כִּי לֹא הָיוּ לָהּ צְבָעִים"],"answer":1,"exp":"בְּשׁוּרָה 3 הִיא מִתְלוֹנֶנֶת עַל הָעֲנָנִים וְעַל הַגֶּשֶׁם."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"כֹּבֶד בַּלֵּב\" (שׁוּרָה 8)?","options":["כְּאֵב בֶּטֶן מֵרָעָב","שִׂמְחָה גְּדוֹלָה","עֲיֵפוּת אַחֲרֵי רִיצָה","הַרְגָּשָׁה לֹא נְעִימָה, כְּמוֹ מַשֶּׁהוּ כָּבֵד שֶׁמֵּצִיק"],"answer":3,"exp":"עֲדִי הִרְגִּישָׁה שֶׁמַּשֶּׁהוּ לֹא בְּסֵדֶר, וְזֶה הֵצִיק לָהּ – כְּמוֹ כֹּבֶד בַּלֵּב."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה עֲדִי חָשְׁבָה \"זֶה לֹא בֶּאֱמֶת הַצִּיּוּר שֶׁלִּי\" (שׁוּרָה 9)?","options":["כִּי הַמּוֹרָה צִיְּרָה אוֹתוֹ","כִּי הַצִּיּוּר נֶעֱלַם","כִּי אָחִיהָ צִיֵּר אֶת הַחֲלָקִים שֶׁהָפְכוּ אֶת הַצִּיּוּר לִמְיֻחָד","כִּי הִיא צִיְּרָה אוֹתוֹ בְּבֵית הַסֵּפֶר"],"answer":2,"exp":"אֲרִיאֵל הוֹסִיף אֶת הַצְּלָלִים, אֶת הַבָּרָק וְאֶת הַטִּפּוֹת (שׁוּרָה 5) – הַחֲלָקִים שֶׁעֲדִי לֹא יוֹדַעַת לְצַיֵּר."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשְׂתָה עֲדִי אַחֲרֵי שְׁלוֹשָׁה יָמִים?","options":["סִפְּרָה לַמּוֹרָה לְאָמָּנוּת אֶת הָאֱמֶת","צִיְּרָה צִיּוּר חָדָשׁ","הוֹרִידָה אֶת הַצִּיּוּר בַּלַּיְלָה","בִּקְּשָׁה מֵאֲרִיאֵל לְצַיֵּר עוֹד"],"answer":0,"exp":"בְּשׁוּרָה 10 כָּתוּב שֶׁעֲדִי נִגְּשָׁה לַמּוֹרָה וְסִפְּרָה לָהּ הַכֹּל."},{"id":"r11","sec":"read","p":1,"tag":"y","type":"mc","q":"בְּאֵיזֶה זוּג הַמִּלִּים דּוֹמוֹת בַּמַּשְׁמָעוּת?","options":["כְּבֵדָה – קַלָּה","שָׁתְקָה – דִּבְּרָה","נָדִיר – מְיֻחָד","עֲצוּבָה – שִׂמְחָה"],"answer":2,"exp":"\"נָדִיר\" הוּא מַשֶּׁהוּ שֶׁאֵין הַרְבֵּה כָּמוֹהוּ – מְיֻחָד. בִּשְׁאַר הַזּוּגוֹת הַמִּלִּים הֲפוּכוֹת."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה הִתְכַּוְּנָה הַמּוֹרָה כְּשֶׁאָמְרָה \"כְּדֵי שֶׁבַּפַּעַם הַבָּאָה כָּל הַבְּרָקִים יִהְיוּ שֶׁלְּךָ\" (שׁוּרָה 14)?","options":["שֶׁאֲרִיאֵל יָבוֹא אִתָּהּ לַחוּג","שֶׁבְּחוּג עֲדִי תִּלְמַד לְצַיֵּר בְּעַצְמָהּ גַּם אֶת הַחֲלָקִים הַקָּשִׁים","שֶׁבַּפַּעַם הַבָּאָה יֵרֵד גֶּשֶׁם","שֶׁעֲדִי תְּצַיֵּר רַק בְּרָקִים"],"answer":1,"exp":"הַמּוֹרָה רוֹצָה שֶׁבַּפַּעַם הַבָּאָה עֲדִי תְּצַיֵּר הַכֹּל בְּעַצְמָהּ – גַּם אֶת הַבָּרָק."},{"type":"open","tag":"calc","expr":"49 + 17 = ___","answer":66,"exp":"⁦49 + 17 = 66⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"63 − 34 = ___","answer":29,"exp":"⁦63 − 34 = 29⁩. בְּדִיקָה: ⁦29 + 34 = 63⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"3 × 6 = ___","answer":18,"exp":"⁦3 × 6 = 18⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"63 : 9 = ___","answer":7,"exp":"⁦63 : 9 = 7⁩, כִּי ⁦9 × 7 = 63⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 47 = 66","answer":19,"exp":"⁦66 − 47 = 19⁩, וְלָכֵן ⁦19 + 47 = 66⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"91 − ___ = 50","answer":41,"exp":"⁦91 − 50 = 41⁩, וְלָכֵן ⁦91 − 41 = 50⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"9 × ___ = 25 + 29","answer":6,"exp":"⁦25 + 29 = 54⁩, ו־⁦9 × 6 = 54⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"51 + 16 < 50 + ___","min":18,"max":999,"exp":"בְּצַד יָמִין יֵשׁ 50, אֶחָד פָּחוֹת מ־51. לָכֵן צָרִיךְ מִסְפָּר גָּדוֹל מ־17, לְמָשָׁל 18.","answer":18,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△3 − 1△ = 11","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 2: 23 − 12 = 11⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"3 × △ + △ = 28","options":["⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 7: 3 × 7 + 7 = 28⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square"],10],[["square","circle"],11],[["circle","heart"],8]],"ask":["heart"]},"options":["1","2","3","4"],"answer":1,"exp":"שְׁנֵי רִבּוּעִים = 10, אָז רִבּוּעַ = 5. עִגּוּל = ⁦11 − 5 = 6⁩. לֵב = ⁦8 − 6 = 2⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"גַּלִּי חוֹסֶכֶת 8 ₪ בְּכָל שָׁבוּעַ. אַחֲרֵי כַּמָּה שָׁבוּעוֹת יִהְיוּ לָהּ 48 ₪?","options":["5","6","7","40"],"answer":1,"exp":"⁦8 × 6 = 48⁩, לָכֵן אַחֲרֵי 6 שָׁבוּעוֹת.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"רוֹנִי בַּת 8. אֲחוֹתָהּ הַגְּדוֹלָה מְבֻגֶּרֶת מִמֶּנָּה ב־2 שָׁנִים. בַּת כַּמָּה תִּהְיֶה הָאָחוֹת בְּעוֹד 6 שָׁנִים?","options":["4","10","14","16"],"answer":3,"exp":"עַכְשָׁו הָאָחוֹת בַּת ⁦8 + 2 = 10⁩. בְּעוֹד 6 שָׁנִים: ⁦10 + 6 = 16⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּתּוֹר לִגְלִידָה דָּנִיֵּאל עוֹמֵד בַּמָּקוֹם ה־9 מֵהַהַתְחָלָה. מֵאֲחוֹרָיו עוֹמְדִים עוֹד 8 יְלָדִים. כַּמָּה יְלָדִים יֵשׁ בַּתּוֹר?","options":["8","16","17","18"],"answer":2,"exp":"9 יְלָדִים עַד דָּנִיֵּאל (כּוֹלֵל אוֹתוֹ), וְעוֹד 8 מֵאָחוֹר: ⁦9 + 8 = 17⁩.","id":"m14","sec":"math"}]},{"n":19,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"הַפִּינְגְּוִין הַקֵּיסָרִי","lines":["הַפִּינְגְּוִין הַקֵּיסָרִי חַי בְּאַנְטְאַרְקְטִיקָה, אַחַד הַמְּקוֹמוֹת הַקָּרִים בְּיוֹתֵר בָּעוֹלָם.","הוּא עוֹף, אֲבָל הוּא לֹא יָכוֹל לָעוּף. בִּמְקוֹם זֶה הוּא שׂוֹחֶה מְצֻיָּן, וְצוֹלֵל עָמֹק כְּדֵי לִתְפֹּס דָּגִים.","בַּחֹרֶף, כְּשֶׁהַקֹּר הֲכִי קָשֶׁה, הַנְּקֵבָה מְטִילָה בֵּיצָה אַחַת, וּמִיָּד חוֹזֶרֶת לַיָּם כְּדֵי לֶאֱכֹל.","אֶת הַבֵּיצָה הִיא מַשְׁאִירָה אֵצֶל הַזָּכָר. הַזָּכָר מַחְזִיק אוֹתָהּ עַל כַּפּוֹת הָרַגְלַיִם,","וּמְכַסֶּה אוֹתָהּ בְּקֶפֶל שֶׁל עוֹר חַם שֶׁיֵּשׁ לוֹ בַּבֶּטֶן, כְּדֵי שֶׁהִיא לֹא תִּקְפָּא.","בְּמֶשֶׁךְ כְּחָדְשַׁיִם הַזָּכָר עוֹמֵד כָּךְ, וְלֹא אוֹכֵל בִּכְלָל. הוּא חַי מֵהַשֻּׁמָּן שֶׁבַּגּוּף שֶׁלּוֹ.","כְּדֵי לֹא לִקְפֹּא, הַזְּכָרִים נִצְמָדִים זֶה לָזֶה בִּקְבוּצָה גְּדוֹלָה. כָּל כַּמָּה זְמַן הֵם מִתְחַלְּפִים:","מִי שֶׁעָמַד בַּחוּץ, בַּקֹּר, נִכְנַס פְּנִימָה, וּמִי שֶׁהָיָה בִּפְנִים יוֹצֵא הַחוּצָה.","כְּשֶׁהַגּוֹזָל בּוֹקֵעַ, הַנְּקֵבָה חוֹזֶרֶת עִם אֹכֶל, וְעַכְשָׁו תּוֹרוֹ שֶׁל הַזָּכָר לָלֶכֶת לַיָּם וְלֶאֱכֹל."]},{"kind":"story","title":"הַקֵּן בַּמִּרְפֶּסֶת","lines":["בָּאָבִיב, בְּבֹקֶר אֶחָד, אִמָּא קָרְאָה לְגַיְא אֶל הַמִּרְפֶּסֶת. \"תִּסְתַּכֵּל בְּשֶׁקֶט,\" לָחֲשָׁה.","בְּתוֹךְ עָצִיץ יָשָׁן, בֵּין הֶעָלִים הַיְּבֵשִׁים, יָשְׁבָה יוֹנָה קְטַנָּה עַל קֵן שֶׁל זְרָדִים.","\"הִיא בָּנְתָה פֹּה קֵן?\" הִתְפַּלֵּא גַּיְא. \"אֶצְלֵנוּ, עַל הַמִּרְפֶּסֶת?\"","מֵאוֹתוֹ יוֹם גַּיְא בָּדַק אֶת הַקֵּן בְּכָל בֹּקֶר, אֲבָל רַק מֵרָחוֹק, מִבַּעַד לַחַלּוֹן.","אִמָּא הִסְבִּירָה לוֹ שֶׁאִם יִתְקָרֵב מִדַּי, הַיּוֹנָה עֲלוּלָה לְהִבָּהֵל וְלַעֲזֹב אֶת הַבֵּיצִים.","אַחֲרֵי כַּמָּה יָמִים, כְּשֶׁהַיּוֹנָה קָמָה לְרֶגַע, הוּא רָאָה שְׁתֵּי בֵּיצִים לְבָנוֹת וּקְטַנּוֹת.","גַּיְא רָצָה לְסַפֵּר לְכָל הַכִּתָּה, אֲבָל גַּם רָצָה לִשְׁמֹר אֶת הַסּוֹד רַק לְעַצְמוֹ.","בַּסּוֹף הוּא סִפֵּר רַק לֶחָבֵר הֲכִי טוֹב שֶׁלּוֹ, אֲרִיאֵל, וּבִקֵּשׁ: \"אֶל תְּסַפֵּר לְאַף אֶחָד.\"","שְׁבוּעַיִם אַחַר כָּךְ בָּקְעוּ שְׁנֵי גּוֹזָלִים. הֵם הָיוּ קֵרְחִים, עִם מָקוֹר שֶׁנִּפְתַּח כָּל הַזְּמַן.","הַהוֹרִים שֶׁלָּהֶם עָפוּ הָלוֹךְ וָשׁוֹב, וְהֵבִיאוּ לָהֶם אֹכֶל מֵהַבֹּקֶר עַד הָעֶרֶב.","הַגּוֹזָלִים גָּדְלוּ מַהֵר. נוֹצוֹת אֲפֹרוֹת כִּסּוּ אוֹתָם, וְהֵם הִתְחִילוּ לְנַפְנֵף בַּכְּנָפַיִם.","בֹּקֶר אֶחָד גַּיְא הֵצִיץ מֵהַחַלּוֹן, וְהַקֵּן הָיָה רֵיק.","לְרֶגַע הוּא נִבְהַל, אֲבָל אָז שָׁמַע הֶמְיָה עַל הַמַּעֲקֶה: שְׁתֵּי יוֹנִים צְעִירוֹת יָשְׁבוּ שָׁם, קָרוֹב זוֹ לְזוֹ.","\"הֵן לֹא עָזְבוּ,\" אָמַר גַּיְא לְאִמָּא. \"הֵן רַק לָמְדוּ לָעוּף.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"אֵיפֹה חַי הַפִּינְגְּוִין הַקֵּיסָרִי?","options":["בְּאַנְטְאַרְקְטִיקָה","בְּיַעַר גֶּשֶׁם","עַל הָרִים גְּבוֹהִים בְּאַפְרִיקָה","בַּמִּדְבָּר"],"answer":0,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁהַפִּינְגְּוִין הַקֵּיסָרִי חַי בְּאַנְטְאַרְקְטִיקָה."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַנְּקֵבָה חוֹזֶרֶת לַיָּם מִיָּד אַחֲרֵי שֶׁהִיא מְטִילָה אֶת הַבֵּיצָה?","options":["כְּדֵי לְשַׂחֵק","כְּדֵי לְהָבִיא בֵּיצָה נוֹסֶפֶת","כְּדֵי לִשְׁמֹר עַל הַזָּכָר","כְּדֵי לֶאֱכֹל"],"answer":3,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁהִיא חוֹזֶרֶת לַיָּם \"כְּדֵי לֶאֱכֹל\"."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נִצְמָדִים\" (שׁוּרָה 7)?","options":["קוֹפְצִים","רַבִּים זֶה עִם זֶה","בּוֹרְחִים זֶה מִזֶּה","עוֹמְדִים קָרוֹב מְאוֹד, צָמוּד זֶה לָזֶה"],"answer":3,"exp":"הַזְּכָרִים נִצְמָדִים – עוֹמְדִים צָמוּד – כְּדֵי לְחַמֵּם זֶה אֶת זֶה."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"לָמָּה הַזְּכָרִים מִתְחַלְּפִים בֵּין הַחוּץ לְבֵין הַפָּנִים שֶׁל הַקְּבוּצָה?","options":["כְּדֵי שֶׁהַבֵּיצָה תִּפֹּל","כְּדֵי לְחַפֵּשׂ דָּגִים","כְּדֵי שֶׁלְּאַף אֶחָד לֹא יִהְיֶה קַר מִדַּי הַרְבֵּה זְמַן","כְּדֵי לְשַׂחֵק מִשְׂחָק"],"answer":2,"exp":"בַּחוּץ קַר יוֹתֵר וּבִפְנִים חַם יוֹתֵר. כְּשֶׁמִּתְחַלְּפִים, כֻּלָּם מְקַבְּלִים זְמַן בְּחֹם."},{"id":"r5","sec":"read","p":0,"tag":"s","type":"mc","q":"מָה קוֹרֶה כְּשֶׁהַגּוֹזָל בּוֹקֵעַ?","options":["הַזָּכָר מֵטִיל בֵּיצָה חֲדָשָׁה","הַזָּכָר נִשְׁאָר עוֹד חָדְשַׁיִם בְּלִי אֹכֶל","הַנְּקֵבָה חוֹזֶרֶת עִם אֹכֶל, וְהַזָּכָר הוֹלֵךְ לַיָּם לֶאֱכֹל","כָּל הַפִּינְגְּוִינִים עָפִים"],"answer":2,"exp":"בְּשׁוּרָה 9 כָּתוּב שֶׁהַנְּקֵבָה חוֹזֶרֶת עִם אֹכֶל, וְעַכְשָׁו הַזָּכָר הוֹלֵךְ לֶאֱכֹל."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"אֵיפֹה הַיּוֹנָה בָּנְתָה אֶת הַקֵּן?","options":["עַל הַגַּג","בְּתוֹךְ עָצִיץ יָשָׁן בַּמִּרְפֶּסֶת","עַל עֵץ בֶּחָצֵר","עַל אֶדֶן הַחַלּוֹן"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַיּוֹנָה יָשְׁבָה בְּתוֹךְ עָצִיץ יָשָׁן, בַּמִּרְפֶּסֶת."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה גַּיְא הִסְתַּכֵּל עַל הַקֵּן רַק מֵרָחוֹק?","options":["כְּדֵי שֶׁהַיּוֹנָה לֹא תִּבָּהֵל וְתַעֲזֹב אֶת הַבֵּיצִים","כִּי הוּא פָּחַד מִיּוּנִים","כִּי הַקֵּן הָיָה גָּבוֹהַּ מִדַּי","כִּי אֲרִיאֵל בִּקֵּשׁ מִמֶּנּוּ"],"answer":0,"exp":"בְּשׁוּרָה 5 אִמָּא מַסְבִּירָה שֶׁאִם יִתְקָרֵב, הַיּוֹנָה עֲלוּלָה לְהִבָּהֵל וְלַעֲזֹב."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה מַרְאָה שׁוּרָה 7 עַל גַּיְא?","options":["שֶׁהוּא הִתְלַבֵּט בֵּין לְסַפֵּר לְבֵין לִשְׁמֹר אֶת הַסּוֹד","שֶׁהוּא שָׁכַח מֵהַקֵּן","שֶׁהוּא לֹא אָהַב אֶת הַכִּתָּה","שֶׁהוּא כָּעַס עַל אִמָּא"],"answer":0,"exp":"גַּיְא רָצָה לְסַפֵּר, \"אֲבָל גַּם\" רָצָה לִשְׁמֹר אֶת הַסּוֹד – הוּא הִתְלַבֵּט."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"קֵרְחִים\" (שׁוּרָה 9)?","options":["רְעֵבִים מְאוֹד","בְּלִי נוֹצוֹת","גְּדוֹלִים","שְׁקֵטִים"],"answer":1,"exp":"הַגּוֹזָלִים הָיוּ קֵרְחִים – עוֹד לֹא הָיוּ לָהֶם נוֹצוֹת. הַנּוֹצוֹת הוֹפִיעוּ אַחַר כָּךְ (שׁוּרָה 11)."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשׂוּ הַהוֹרִים שֶׁל הַגּוֹזָלִים מֵהַבֹּקֶר עַד הָעֶרֶב?","options":["בָּנוּ קֵן חָדָשׁ","הֵבִיאוּ לָהֶם אֹכֶל","לִמְּדוּ אוֹתָם לָשִׁיר","יָשְׁבוּ עַל הַבֵּיצִים"],"answer":1,"exp":"בְּשׁוּרָה 10 כָּתוּב שֶׁהַהוֹרִים הֵבִיאוּ לַגּוֹזָלִים אֹכֶל מֵהַבֹּקֶר עַד הָעֶרֶב."},{"id":"r11","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה גַּיְא נִבְהַל לְרֶגַע כְּשֶׁרָאָה שֶׁהַקֵּן רֵיק?","options":["כִּי הוּא שָׁמַע רַעַשׁ חָזָק","כִּי חָשַׁב שֶׁאֲרִיאֵל סִפֵּר לְכֻלָּם","כִּי חָשַׁב שֶׁקָּרָה מַשֶּׁהוּ לַגּוֹזָלִים","כִּי אִמָּא צָעֲקָה"],"answer":2,"exp":"הַקֵּן הָיָה רֵיק, וְגַיְא דָּאַג לַגּוֹזָלִים – עַד שֶׁשָּׁמַע אוֹתָם עַל הַמַּעֲקֶה."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמִי מִתְכַּוֵּן גַּיְא כְּשֶׁהוּא אוֹמֵר \"הֵן לֹא עָזְבוּ\" (שׁוּרָה 14)?","options":["לִשְׁתֵּי בֵּיצִים חֲדָשׁוֹת","לְאִמָּא וְלַאֲחוֹתוֹ","לְיוֹנִים שֶׁל הַשְּׁכֵנִים","לִשְׁתֵּי הַיּוֹנִים הַצְּעִירוֹת, שֶׁהָיוּ הַגּוֹזָלִים"],"answer":3,"exp":"הַגּוֹזָלִים גָּדְלוּ וְהָפְכוּ לְיוֹנִים צְעִירוֹת. הֵם לֹא עָזְבוּ – הֵם לָמְדוּ לָעוּף."},{"type":"open","tag":"calc","expr":"72 + 19 = ___","answer":91,"exp":"⁦72 + 19 = 91⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"67 − 59 = ___","answer":8,"exp":"⁦67 − 59 = 8⁩. בְּדִיקָה: ⁦8 + 59 = 67⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"6 × 9 = ___","answer":54,"exp":"⁦6 × 9 = 54⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"56 : 8 = ___","answer":7,"exp":"⁦56 : 8 = 7⁩, כִּי ⁦8 × 7 = 56⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 32 = 65","answer":33,"exp":"⁦65 − 32 = 33⁩, וְלָכֵן ⁦33 + 32 = 65⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"83 − ___ = 56","answer":27,"exp":"⁦83 − 56 = 27⁩, וְלָכֵן ⁦83 − 27 = 56⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"7 × ___ = 22 + 20","answer":6,"exp":"⁦22 + 20 = 42⁩, ו־⁦7 × 6 = 42⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"75 − 9 < 75 − ___","min":0,"max":8,"exp":"כְּשֶׁמּוֹרִידִים פָּחוֹת, נִשְׁאַר יוֹתֵר. צָרִיךְ לְהוֹרִיד פָּחוֹת מ־9, לְמָשָׁל 8.","answer":8,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"3 × △ + △ = 24","options":["⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 6: 3 × 6 + 6 = 24⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△1 + 2△ = 54","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 3: 31 + 23 = 54⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["star","star"],14],[["star","heart"],12],[["heart","square"],14]],"ask":["square"]},"options":["8","9","10","11"],"answer":1,"exp":"שְׁנֵי כּוֹכָבִים = 14, אָז כּוֹכָב = 7. לֵב = ⁦12 − 7 = 5⁩. רִבּוּעַ = ⁦14 − 5 = 9⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"בֶּחָצֵר שֶׁל רוֹנִי יֵשׁ 3 תַּרְנְגוֹלוֹת ו־5 כְּלָבִים. כַּמָּה רַגְלַיִם יֵשׁ לְכֻלָּם יַחַד?","options":["8","16","26","32"],"answer":2,"exp":"לְתַרְנְגֹלֶת 2 רַגְלַיִם: ⁦3 × 2 = 6⁩. לַכֶּלֶב 4 רַגְלַיִם: ⁦5 × 4 = 20⁩. בְּיַחַד: 26.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בַּתּוֹר לִגְלִידָה אֵיתָן עוֹמֵד בַּמָּקוֹם ה־4 מֵהַהַתְחָלָה. מֵאֲחוֹרָיו עוֹמְדִים עוֹד 6 יְלָדִים. כַּמָּה יְלָדִים יֵשׁ בַּתּוֹר?","options":["6","9","10","11"],"answer":2,"exp":"4 יְלָדִים עַד אֵיתָן (כּוֹלֵל אוֹתוֹ), וְעוֹד 6 מֵאָחוֹר: ⁦4 + 6 = 10⁩.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"כַּרְטִיס לְיֶלֶד לְהַצָּגָה עוֹלֶה 7 ₪, וְכַרְטִיס לִמְבֻגָּר עוֹלֶה 9 ₪. כַּמָּה יַעֲלוּ כַּרְטִיסִים ל־3 יְלָדִים וְלִמְבֻגָּר אֶחָד?","options":["16","28","30","36"],"answer":2,"exp":"יְלָדִים: ⁦3 × 7 = 21⁩. מְבֻגָּרִים: ⁦1 × 9 = 9⁩. בְּיַחַד: 30 ₪.","id":"m14","sec":"math"}]},{"n":20,"level":"מאתגר","printable":false,"passages":[{"kind":"info","title":"הַסְּנָאִי הַשַּׁכְחָן","lines":["הַסְּנָאִי הוּא מְכַרְסֵם קָטָן וְזָרִיז, שֶׁחַי בְּעִקָּר עַל עֵצִים.","הַזָּנָב הָאָרֹךְ וְהַשָּׂעִיר שֶׁלּוֹ עוֹזֵר לוֹ לִשְׁמֹר עַל שִׁוּוּי מִשְׁקָל כְּשֶׁהוּא קוֹפֵץ מֵעָנָף לְעָנָף.","בַּחֹרֶף, כְּשֶׁקַּר, הַסְּנָאִי מִתְכַּרְבֵּל בְּתוֹךְ הַזָּנָב, כְּמוֹ בְּתוֹךְ שְׂמִיכָה.","בַּסְּתָו הַסְּנָאִי עָסוּק מְאוֹד: הוּא אוֹסֵף אֱגוֹזִים וּבַלּוּטִים, וְקוֹבֵר אוֹתָם בָּאֲדָמָה בִּמְקוֹמוֹת רַבִּים.","כָּךְ יִהְיֶה לוֹ מָזוֹן בַּחֹרֶף, כְּשֶׁקָּשֶׁה לִמְצֹא אֹכֶל.","הַסְּנָאִי זוֹכֵר הַרְבֵּה מֵהַמְּקוֹמוֹת שֶׁבָּהֶם הִסְתִּיר אֶת הָאֹכֶל, וּבְעֶזְרַת חוּשׁ הָרֵיחַ הוּא מוֹצֵא אוֹתָם.","אֲבָל אֶת חֵלֶק מֵהָאֱגוֹזִים הוּא לֹא מוֹצֵא אַף פַּעַם.","הָאֱגוֹזִים הָאֵלֶּה נִשְׁאָרִים בָּאֲדָמָה, וּבָאָבִיב חֵלֶק מֵהֶם נוֹבְטִים וְהוֹפְכִים לְעֵצִים צְעִירִים.","כָּךְ, בְּלִי לָדַעַת, הַסְּנָאִי עוֹזֵר לַיַּעַר לַגָּדוֹל – בִּזְכוּת מָה שֶׁשָּׁכַח."]},{"kind":"story","title":"הָאֲבָנִים שֶׁל נֹעַם","lines":["הַמּוֹרָה בִּקְּשָׁה שֶׁכָּל יֶלֶד יְסַפֵּר לַכִּתָּה עַל הַתַּחְבִּיב שֶׁלּוֹ, וְיָבִיא מַשֶּׁהוּ לְהַרְאוֹת.","כֻּלָּם הִתְלַהֲבוּ. רוֹעִי הֵבִיא כַּדּוּר כַּדּוּרֶגֶל חָתוּם, וְיַעֲלִי הֵבִיאָה תְּמוּנוֹת שֶׁל הַסּוּסָה שֶׁלָּהּ.","רַק נֹעַם יָשַׁב בְּשֶׁקֶט. הַתַּחְבִּיב שֶׁלּוֹ הָיָה אִסּוּף אֲבָנִים, וְהוּא חָשַׁשׁ שֶׁכֻּלָּם יִצְחֲקוּ.","\"אֲבָנִים?\" אָמַר לְעַצְמוֹ. \"מִי בִּכְלָל מִתְעַנְיֵן בַּאֲבָנִים? זֶה הֲכִי מְשַׁעֲמֵם בָּעוֹלָם.\"","בָּעֶרֶב הוּא פָּתַח אֶת הַקֻּפְסָה שֶׁלּוֹ. הָיוּ בָּהּ אֲבָנִים מִכָּל מָקוֹם שֶׁהַמִּשְׁפָּחָה טִיְּלָה בּוֹ:","אֶבֶן שְׁחֹרָה וּמְחֹרֶרֶת מֵהַגּוֹלָן, אֶבֶן לְבָנָה וְרַכָּה מֵהַמַּכְתֵּשׁ, וְאֶבֶן שְׁקוּפָה לְמֶחֱצָה מֵחוֹף הַיָּם.","לְכָל אֶבֶן הָיָה סִפּוּר. נֹעַם זָכַר בְּדִיּוּק אֵיפֹה מָצָא כָּל אַחַת, וּמָה קָרָה בְּאוֹתוֹ יוֹם.","\"אִם תְּסַפֵּר אֶת הַסִּפּוּרִים,\" אָמְרָה אִמָּא, \"אַף אֶחָד לֹא יִשְׁתַּעֲמֵם.\"","בַּיּוֹם שֶׁלּוֹ נֹעַם עָמַד מוּל הַכִּתָּה, וְהַיָּדַיִם שֶׁלּוֹ הִזִּיעוּ.","הוּא הוֹצִיא אֶת הָאֶבֶן הַשְּׁחֹרָה, וְסִפֵּר שֶׁהִיא נוֹצְרָה מִלִּבָּהּ שֶׁל הַר גַּעַשׁ, לִפְנֵי הַרְבֵּה מְאוֹד שָׁנִים.","\"הַר גַּעַשׁ? בְּיִשְׂרָאֵל?\" שָׁאַל מִישֶׁהוּ, וְכָל הַכִּתָּה הִתְקָרְבָה לְהִסְתַּכֵּל.","נֹעַם הִמְשִׁיךְ לְסַפֵּר עוֹד וָעוֹד, וּכְבָר שָׁכַח שֶׁפָּחַד. הַיְּלָדִים הֶעֱבִירוּ אֶת הָאֲבָנִים מִיָּד לְיָד.","כְּשֶׁנִּגְמַר הַזְּמַן, הַמּוֹרָה אָמְרָה: \"נִרְאֶה לִי שֶׁנִּצְטָרֵךְ עוֹד שִׁעוּר, כְּדֵי לִשְׁמֹעַ אֶת כָּל הַסִּפּוּרִים.\"","בַּהַפְסָקָה נִגְּשׁוּ אֵלָיו שְׁלוֹשָׁה יְלָדִים. \"אֶפְשָׁר לְהִצְטָרֵף אֵלֶיךָ כְּשֶׁתְּחַפֵּשׂ אֲבָנִים?\" שָׁאֲלוּ."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"בְּמָה עוֹזֵר לִסְנָאִי הַזָּנָב שֶׁלּוֹ כְּשֶׁהוּא קוֹפֵץ?","options":["לַחְפֹּר בָּאֲדָמָה","לִשְׁמֹר עַל שִׁוּוּי מִשְׁקָל","לְהַסְתִּיר אֱגוֹזִים","לְהָרִיחַ אֹכֶל"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַזָּנָב עוֹזֵר לוֹ לִשְׁמֹר עַל שִׁוּוּי מִשְׁקָל כְּשֶׁהוּא קוֹפֵץ."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַסְּנָאִי קוֹבֵר אֱגוֹזִים בַּסְּתָו?","options":["כְּדֵי שֶׁיִּהְיֶה לוֹ מָזוֹן בַּחֹרֶף","כְּדֵי שֶׁהָאֱגוֹזִים יִתְבַּשְּׁלוּ","כְּדֵי לְשַׂחֵק עִם סְנָאִים אֲחֵרִים","כְּדֵי לִשְׁתֹּל עֵצִים"],"answer":0,"exp":"בְּשׁוּרָה 5 כָּתוּב: \"כָּךְ יִהְיֶה לוֹ מָזוֹן בַּחֹרֶף\"."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"נוֹבְטִים\" (שׁוּרָה 8)?","options":["נִרְקָבִים","מַתְחִילִים לִצְמֹחַ","נִשְׁבָּרִים","נֶאֱכָלִים"],"answer":1,"exp":"אֱגוֹז שֶׁנּוֹבֵט מַתְחִיל לִצְמֹחַ – וּבַסּוֹף הוֹפֵךְ לְעֵץ צָעִיר."},{"id":"r4","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 9 \"בְּלִי לָדַעַת\"?","options":["כִּי הַסְּנָאִי שׁוֹכֵחַ אֵיפֹה הוּא גָּר","כִּי הַסְּנָאִי לֹא אוֹהֵב עֵצִים","כִּי הַסְּנָאִי לֹא יוֹדֵעַ לַחְפֹּר","כִּי הַסְּנָאִי לֹא מִתְכַּוֵּן לִשְׁתֹּל עֵצִים – זֶה קוֹרֶה בְּמִקְרֶה"],"answer":3,"exp":"הַסְּנָאִי קוֹבֵר אֱגוֹזִים בִּשְׁבִיל עַצְמוֹ. הָעֵצִים צוֹמְחִים מֵהָאֱגוֹזִים שֶׁשָּׁכַח – בְּלִי שֶׁהִתְכַּוֵּן."},{"id":"r5","sec":"read","p":0,"tag":"m","type":"mc","q":"מָה הָרַעֲיוֹן הֶחָשׁוּב שֶׁל שׁוּרוֹת 7–9?","options":["הַסְּנָאִי לֹא חָכָם","צָרִיךְ לִשְׁמֹר אֱגוֹזִים בַּבַּיִת","אֲפִלּוּ הַשִּׁכְחָה שֶׁל הַסְּנָאִי עוֹזֶרֶת לַטֶּבַע","סְנָאִים חַיִּים רַק בַּחֹרֶף"],"answer":2,"exp":"מֵהָאֱגוֹזִים שֶׁהַסְּנָאִי שָׁכַח צוֹמְחִים עֵצִים – כָּךְ הַשִּׁכְחָה שֶׁלּוֹ עוֹזֶרֶת לַיַּעַר."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיָה הַתַּחְבִּיב שֶׁל נֹעַם?","options":["אִסּוּף אֲבָנִים","רְכִיבָה עַל סוּסִים","כַּדּוּרֶגֶל","צִיּוּר"],"answer":0,"exp":"בְּשׁוּרָה 3 כָּתוּב שֶׁהַתַּחְבִּיב שֶׁל נֹעַם הָיָה אִסּוּף אֲבָנִים."},{"id":"r7","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה נֹעַם חָשַׁשׁ לְסַפֵּר עַל הַתַּחְבִּיב שֶׁלּוֹ?","options":["כִּי הַמּוֹרָה לֹא אָהֲבָה אֲבָנִים","כִּי לֹא הָיוּ לוֹ אֲבָנִים","כִּי חָשַׁב שֶׁהַיְּלָדִים יִצְחֲקוּ וְיַחְשְׁבוּ שֶׁזֶּה מְשַׁעֲמֵם","כִּי הוּא שָׁכַח אֶת הַקֻּפְסָה"],"answer":2,"exp":"בְּשׁוּרוֹת 3–4 נֹעַם חוֹשֵׁשׁ שֶׁיִּצְחֲקוּ, וְחוֹשֵׁב שֶׁאֲבָנִים זֶה \"הֲכִי מְשַׁעֲמֵם בָּעוֹלָם\"."},{"id":"r8","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"שְׁקוּפָה לְמֶחֱצָה\" (שׁוּרָה 6)?","options":["קַל לִשְׁבֹּר אוֹתָהּ","אֶפְשָׁר לִרְאוֹת דַּרְכָּהּ קְצָת, אֲבָל לֹא לְגַמְרֵי","כְּבֵדָה מְאוֹד","שְׁבוּרָה לִשְׁנֵי חֲצָאִים"],"answer":1,"exp":"\"לְמֶחֱצָה\" פֵּרוּשׁוֹ \"בְּחֵצִי\". אֶבֶן שְׁקוּפָה לְמֶחֱצָה – רוֹאִים דַּרְכָּהּ רַק קְצָת."},{"id":"r9","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אִמָּא אָמְרָה \"אִם תְּסַפֵּר אֶת הַסִּפּוּרִים, אַף אֶחָד לֹא יִשְׁתַּעֲמֵם\"?","options":["כִּי אִמָּא רָצְתָה לָבוֹא לַכִּתָּה","כִּי הַמּוֹרָה בִּקְּשָׁה סִפּוּרִים","כִּי לְנֹעַם לֹא הָיוּ אֲבָנִים יָפוֹת","כִּי הַסִּפּוּרִים עַל הָאֲבָנִים מְעַנְיְנִים יוֹתֵר מֵהָאֲבָנִים לְבַד"],"answer":3,"exp":"לְכָל אֶבֶן הָיָה סִפּוּר (שׁוּרָה 7), וְאִמָּא הֵבִינָה שֶׁהַסִּפּוּרִים יְעַנְיְנוּ אֶת הַיְּלָדִים."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה מַרְאָה שׁוּרָה 9 עַל נֹעַם?","options":["שֶׁהוּא הָיָה רָעֵב","שֶׁהוּא שָׂמֵחַ מְאוֹד","שֶׁהוּא הָיָה עָיֵף","שֶׁהוּא הָיָה לָחוּץ"],"answer":3,"exp":"כְּשֶׁמִּתְרַגְּשִׁים וּלְחוּצִים, הַיָּדַיִם לִפְעָמִים מַזִּיעוֹת."},{"id":"r11","sec":"read","p":1,"tag":"c","type":"mc","q":"אֵיךְ הִשְׁתַּנָּה מָה שֶׁנֹּעַם הִרְגִּישׁ, מִתְּחִלַּת הַסִּפּוּר וְעַד סוֹפוֹ?","options":["בַּהַתְחָלָה הוּא חָשַׁשׁ שֶׁיִּצְחֲקוּ, וּבַסּוֹף הַיְּלָדִים הִתְעַנְיְנוּ וְהוּא שָׁכַח מֵהַפַּחַד","הוּא פָּחַד כָּל הַזְּמַן","בַּהַתְחָלָה הוּא שָׂמֵחַ, וּבַסּוֹף הוּא פָּחַד","הוּא לֹא הִרְגִּישׁ שׁוּם דָּבָר מְיֻחָד"],"answer":0,"exp":"בַּהַתְחָלָה נֹעַם חָשַׁשׁ (שׁוּרָה 3), וּבְשׁוּרָה 12 הוּא \"כְּבָר שָׁכַח שֶׁפָּחַד\"."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֶּנֶת הַמּוֹרָה כְּשֶׁהִיא אוֹמֶרֶת \"נִצְטָרֵךְ עוֹד שִׁעוּר\" (שׁוּרָה 13)?","options":["שֶׁהִיא רוֹצָה לְלַמֵּד חֶשְׁבּוֹן","שֶׁנֹּעַם דִּבֵּר לְאַט מִדַּי","שֶׁהַסִּפּוּרִים שֶׁל נֹעַם מְעַנְיְנִים, וְכֻלָּם רוֹצִים לִשְׁמֹעַ עוֹד","שֶׁהַשִּׁעוּר הָיָה מְשַׁעֲמֵם"],"answer":2,"exp":"לֹא נִשְׁאַר זְמַן לְכָל הַסִּפּוּרִים, וְהַמּוֹרָה רוֹצֶה לִשְׁמֹעַ עוֹד – כִּי זֶה הָיָה מְעַנְיֵן."},{"type":"open","tag":"calc","expr":"39 + 58 = ___","answer":97,"exp":"⁦39 + 58 = 97⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"52 − 34 = ___","answer":18,"exp":"⁦52 − 34 = 18⁩. בְּדִיקָה: ⁦18 + 34 = 52⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"6 × 7 = ___","answer":42,"exp":"⁦6 × 7 = 42⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"48 : 8 = ___","answer":6,"exp":"⁦48 : 8 = 6⁩, כִּי ⁦8 × 6 = 48⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 41 = 65","answer":24,"exp":"⁦65 − 41 = 24⁩, וְלָכֵן ⁦24 + 41 = 65⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"95 − ___ = 77","answer":18,"exp":"⁦95 − 77 = 18⁩, וְלָכֵן ⁦95 − 18 = 77⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"7 × ___ = 30 + 33","answer":9,"exp":"⁦30 + 33 = 63⁩, ו־⁦7 × 9 = 63⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"56 + 26 > 26 + ___","min":0,"max":55,"exp":"⁦56 + 26⁩ זֶה כְּמוֹ ⁦26 + 56⁩. צָרִיךְ מִסְפָּר קָטָן מ־56, לְמָשָׁל 55.","answer":55,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△1 + 1△ = 55","options":["⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 4: 41 + 14 = 55⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△△ − △ = 90","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":3,"exp":"נְצִיב ⁦△ = 9: 99 − 9 = 90⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["circle","circle"],8],[["circle","star"],10],[["star","square"],13]],"ask":["square"]},"options":["6","7","8","9"],"answer":1,"exp":"שְׁנֵי עִגּוּלִים = 8, אָז עִגּוּל = 4. כּוֹכָב = ⁦10 − 4 = 6⁩. רִבּוּעַ = ⁦13 − 6 = 7⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"עוּגִיָּה עוֹלָה 8 ₪, וְשׁוֹקוֹ עוֹלֶה 9 ₪. רוֹעִי קָנָה 2 עוּגִיּוֹת וְשׁוֹקוֹ אֶחָד. כַּמָּה שִׁלֵּם?","options":["17","25","26","34"],"answer":1,"exp":"2 עוּגִיּוֹת: ⁦8 + 8 = 16⁩. וְעוֹד שׁוֹקוֹ: ⁦16 + 9 = 25⁩ ₪.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"אֲרִיאֵל קוֹרֵא סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרָא 7 עַמּוּדִים. בְּכָל יוֹם הוּא קָרָא 2 עַמּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרָא בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["11","21","23","27"],"answer":3,"exp":"יוֹם ⁦1: 7⁩, יוֹם ⁦2: 9⁩, יוֹם ⁦3: 11⁩. בְּיַחַד: 27.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"31 יְלָדִים יוֹצְאִים לְטִיּוּל. בְּכָל מְכוֹנִית יֵשׁ מָקוֹם ל־4 יְלָדִים. כַּמָּה מְכוֹנִיּוֹת צָרִיךְ כְּדֵי שֶׁכָּל הַיְּלָדִים יִסְּעוּ?","options":["7","8","9","10"],"answer":1,"exp":"ב־7 מְכוֹנִיּוֹת יֵשׁ מָקוֹם ל־28 יְלָדִים, וְנִשְׁאָרִים עוֹד 3. לָכֵן צָרִיךְ עוֹד מְכוֹנִית: 8.","id":"m14","sec":"math"}]},{"n":21,"level":"מאתגר","printable":true,"passages":[{"kind":"info","title":"שׁוּנִית הָאַלְמֻגִּים","lines":["בְּמִפְרַץ אֵילַת, מִתַּחַת לִפְנֵי הַמַּיִם, יֵשׁ עוֹלָם צִבְעוֹנִי וּמְיֻחָד: שׁוּנִית הָאַלְמֻגִּים.","בְּמַבָּט רִאשׁוֹן הָאַלְמֻגִּים נִרְאִים כְּמוֹ אֲבָנִים אוֹ כְּמוֹ צְמָחִים, אֲבָל הֵם בְּעֶצֶם בַּעֲלֵי חַיִּים.","כָּל אַלְמֹג בָּנוּי מֵהַרְבֵּה יְצוּרִים זְעִירִים, שֶׁחַיִּים יַחַד, צְמוּדִים זֶה לָזֶה.","הַיְּצוּרִים הָאֵלֶּה בּוֹנִים סְבִיבָם שֶׁלֶד קָשֶׁה מִגִּיר, וְכָךְ, לְאַט לְאַט, הַשּׁוּנִית גְּדֵלָה.","הַשּׁוּנִית גְּדֵלָה לְאַט מְאוֹד: בְּכָל שָׁנָה רַק כַּמָּה סֶנְטִימֶטְרִים.","בַּשּׁוּנִית מוֹצְאִים מַחֲסֶה וּמָזוֹן אַלְפֵי סוּגִים שֶׁל דָּגִים, סַרְטָנִים, צְדָפוֹת וְכוֹכְבֵי יָם.","לָכֵן יֵשׁ מִי שֶׁקּוֹרְאִים לַשּׁוּנִית \"עִיר מִתַּחַת לַמַּיִם\": יֵשׁ בָּהּ הֲמוֹן תּוֹשָׁבִים, וְכָל אֶחָד מוֹצֵא בָּהּ אֶת מְקוֹמוֹ.","אֲבָל הָאַלְמֻגִּים רְגִישִׁים מְאוֹד. כְּשֶׁהַמַּיִם מִתְחַמְּמִים אוֹ מִתְלַכְלְכִים, הֵם עֲלוּלִים לְהַלְבִּין וְלָמוּת.","גַּם צוֹלְלָנִים יְכוֹלִים לִפְגֹּעַ בָּהֶם בְּלִי כַּוָּנָה, אִם הֵם נוֹגְעִים בָּהֶם אוֹ עוֹמְדִים עֲלֵיהֶם.","לָכֵן בִּשְׁמוּרַת הָאַלְמֻגִּים בְּאֵילַת אָסוּר לָגַעַת בָּאַלְמֻגִּים, וְאָסוּר לָקַחַת מֵהֶם מַזְכֶּרֶת."]},{"kind":"story","title":"הַשְּׁכוּנָה שֶׁל כֻּלָּנוּ","lines":["הַמּוֹרָה חִלְּקָה אֶת הַכִּתָּה לִקְבוּצוֹת שֶׁל אַרְבָּעָה יְלָדִים, וְנָתְנָה לְכָל קְבוּצָה מְשִׂימָה: לִבְנוֹת דֶּגֶם שֶׁל שְׁכוּנָה.","שִׁירָה שָׂמְחָה מְאוֹד. הִיא אָהֲבָה לִבְנוֹת, וְהָיָה לָהּ כְּבָר רַעְיוֹן מוּכָן בָּרֹאשׁ.","\"אֲנִי אֶבְנֶה אֶת הַבָּתִּים, אֲנִי אֶצְבַּע אֶת הַכְּבִישׁ, וַאֲנִי אֲסַדֵּר אֶת הָעֵצִים,\" הִכְרִיזָה.","\"וּמָה נַעֲשֶׂה אֲנַחְנוּ?\" שָׁאַל עֹמֶר. \"אַתֶּם תַּחְזִיקוּ אֶת הַדֶּבֶק,\" עָנְתָה שִׁירָה.","עֹמֶר, עִנְבָּל וְעִילַּי הִסְתַּכְּלוּ זֶה עַל זֶה וְשָׁתְקוּ. אַחֲרֵי כַּמָּה דַּקּוֹת כָּל אֶחָד מֵהֶם הָלַךְ לַעֲשׂוֹת מַשֶּׁהוּ אַחֵר.","שִׁירָה עָבְדָה לְבַד שְׁלוֹשָׁה יָמִים. הִיא הָיְתָה עֲיֵפָה, וְהַדֶּגֶם הִתְקַדֵּם לְאַט מְאוֹד.","בַּיּוֹם הָרְבִיעִי הִיא רָאֲתָה אֶת הַקְּבוּצָה שֶׁל יוֹאָב: כָּל יֶלֶד בָּנָה חֵלֶק אַחֵר, וְהֵם צָחֲקוּ וְדִבְּרוּ בִּזְמַן הָעֲבוֹדָה.","הַדֶּגֶם שֶׁלָּהֶם כִּמְעַט נִגְמַר. הָיָה בּוֹ אֲפִלּוּ גַּן מִשְׂחָקִים קָטָן, עִם נַדְנֵדוֹת שֶׁזָּזוּ.","שִׁירָה הִסְתַּכְּלָה עַל הַדֶּגֶם שֶׁלָּהּ, שֶׁעֲדַיִן הָיָה חֲצִי רֵיק, וּפִתְאוֹם הֵבִינָה מַשֶּׁהוּ.","הִיא חָזְרָה אֶל הַקְּבוּצָה שֶׁלָּהּ. \"אֲנִי צְרִיכָה עֶזְרָה,\" אָמְרָה בְּשֶׁקֶט. \"וְגַם – סְלִיחָה.\"","עֹמֶר חִיֵּךְ. \"אֲנִי טוֹב בִּדְבָרִים שֶׁזָּזִים. אוּלַי אֶבְנֶה מְכוֹנִית שֶׁנּוֹסַעַת?\"","עִנְבָּל הִצִּיעָה לְצַיֵּר שְׁלָטִים לָרְחוֹבוֹת, וְעִילַּי הֵבִיא מֵהַבַּיִת קֻפְסָאוֹת רֵיקוֹת לְבִנְיָנִים גְּבוֹהִים.","תּוֹךְ יוֹמַיִם הַדֶּגֶם הִתְמַלֵּא: רְחוֹבוֹת עִם שֵׁמוֹת, מִגְדָּלִים, וּמְכוֹנִית אֲדֻמָּה שֶׁנָּסְעָה עַל חוּט.","כְּשֶׁהִצִּיגוּ אֶת הַדֶּגֶם לַכִּתָּה, שִׁירָה אָמְרָה: \"אֶת הָרַעֲיוֹן הָיָה לִי, אֲבָל אֶת הַשְּׁכוּנָה בָּנִינוּ כֻּלָּנוּ.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"בְּמַבָּט רִאשׁוֹן\" (שׁוּרָה 2)?","options":["כְּשֶׁמִּסְתַּכְּלִים דֶּרֶךְ מְשַׁקֶּפֶת","בַּפַּעַם הָרִאשׁוֹנָה בַּחַיִּים","כְּשֶׁמִּסְתַּכְּלִים מִלְּמַעְלָה","כְּשֶׁרַק מַתְחִילִים לְהִסְתַּכֵּל, לִפְנֵי שֶׁבּוֹדְקִים הֵיטֵב"],"answer":3,"exp":"בְּמַבָּט רִאשׁוֹן הָאַלְמֻגִּים נִרְאִים כְּמוֹ אֲבָנִים, אֲבָל כְּשֶׁבּוֹדְקִים הֵיטֵב מְגַלִּים שֶׁהֵם בַּעֲלֵי חַיִּים."},{"id":"r2","sec":"read","p":0,"tag":"d","type":"mc","q":"מִמָּה בָּנוּי הַשֶּׁלֶד שֶׁל הָאַלְמֻגִּים?","options":["מֵעוֹר","מָחוֹל","מִגִּיר","מַעֲצִים"],"answer":2,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁהַיְּצוּרִים בּוֹנִים סְבִיבָם שֶׁלֶד קָשֶׁה מִגִּיר."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה קוֹרְאִים לַשּׁוּנִית \"עִיר מִתַּחַת לַמַּיִם\"?","options":["כִּי הִיא קְרוֹבָה לָעִיר אֵילַת","כִּי יֵשׁ בָּהּ בָּתִּים וּרְחוֹבוֹת","כִּי חַיִּים בָּהּ הֲמוֹן בַּעֲלֵי חַיִּים, כְּמוֹ אֲנָשִׁים בָּעִיר","כִּי הִיא בְּנוּיָה מֵאֲבָנִים"],"answer":2,"exp":"בְּשׁוּרָה 7 כָּתוּב שֶׁיֵּשׁ בְּשׁוּנִית הֲמוֹן תּוֹשָׁבִים, וְכָל אֶחָד מוֹצֵא בָּהּ אֶת מְקוֹמוֹ – כְּמוֹ בָּעִיר."},{"id":"r4","sec":"read","p":0,"tag":"i","type":"mc","q":"לְפִי הַקֶּטַע, מָה יָכוֹל לִגְרֹם לָאַלְמֻגִּים לָמוּת?","options":["הַגְּדִילָה הָאִטִּית שֶׁלָּהֶם","הַגִּיר שֶׁבַּשֶּׁלֶד שֶׁלָּהֶם","דָּגִים שֶׁמּוֹצְאִים בְּשׁוּנִית מָזוֹן","מַיִם שֶׁמִּתְחַמְּמִים אוֹ מִתְלַכְלְכִים"],"answer":3,"exp":"בְּשׁוּרָה 8 כָּתוּב שֶׁכְּשֶׁהַמַּיִם מִתְחַמְּמִים אוֹ מִתְלַכְלְכִים, הָאַלְמֻגִּים עֲלוּלִים לָמוּת."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["כַּמָּה שָׁנִים יָכוֹל אַלְמוֹג לִחְיוֹת?","כַּמָּה גְּדֵלָה הַשּׁוּנִית בְּכָל שָׁנָה?","מָה עָלוּל לִקְרוֹת לְאַלְמֻגִּים כְּשֶׁהַמַּיִם מִתְלַכְלְכִים?","אֵיפֹה יֵשׁ שׁוּנִית אַלְמֻגִּים בְּיִשְׂרָאֵל?"],"answer":0,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה שָׁנִים חַי אַלְמוֹג."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה הָיְתָה הַמְּשִׂימָה שֶׁל הַקְּבוּצוֹת?","options":["לִכְתֹּב סִפּוּר עַל הַשְּׁכוּנָה","לִבְנוֹת דֶּגֶם שֶׁל שְׁכוּנָה","לְסַדֵּר אֶת הַכִּתָּה","לְצַיֵּר מַפָּה שֶׁל הָעִיר"],"answer":1,"exp":"בְּשׁוּרָה 1 כָּתוּב שֶׁהַמְּשִׂימָה הָיְתָה לִבְנוֹת דֶּגֶם שֶׁל שְׁכוּנָה."},{"id":"r7","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"הִכְרִיזָה\" (שׁוּרָה 3)?","options":["כַּתָּבָה עַל הַלּוּחַ","בָּכְתָה","אָמְרָה בְּקוֹל, כְּמוֹ הוֹדָעָה לְכֻלָּם","שָׁאֲלָה בְּשֶׁקֶט"],"answer":2,"exp":"שִׁירָה הִכְרִיזָה – הוֹדִיעָה לְכֻלָּם בְּקוֹל מָה הִיא תַּעֲשֶׂה."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לְהָבִין מִכָּךְ שֶׁעֹמֶר, עִנְבָּל וְעִילַּי \"הִסְתַּכְּלוּ זֶה עַל זֶה וְשָׁתְקוּ\" (שׁוּרָה 5)?","options":["שֶׁהֵם לֹא הָיוּ מְרֻצִּים מִמָּה שֶׁשִּׁירָה אָמְרָה","שֶׁהֵם לֹא שָׁמְעוּ אֶת שִׁירָה","שֶׁהֵם שָׂמְחוּ מְאוֹד","שֶׁהֵם הָיוּ עֲיֵפִים"],"answer":0,"exp":"שִׁירָה הִשְׁאִירָה לָהֶם רַק לְהַחֲזִיק אֶת הַדֶּבֶק. הֵם לֹא אָהֲבוּ אֶת זֶה, וְלָכֵן שָׁתְקוּ וְהָלְכוּ."},{"id":"r9","sec":"read","p":1,"tag":"c","type":"mc","q":"מֶה הָיָה שׁוֹנֶה בַּקְּבוּצָה שֶׁל יוֹאָב מֵהַקְּבוּצָה שֶׁל שִׁירָה?","options":["בַּקְּבוּצָה שֶׁל יוֹאָב הָיוּ יוֹתֵר יְלָדִים","בַּקְּבוּצָה שֶׁל יוֹאָב רַק יֶלֶד אֶחָד עָבַד","הַקְּבוּצָה שֶׁל יוֹאָב לֹא בָּנְתָה דֶּגֶם","בַּקְּבוּצָה שֶׁל יוֹאָב כָּל יֶלֶד בָּנָה חֵלֶק, וְכֻלָּם עָבְדוּ יַחַד"],"answer":3,"exp":"בְּשׁוּרָה 7: בַּקְּבוּצָה שֶׁל יוֹאָב כָּל יֶלֶד בָּנָה חֵלֶק אַחֵר. אֵצֶל שִׁירָה – רַק הִיא עָבְדָה."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה שִׁירָה הֵבִינָה \"פִּתְאוֹם\" (שׁוּרָה 9)?","options":["שֶׁהַדֶּגֶם שֶׁל יוֹאָב לֹא יָפֶה","שֶׁכְּשֶׁעוֹבְדִים יַחַד מַצְלִיחִים יוֹתֵר מֵאֲשֶׁר לְבַד","שֶׁצָּרִיךְ יוֹתֵר דֶּבֶק","שֶׁהִיא צְרִיכָה לַעֲבֹר לַקְּבוּצָה שֶׁל יוֹאָב"],"answer":1,"exp":"הִיא רָאֲתָה שֶׁהַקְּבוּצָה שֶׁל יוֹאָב עָבְדָה יַחַד וְהִתְקַדְּמָה מַהֵר, וְהֵבִינָה שֶׁהִיא צְרִיכָה אֶת חַבְרֵי הַקְּבוּצָה."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה שִׁירָה אָמְרָה גַּם \"סְלִיחָה\"?","options":["כִּי הִיא שָׁבְרָה אֶת הַדֶּגֶם","כִּי הִיא הֵבִינָה שֶׁלֹּא נָתְנָה לַחֲבֵרִים שֶׁלָּהּ לְהִשְׁתַּתֵּף","כִּי הִיא אִחֲרָה לַשִּׁעוּר","כִּי הִיא לָקְחָה אֶת הַדֶּבֶק שֶׁל עֹמֶר"],"answer":1,"exp":"שִׁירָה הֵבִינָה שֶׁהִיא לָקְחָה אֶת כָּל הָעֲבוֹדָה לְעַצְמָהּ, וְלֹא נָתְנָה לַאֲחֵרִים לַעֲזֹר."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה מְלַמֵּד הַמִּשְׁפָּט הָאַחֲרוֹן שֶׁל שִׁירָה (שׁוּרָה 14)?","options":["שֶׁהִיא מְבִינָה שֶׁהַהַצְלָחָה שַׁיֶּכֶת לְכָל הַקְּבוּצָה","שֶׁהִיא לֹא אוֹהֶבֶת אֶת הַדֶּגֶם","שֶׁהִיא רוֹצָה לַעֲבֹד לְבַד בַּפַּעַם הַבָּאָה","שֶׁהָרַעֲיוֹן הָיָה שֶׁל עֹמֶר"],"answer":0,"exp":"\"אֶת הַשְּׁכוּנָה בָּנִינוּ כֻּלָּנוּ\" – שִׁירָה מְבִינָה שֶׁכֻּלָּם עָבְדוּ, וְהַהַצְלָחָה שֶׁל כֻּלָּם."},{"type":"open","tag":"calc","expr":"38 + 29 = ___","answer":67,"exp":"⁦38 + 29 = 67⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"40 − 16 = ___","answer":24,"exp":"⁦40 − 16 = 24⁩. בְּדִיקָה: ⁦24 + 16 = 40⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"5 × 7 = ___","answer":35,"exp":"⁦5 × 7 = 35⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"35 : 7 = ___","answer":5,"exp":"⁦35 : 7 = 5⁩, כִּי ⁦7 × 5 = 35⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 42 = 63","answer":21,"exp":"⁦63 − 42 = 21⁩, וְלָכֵן ⁦21 + 42 = 63⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"80 − ___ = 26","answer":54,"exp":"⁦80 − 26 = 54⁩, וְלָכֵן ⁦80 − 54 = 26⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"8 × ___ = 10 + 38","answer":6,"exp":"⁦10 + 38 = 48⁩, ו־⁦8 × 6 = 48⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"26 + 11 < 25 + ___","min":13,"max":999,"exp":"בְּצַד יָמִין יֵשׁ 25, אֶחָד פָּחוֹת מ־26. לָכֵן צָרִיךְ מִסְפָּר גָּדוֹל מ־12, לְמָשָׁל 13.","answer":13,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△△ − △ = 40","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":1,"exp":"נְצִיב ⁦△ = 4: 44 − 4 = 40⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△7 − 1△ = 33","options":["⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 4: 47 − 14 = 33⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["square","square"],18],[["square","heart"],14],[["heart","circle"],12]],"ask":["circle"]},"options":["6","7","8","9"],"answer":1,"exp":"שְׁנֵי רִבּוּעִים = 18, אָז רִבּוּעַ = 9. לֵב = ⁦14 − 9 = 5⁩. עִגּוּל = ⁦12 − 5 = 7⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"טַלְיָה סִדְּרָה כִּסְּאוֹת ב־4 שׁוּרוֹת, וּבְכָל שׁוּרָה 7 כִּסְּאוֹת. אַחַר כָּךְ הֵבִיאָה עוֹד 4 כִּסְאוֹת. כַּמָּה כִּסְאוֹת יֵשׁ בְּסַךְ הַכֹּל?","options":["15","28","32","44"],"answer":2,"exp":"⁦4 × 7 = 28⁩, וְעוֹד ⁦4: 32⁩.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"אֲבִיגַיִל חוֹסֶכֶת 4 ₪ בְּכָל שָׁבוּעַ. אַחֲרֵי כַּמָּה שָׁבוּעוֹת יִהְיוּ לָהּ 20 ₪?","options":["4","5","6","16"],"answer":1,"exp":"⁦4 × 5 = 20⁩, לָכֵן אַחֲרֵי 5 שָׁבוּעוֹת.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בֶּחָצֵר שֶׁל עִדּוֹ יֵשׁ 7 תַּרְנְגוֹלוֹת ו־5 כְּלָבִים. כַּמָּה רַגְלַיִם יֵשׁ לְכֻלָּם יַחַד?","options":["12","24","34","48"],"answer":2,"exp":"לְתַרְנְגֹלֶת 2 רַגְלַיִם: ⁦7 × 2 = 14⁩. לַכֶּלֶב 4 רַגְלַיִם: ⁦5 × 4 = 20⁩. בְּיַחַד: 34.","id":"m14","sec":"math"}]},{"n":22,"level":"מאתגר","printable":true,"passages":[{"kind":"info","title":"הַבּוֹנֶה","lines":["הַבּוֹנֶה הוּא מְכַרְסֵם גָּדוֹל שֶׁחַי לְיַד נְהָרוֹת וַאֲגַמִּים, בִּצְפוֹן אָמֵרִיקָה וּבְאֵירוֹפָּה.","יֵשׁ לוֹ שִׁנַּיִם חֲזָקוֹת וְחַדּוֹת, שֶׁלֹּא מַפְסִיקוֹת לִגְדֹּל כָּל הַחַיִּים.","בְּעֶזְרַת הַשִּׁנַּיִם הוּא מְכַרְסֵם גְּזָעִים שֶׁל עֵצִים, עַד שֶׁהָעֵץ נוֹפֵל.","מֵהָעֲנָפִים, מֵהַבֹּץ וּמֵהָאֲבָנִים הַבּוֹנֶה בּוֹנֶה סֶכֶר: קִיר שֶׁחוֹסֵם אֶת הַנָּהָר.","מֵאֲחוֹרֵי הַסֶּכֶר הַמַּיִם נֶעֱצָרִים, וְנוֹצֶרֶת בְּרֵכָה שְׁקֵטָה וַעֲמֻקָּה.","בְּאֶמְצַע הַבְּרֵכָה הַבּוֹנֶה בּוֹנֶה אֶת הַבַּיִת שֶׁלּוֹ, וְהַכְּנִיסָה לַבַּיִת נִמְצֵאת מִתַּחַת לַמַּיִם.","כָּךְ קָשֶׁה לְטוֹרְפִים, כְּמוֹ זְאֵבִים, לְהִכָּנֵס פְּנִימָה.","הַסֶּכֶר עוֹזֵר גַּם לְבַעֲלֵי חַיִּים אֲחֵרִים: בַּבְּרֵכָה מִתְיַשְּׁבִים דָּגִים, צְפַרְדֵּעִים וְצִפּוֹרֵי מַיִם.","אֲבָל לִפְעָמִים הַסֶּכֶר גּוֹרֵם לַהֲצָפָה שֶׁל שָׂדוֹת וּדְרָכִים, וְאָז הָאֲנָשִׁים שֶׁגָּרִים בַּסְּבִיבָה לֹא מְרֻצִּים.","בִּזְכוּת הָעֲבוֹדָה הַקָּשָׁה שֶׁלּוֹ, בִּמְקוֹמוֹת רַבִּים אוֹמְרִים עַל אָדָם חָרוּץ: \"הוּא עוֹבֵד כְּמוֹ בּוֹנֶה\"."]},{"kind":"story","title":"הַשַּׂחְקָן מֵהַסַּפְסָל","lines":["יוֹנָתָן הִצְטָרֵף הַשָּׁנָה לִקְבוּצַת הַכַּדּוּרְסַל שֶׁל הַשְּׁכוּנָה, וְהָיָה מְאֻשָּׁר.","אֲבָל בַּמִּשְׂחָקִים הוּא כִּמְעַט לֹא שִׂחֵק. הַמְּאַמֵּן שָׁלַח אוֹתוֹ לַסַּפְסָל, וְנָתַן לְשַׂחְקָנִים אֲחֵרִים לְשַׂחֵק.","מִשְׂחָק אַחֲרֵי מִשְׂחָק יוֹנָתָן יָשַׁב עַל הַסַּפְסָל וְחִכָּה, וְהַתִּסְכּוּל שֶׁלּוֹ גָּדַל.","\"אֲנִי הֲכִי גָּרוּעַ בַּקְּבוּצָה,\" אָמַר לְאַבָּא בַּדֶּרֶךְ הַבַּיְתָה. \"אוּלַי עָדִיף שֶׁאֶפְרֹשׁ.\"","אַבָּא לֹא עָנָה מִיָּד. \"לִפְנֵי שֶׁתַּחְלִיט,\" אָמַר לְבַסּוֹף, \"אוּלַי תִּשְׁאַל אֶת הַמְּאַמֵּן מָה הוּא חוֹשֵׁב?\"","לְמָחֳרָת, אַחֲרֵי הָאִמּוּן, יוֹנָתָן נִגַּשׁ אֶל הַמְּאַמֵּן. הַקּוֹל שֶׁלּוֹ כִּמְעַט נֶעֱלַם.","\"לָמָּה אֲנִי אַף פַּעַם לֹא מְשַׂחֵק?\" שָׁאַל.","הַמְּאַמֵּן הֵנִיחַ לוֹ יָד עַל הַכָּתֵף. \"אַתָּה קוֹלֵעַ טוֹב,\" אָמַר, \"אֲבָל אַתָּה מְפַחֵד לְקַבֵּל אֶת הַכַּדּוּר כְּשֶׁיֵּשׁ לַחַץ.\"","\"אִם תִּתְאַמֵּן עַל זֶה, תְּקַבֵּל הִזְדַּמְּנוּת. אֲנִי מַבְטִיחַ.\"","בַּשָּׁבוּעוֹת הַבָּאִים יוֹנָתָן נִשְׁאַר אַחֲרֵי כָּל אִמּוּן עוֹד רֶבַע שָׁעָה. הֶחָבֵר שֶׁלּוֹ, תָּמָר, זָרַק לוֹ כַּדּוּרִים חֲזָקִים, שׁוּב וָשׁוּב.","בַּהַתְחָלָה הַכַּדּוּר נִשְׁמַט לוֹ מֵהַיָּדַיִם, אֲבָל לְאַט לְאַט הַיָּדַיִם שֶׁלּוֹ נַעֲשׂוּ בְּטוּחוֹת.","בַּמִּשְׂחָק הָאַחֲרוֹן שֶׁל הָעוֹנָה, כְּשֶׁנִּשְׁאֲרוּ שְׁתֵּי דַּקּוֹת, הַמְּאַמֵּן קָרָא: \"יוֹנָתָן, אַתָּה נִכְנָס!\"","הַקְּבוּצָה שֶׁלָּהֶם הָיְתָה בְּפִגּוּר שֶׁל נְקֻדָּה אַחַת. הַכַּדּוּר הִגִּיעַ אֶל יוֹנָתָן – וְהוּא תָּפַס אוֹתוֹ חָזָק, הִסְתּוֹבֵב וְזָרַק.","הַכַּדּוּר הִסְתּוֹבֵב עַל הַטַּבַּעַת... וְנִכְנַס. כָּל הַסַּפְסָל קָפַץ וְצָעַק.","בַּדֶּרֶךְ הַבַּיְתָה יוֹנָתָן אָמַר לְאַבָּא: \"טוֹב שֶׁלֹּא פָּרַשְׁתִּי.\""]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"מִמָּה הַבּוֹנֶה בּוֹנֶה אֶת הַסֶּכֶר?","options":["מִקֶּרַח","מֵעֲנָפִים, מִבֹּץ וּמֵאֲבָנִים","מַעֲלִים יְבֵשִׁים בִּלְבַד","מֵחוֹל וּמִמַּיִם"],"answer":1,"exp":"בְּשׁוּרָה 4 כָּתוּב שֶׁהַבּוֹנֶה בּוֹנֶה סֶכֶר מֵעֲנָפִים, מִבֹּץ וּמֵאֲבָנִים."},{"id":"r2","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה הַכְּנִיסָה לַבַּיִת שֶׁל הַבּוֹנֶה נִמְצֵאת מִתַּחַת לַמַּיִם?","options":["כִּי הַבּוֹנֶה לֹא יוֹדֵעַ לָלֶכֶת","כְּדֵי לִשְׁמֹר עַל הַדָּגִים","כְּדֵי שֶׁיִּהְיֶה קָשֶׁה לַטּוֹרְפִים לְהִכָּנֵס","כְּדֵי שֶׁיִּהְיֶה קַר בַּבַּיִת"],"answer":2,"exp":"בְּשׁוּרָה 7 כָּתוּב: \"כָּךְ קָשֶׁה לְטוֹרְפִים, כְּמוֹ זְאֵבִים, לְהִכָּנֵס פְּנִימָה\"."},{"id":"r3","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"חָרוּץ\" (שׁוּרָה 10)?","options":["עַצְלָן","מִי שֶׁעוֹבֵד קָשֶׁה וְלֹא מְוַתֵּר","כּוֹעֵס","מָהִיר בְּרִיצָה"],"answer":1,"exp":"אָדָם חָרוּץ עוֹבֵד קָשֶׁה – כְּמוֹ הַבּוֹנֶה, שֶׁבּוֹנֶה סֶכֶר שָׁלֵם."},{"id":"r4","sec":"read","p":0,"tag":"c","type":"mc","q":"מָה טוֹב בַּסֶּכֶר שֶׁל הַבּוֹנֶה, וּמָה יָכוֹל לִהְיוֹת בּוֹ בְּעָיָתִי?","options":["הוּא חָזָק, אֲבָל נִשְׁבַּר כָּל יוֹם","הוּא יָפֶה, אֲבָל רוֹעֵשׁ","הוּא עוֹזֵר לַאֲנָשִׁים, אֲבָל מְגָרֵשׁ אֶת הַדָּגִים","הוּא עוֹזֵר לְבַעֲלֵי חַיִּים אֲחֵרִים, אֲבָל לִפְעָמִים מֵצִיף שָׂדוֹת וּדְרָכִים"],"answer":3,"exp":"בְּשׁוּרָה 8 – הַסֶּכֶר עוֹזֵר לְבַעֲלֵי חַיִּים. בְּשׁוּרָה 9 – לִפְעָמִים הוּא גּוֹרֵם לַהֲצָפָה."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["אֵילוּ בַּעֲלֵי חַיִּים נֶהֱנִים מֵהַבְּרֵכָה?","אֵיפֹה נִמְצֵאת הַכְּנִיסָה לַבַּיִת שֶׁל הַבּוֹנֶה?","כַּמָּה שָׁנִים חַי בּוֹנֶה?","מָה הַבּוֹנֶה עוֹשֶׂה עִם הַשִּׁנַּיִם שֶׁלּוֹ?"],"answer":2,"exp":"הַקֶּטַע לֹא מְסַפֵּר כַּמָּה שָׁנִים חַי בּוֹנֶה."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מֶה עָשָׂה הַמְּאַמֵּן בַּמִּשְׂחָקִים?","options":["שָׁלַח אֶת יוֹנָתָן לַסַּפְסָל, וְנָתַן לַאֲחֵרִים לְשַׂחֵק","בִּטֵּל אֶת הַמִּשְׂחָקִים","בִּקֵּשׁ מִיּוֹנָתָן לַעֲזֹב אֶת הַקְּבוּצָה","נָתַן לְיוֹנָתָן לְשַׂחֵק כָּל הַזְּמַן"],"answer":0,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁהַמְּאַמֵּן שָׁלַח אֶת יוֹנָתָן לַסַּפְסָל."},{"id":"r7","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"אֶפְרֹשׁ\" (שׁוּרָה 4)?","options":["אֲנַצֵּחַ","אֶקְלַע לַסַּל","אֶתְאַמֵּן יוֹתֵר","אֶעֱזֹב, וְלֹא אַמְשִׁיךְ לְהִשְׁתַּתֵּף"],"answer":3,"exp":"לִפְרֹשׁ פֵּרוּשׁוֹ לַעֲזֹב. יוֹנָתָן חָשַׁב לַעֲזֹב אֶת הַקְּבוּצָה."},{"id":"r8","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אַבָּא הִצִּיעַ לְיוֹנָתָן לִשְׁאֹל אֶת הַמְּאַמֵּן?","options":["כְּדֵי שֶׁיּוֹנָתָן יָבִין אֶת הַסִּבָּה, לִפְנֵי שֶׁהוּא מַחֲלִיט לִפְרֹשׁ","כִּי אַבָּא לֹא אוֹהֵב כַּדּוּרְסַל","כִּי אַבָּא רָצָה לִהְיוֹת מְאַמֵּן","כְּדֵי שֶׁהַמְּאַמֵּן יִכְעַס"],"answer":0,"exp":"אַבָּא אָמַר \"לִפְנֵי שֶׁתַּחְלִיט\" – כְּדַאי לְבָרֵר קֹדֶם מָה הַמְּאַמֵּן חוֹשֵׁב."},{"id":"r9","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לְהָבִין מֵהַמִּשְׁפָּט \"הַקּוֹל שֶׁלּוֹ כִּמְעַט נֶעֱלַם\" (שׁוּרָה 6)?","options":["שֶׁהָיָה רַעַשׁ בָּאוּלָם","שֶׁיּוֹנָתָן הָיָה נָבוֹךְ וְלָחוּץ","שֶׁיּוֹנָתָן שֵׁר הַרְבֵּה","שֶׁיּוֹנָתָן הָיָה חוֹלֶה"],"answer":1,"exp":"כְּשֶׁמִּתְבַּיְּשִׁים אוֹ לְחוּצִים, לִפְעָמִים הַקּוֹל נַעֲשֶׂה חַלָּשׁ מְאוֹד."},{"id":"r10","sec":"read","p":1,"tag":"d","type":"mc","q":"לְפִי הַמְּאַמֵּן, מֶה הָיְתָה הַבְּעָיָה שֶׁל יוֹנָתָן?","options":["הוּא לֹא הִגִּיעַ לְאִמּוּנִים","הוּא לֹא יָדַע לִקְלֹעַ","הוּא הָיָה אִטִּי מִדַּי","הוּא פָּחַד לְקַבֵּל אֶת הַכַּדּוּר כְּשֶׁיֵּשׁ לַחַץ"],"answer":3,"exp":"בְּשׁוּרָה 8 הַמְּאַמֵּן אוֹמֵר: \"אַתָּה קוֹלֵעַ טוֹב, אֲבָל אַתָּה מְפַחֵד לְקַבֵּל אֶת הַכַּדּוּר כְּשֶׁיֵּשׁ לַחַץ\"."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה תָּמָר זָרַק לְיוֹנָתָן כַּדּוּרִים חֲזָקִים?","options":["כְּדֵי שֶׁיּוֹנָתָן יִתְרַגֵּל לִתְפֹּס כַּדּוּר גַּם בְּלַחַץ","כְּדֵי לְנַצֵּחַ אוֹתוֹ","כִּי תָּמָר כָּעַס עָלָיו","כִּי הַמְּאַמֵּן רָצָה לְהַעֲנִישׁ אוֹתוֹ"],"answer":0,"exp":"זֶה הָאִמּוּן שֶׁיּוֹנָתָן הָיָה צָרִיךְ – לִתְפֹּס כַּדּוּר קָשֶׁה, שׁוּב וָשׁוּב, עַד שֶׁהַיָּדַיִם נַעֲשׂוּ בְּטוּחוֹת."},{"id":"r12","sec":"read","p":1,"tag":"m","type":"mc","q":"מָה לָמַד יוֹנָתָן?","options":["שֶׁכַּדּוּרְסַל הוּא מִשְׂחָק מְשַׁעֲמֵם","שֶׁהַמְּאַמֵּן תָּמִיד צוֹדֵק","שֶׁכְּדַאי לְבָרֵר וּלְהִתְאַמֵּן, בִּמְקוֹם לְוַתֵּר","שֶׁכְּדַאי לִפְרֹשׁ כְּשֶׁקָּשֶׁה"],"answer":2,"exp":"יוֹנָתָן כִּמְעַט וִתֵּר, אֲבָל שָׁאַל, הִתְאַמֵּן וְהִצְלִיחַ: \"טוֹב שֶׁלֹּא פָּרַשְׁתִּי\"."},{"type":"open","tag":"calc","expr":"55 + 29 = ___","answer":84,"exp":"⁦55 + 29 = 84⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"80 − 22 = ___","answer":58,"exp":"⁦80 − 22 = 58⁩. בְּדִיקָה: ⁦58 + 22 = 80⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"4 × 7 = ___","answer":28,"exp":"⁦4 × 7 = 28⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"45 : 9 = ___","answer":5,"exp":"⁦45 : 9 = 5⁩, כִּי ⁦9 × 5 = 45⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 32 = 69","answer":37,"exp":"⁦69 − 32 = 37⁩, וְלָכֵן ⁦37 + 32 = 69⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"60 − ___ = 29","answer":31,"exp":"⁦60 − 29 = 31⁩, וְלָכֵן ⁦60 − 31 = 29⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"7 × ___ = 12 + 23","answer":5,"exp":"⁦12 + 23 = 35⁩, ו־⁦7 × 5 = 35⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"74 − 8 < 74 − ___","min":0,"max":7,"exp":"כְּשֶׁמּוֹרִידִים פָּחוֹת, נִשְׁאַר יוֹתֵר. צָרִיךְ לְהוֹרִיד פָּחוֹת מ־8, לְמָשָׁל 7.","answer":7,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"△6 − 1△ = 50","options":["⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩","⁦△ = 7⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 6: 66 − 16 = 50⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"3 × △ + △ = 32","options":["⁦△ = 6⁩","⁦△ = 7⁩","⁦△ = 8⁩","⁦△ = 9⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 8: 3 × 8 + 8 = 32⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["star","star"],12],[["star","heart"],9],[["heart","circle"],5]],"ask":["circle"]},"options":["1","2","3","4"],"answer":1,"exp":"שְׁנֵי כּוֹכָבִים = 12, אָז כּוֹכָב = 6. לֵב = ⁦9 − 6 = 3⁩. עִגּוּל = ⁦5 − 3 = 2⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"33 יְלָדִים יוֹצְאִים לְטִיּוּל. בְּכָל מְכוֹנִית יֵשׁ מָקוֹם ל־5 יְלָדִים. כַּמָּה מְכוֹנִיּוֹת צָרִיךְ כְּדֵי שֶׁכָּל הַיְּלָדִים יִסְּעוּ?","options":["6","7","8","9"],"answer":1,"exp":"ב־6 מְכוֹנִיּוֹת יֵשׁ מָקוֹם ל־30 יְלָדִים, וְנִשְׁאָרִים עוֹד 3. לָכֵן צָרִיךְ עוֹד מְכוֹנִית: 7.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"בֶּחָצֵר שֶׁל רוֹעִי יֵשׁ 4 תַּרְנְגוֹלוֹת ו־3 כְּלָבִים. כַּמָּה רַגְלַיִם יֵשׁ לְכֻלָּם יַחַד?","options":["7","14","20","28"],"answer":2,"exp":"לְתַרְנְגֹלֶת 2 רַגְלַיִם: ⁦4 × 2 = 8⁩. לַכֶּלֶב 4 רַגְלַיִם: ⁦3 × 4 = 12⁩. בְּיַחַד: 20.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"בַּתּוֹר לִגְלִידָה עִדּוֹ עוֹמֵד בַּמָּקוֹם ה־7 מֵהַהַתְחָלָה. מֵאֲחוֹרָיו עוֹמְדִים עוֹד 8 יְלָדִים. כַּמָּה יְלָדִים יֵשׁ בַּתּוֹר?","options":["8","14","15","16"],"answer":2,"exp":"7 יְלָדִים עַד עִדּוֹ (כּוֹלֵל אוֹתוֹ), וְעוֹד 8 מֵאָחוֹר: ⁦7 + 8 = 15⁩.","id":"m14","sec":"math"}]},{"n":23,"level":"מאתגר","printable":true,"passages":[{"kind":"info","title":"הַתְּמָנוּן","lines":["הַתְּמָנוּן הוּא אֶחָד מִבַּעֲלֵי הַחַיִּים הַמַּפְתִּיעִים בְּיוֹתֵר בַּיָּם.","יֵשׁ לוֹ שְׁמוֹנָה זְרוֹעוֹת אֲרֻכּוֹת, וְעַל כָּל זְרוֹעַ יֵשׁ עֶשְׂרוֹת כַּפְתּוֹרֵי יְנִיקָה, שֶׁבְּעֶזְרָתָם הוּא נִצְמָד לַסְּלָעִים וְתוֹפֵס טֶרֶף.","לִתְמָנוּן אֵין עֲצָמוֹת בִּכְלָל, וְלָכֵן הוּא יָכוֹל לְהִשְׁתַּחֵל דֶּרֶךְ חֹר קָטָן מְאוֹד, בְּגֹדֶל שֶׁל מַטְבֵּעַ.","כְּשֶׁהַתְּמָנוּן מַרְגִּישׁ בְּסַכָּנָה, יֵשׁ לוֹ כַּמָּה דְּרָכִים לְהִנָּצֵל.","הוּא יָכוֹל לְשַׁנּוֹת אֶת הַצֶּבַע שֶׁל הָעוֹר שֶׁלּוֹ בְּתוֹךְ שְׁנִיָּה, וּלְהֵרָאוֹת בְּדִיּוּק כְּמוֹ הַסֶּלַע שֶׁעָלָיו הוּא נָח.","הוּא גַּם יָכוֹל לְשַׁחְרֵר עָנָן שֶׁל דְּיוֹ שָׁחֹר, שֶׁמַּסְתִּיר אוֹתוֹ, וְלִבְרֹחַ מַהֵר.","הַחוֹקְרִים גִּלּוּ שֶׁהַתְּמָנוּן חָכָם מְאוֹד. בַּמַּעְבָּדָה, תְּמָנוּנִים לָמְדוּ לִפְתֹּחַ צִנְצֶנֶת סְגוּרָה, כְּדֵי לְהוֹצִיא מִמֶּנָּה סַרְטָן.","יֵשׁ תְּמָנוּנִים שֶׁאוֹסְפִים קְלִפּוֹת שֶׁל אֱגוֹזֵי קוֹקוֹס אוֹ צְדָפוֹת, וּמִשְׁתַּמְּשִׁים בָּהֶן כְּמוֹ בְּמַחְבּוֹא נַיָּד.","לַמְרוֹת כָּל זֶה, רֹב הַתְּמָנוּנִים חַיִּים זְמַן קָצָר מְאוֹד: שָׁנָה אוֹ שְׁנָתַיִם בִּלְבַד."]},{"kind":"story","title":"הַשְּׁכֵנָה מֵהַקּוֹמָה הַשְּׁלִישִׁית","lines":["בַּבִּנְיָן שֶׁל מַעְיָן גָּרָה, בַּקּוֹמָה הַשְּׁלִישִׁית, אִשָּׁה מְבֻגֶּרֶת בְּשֵׁם חַנָּה.","מַעְיָן כִּמְעַט לֹא רָאֲתָה אוֹתָהּ. רַק לִפְעָמִים, בָּעֶרֶב, הָיָה אוֹר בַּחַלּוֹן שֶׁלָּהּ.","בַּחֹרֶף מַעְיָן שָׂמָה לֵב שֶׁעִתּוֹנִים מִצְטַבְּרִים מוּל הַדֶּלֶת שֶׁל חַנָּה, וְאַף אֶחָד לֹא לוֹקֵחַ אוֹתָם.","\"אוּלַי הִיא נָסְעָה?\" שָׁאֲלָה אֶת אַבָּא. \"אוּלַי,\" עָנָה אַבָּא, \"אֲבָל כְּדַאי לִבְדֹּק.\"","הֵם דָּפְקוּ בַּדֶּלֶת. אַחֲרֵי זְמַן אָרֹךְ נִשְׁמְעוּ צְעָדִים אִטִּיִּים, וְהַדֶּלֶת נִפְתְּחָה לְאַט.","חַנָּה עָמְדָה מוּלָם, נִשְׁעֶנֶת עַל מַקֵּל. \"שָׁבַרְתִּי אֶת הָרֶגֶל לִפְנֵי שְׁבוּעַיִם,\" הִסְבִּירָה, \"וְקָשֶׁה לִי לָרֶדֶת בַּמַּדְרֵגוֹת.\"","\"וּמִי קוֹנֶה לָךְ אֹכֶל?\" שָׁאֲלָה מַעְיָן בִּדְאָגָה. חַנָּה מָשְׁכָה בַּכְּתֵפַיִם. \"מָה שֶׁיֵּשׁ בַּבַּיִת.\"","בְּאוֹתוֹ עֶרֶב מַעְיָן וְאַבָּא הֵבִיאוּ לְחַנָּה מָרָק חַם וְלֶחֶם. מֵאָז מַעְיָן הֵבִיאָה לָהּ בְּכָל יוֹם אֶת הָעִתּוֹן, וְשָׁאֲלָה אִם הִיא צְרִיכָה מַשֶּׁהוּ.","בַּהַתְחָלָה מַעְיָן רַק נִכְנְסָה וְיָצְאָה. אֲבָל חַנָּה תָּמִיד בִּקְּשָׁה: \"שְׁבִי רֶגַע. סַפְּרִי לִי מָה שְׁלוֹמֵךְ.\"","מַעְיָן סִפְּרָה עַל בֵּית הַסֵּפֶר, וְחַנָּה סִפְּרָה אֵיךְ הִגִּיעָה לָאָרֶץ בָּאֳנִיָּה, כְּשֶׁהָיְתָה בְּגִיל שֶׁל מַעְיָן.","הִיא הֶרְאֲתָה לַמַּעְיָן תְּמוּנוֹת יְשָׁנוֹת, בְּשָׁחֹר וְלָבָן, וְלִמְּדָה אוֹתָהּ לִסְרֹג.","אַחֲרֵי חָדְשַׁיִם הָרֶגֶל שֶׁל חַנָּה הֶחְלִימָה, וְהִיא יָכְלָה לָרֶדֶת בַּמַּדְרֵגוֹת בְּעַצְמָהּ.","מַעְיָן חָשְׁשָׁה שֶׁעַכְשָׁו כְּבָר לֹא תִּהְיֶה לָהּ סִבָּה לָבוֹא.","אֲבָל בְּיוֹם שִׁשִּׁי נִשְׁמְעָה דְּפִיקָה בַּדֶּלֶת. חַנָּה עָמְדָה שָׁם, עִם צַלַּחַת עוּגִיּוֹת וְצָעִיף סָרוּג בְּצֶבַע סָגֹל.","\"עַכְשָׁו תּוֹרִי לְבַקֵּר,\" אָמְרָה וְחִיְּכָה."]}],"questions":[{"id":"r1","sec":"read","p":0,"tag":"d","type":"mc","q":"כַּמָּה זְרוֹעוֹת יֵשׁ לִתְמָנוּן?","options":["אַרְבַּע","שְׁמוֹנָה","עָשָׂר","שֵׁשׁ"],"answer":1,"exp":"בְּשׁוּרָה 2 כָּתוּב שֶׁיֵּשׁ לִתְמָנוּן שְׁמוֹנָה זְרוֹעוֹת."},{"id":"r2","sec":"read","p":0,"tag":"i","type":"mc","q":"מָה מְאַפְשֵׁר לִתְמָנוּן לַעֲבֹר דֶּרֶךְ חֹר קָטָן מְאוֹד?","options":["שֶׁהוּא מְשַׁנֶּה צֶבַע","שֶׁיֵּשׁ לוֹ שְׁמוֹנָה זְרוֹעוֹת","שֶׁהוּא מְשַׁחְרֵר דְּיוֹ","שֶׁאֵין לוֹ עֲצָמוֹת בִּכְלָל"],"answer":3,"exp":"בְּשׁוּרָה 3 כָּתוּב: אֵין לוֹ עֲצָמוֹת, \"וְלָכֵן\" הוּא יָכוֹל לְהִשְׁתַּחֵל דֶּרֶךְ חֹר קָטָן."},{"id":"r3","sec":"read","p":0,"tag":"p","type":"mc","q":"לָמָּה כָּתוּב בְּשׁוּרָה 4 \"יֵשׁ לוֹ כַּמָּה דְּרָכִים לְהִנָּצֵל\"?","options":["כִּי הַתְּמָנוּן אוֹכֵל כַּמָּה סוּגִים שֶׁל טֶרֶף","כִּי הַתְּמָנוּן חַי בְּכַמָּה יָמִים","כִּי לִתְמָנוּן יֵשׁ כַּמָּה בָּתִּים","כִּי אַחַר כָּךְ מְתֹאָרוֹת דְּרָכִים שֶׁבָּהֶן הַתְּמָנוּן מֵגֵן עַל עַצְמוֹ"],"answer":3,"exp":"בְּשׁוּרוֹת 5–6 מְתֹאָרוֹת הַדְּרָכִים: שִׁנּוּי צֶבַע וְעָנָן שֶׁל דְּיוֹ."},{"id":"r4","sec":"read","p":0,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ \"מַחֲבוֹא נַיָּד\" (שׁוּרָה 8)?","options":["צַעֲצוּעַ שֶׁל תְּמָנוּן","קְלִפָּה שֶׁאוֹכְלִים","מָקוֹם לְהִתְחַבֵּא בּוֹ, שֶׁאֶפְשָׁר לָקַחַת מִמָּקוֹם לְמָקוֹם","בַּיִת שֶׁבָּנוּי עַל סֶלַע"],"answer":2,"exp":"\"נַיָּד\" פֵּרוּשׁוֹ שֶׁאֶפְשָׁר לְהָזִיז אוֹתוֹ. הַתְּמָנוּן לוֹקֵחַ אֶת הַקְּלִפָּה אִתּוֹ וּמִתְחַבֵּא בָּהּ."},{"id":"r5","sec":"read","p":0,"tag":"n","type":"mc","q":"עַל אֵיזוֹ שְׁאֵלָה אֵין תְּשׁוּבָה בַּקֶּטַע?","options":["מָה צֶבַע הַדְּיוֹ שֶׁל הַתְּמָנוּן?","כַּמָּה זְמַן חַיִּים רֹב הַתְּמָנוּנִים?","בְּמָה הַתְּמָנוּן מִשְׁתַּמֵּשׁ כְּדֵי לְהִצָּמֵד לַסְּלָעִים?","כַּמָּה בֵּיצִים מְטִילָה נְקֵבַת הַתְּמָנוּן?"],"answer":3,"exp":"הַקֶּטַע לֹא מְסַפֵּר עַל הַבֵּיצִים שֶׁל הַתְּמָנוּן."},{"id":"r6","sec":"read","p":1,"tag":"d","type":"mc","q":"מָה גָּרַם לְמַעֲיָן לַחֲשֹׁב שֶׁמַּשֶּׁהוּ לֹא בְּסֵדֶר אֵצֶל חַנָּה?","options":["חַנָּה צָעֲקָה לְעֶזְרָה","הַדֶּלֶת שֶׁלָּהּ הָיְתָה פְּתוּחָה","עִתּוֹנִים הִצְטַבְּרוּ מוּל הַדֶּלֶת שֶׁלָּהּ","הָאוֹר בַּחַלּוֹן דֶּלֶק כָּל הַלַּיְלָה"],"answer":2,"exp":"בְּשׁוּרָה 3 מַעְיָן שָׂמָה לֵב שֶׁהָעִתּוֹנִים מִצְטַבְּרִים, וְאַף אֶחָד לֹא לוֹקֵחַ אוֹתָם."},{"id":"r7","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה אַבָּא אָמַר \"כְּדַאי לִבְדֹּק\" (שׁוּרָה 4)?","options":["כִּי אוּלַי חַנָּה צְרִיכָה עֶזְרָה","כִּי חַנָּה בִּקְּשָׁה מִמֶּנּוּ","כְּדֵי לְנַקּוֹת אֶת הַמַּדְרֵגוֹת","כִּי הוּא רָצָה לִקְרֹא אֶת הָעִתּוֹנִים"],"answer":0,"exp":"אִם הָעִתּוֹנִים מִצְטַבְּרִים, אוּלַי קָרָה מַשֶּׁהוּ – וְאַבָּא רָצָה לְוַדֵּא שֶׁחַנָּה בְּסֵדֶר."},{"id":"r8","sec":"read","p":1,"tag":"i","type":"mc","q":"מָה אֶפְשָׁר לְהָבִין מֵהַתְּשׁוּבָה שֶׁל חַנָּה \"מָה שֶׁיֵּשׁ בַּבַּיִת\" (שׁוּרָה 7)?","options":["שֶׁאֵין מִי שֶׁיִּקְנֶה לָהּ אֹכֶל, וְהִיא מִסְתַּדֶּרֶת עִם מָה שֶׁנִּשְׁאַר","שֶׁמַּעְיָן קוֹנֶה לָהּ אֹכֶל כָּל יוֹם","שֶׁיֵּשׁ לָהּ הַרְבֵּה אֹכֶל","שֶׁהִיא לֹא אוֹהֶבֶת לֶאֱכֹל"],"answer":0,"exp":"חַנָּה לֹא יְכוֹלָה לָרֶדֶת בַּמַּדְרֵגוֹת, וְאֵין מִי שֶׁיִּקְנֶה לָהּ – אָז הִיא אוֹכֶלֶת רַק מָה שֶׁנִּשְׁאַר בַּבַּיִת."},{"id":"r9","sec":"read","p":1,"tag":"w","type":"mc","q":"מָה פֵּרוּשׁ הַמִּלָּה \"הַחֲלִימָה\" (שׁוּרָה 12)?","options":["נִרְפְּאָה וְהַבְּרִיאָה","הִתְאָרְכָה","נִשְׁבְּרָה שׁוּב","כָּאֲבָה מְאוֹד"],"answer":0,"exp":"הָרֶגֶל הֶחְלִימָה – נִרְפְּאָה – וְחַנָּה יָכְלָה שׁוּב לָרֶדֶת בַּמַּדְרֵגוֹת."},{"id":"r10","sec":"read","p":1,"tag":"i","type":"mc","q":"לָמָּה חַנָּה בִּקְּשָׁה מִמַּעְיַן \"שְׁבִי רֶגַע\"?","options":["כִּי הִיא רָצְתָה שֶׁמַּעְיָן תִּסְרֹג בִּשְׁבִילָהּ","כִּי הִיא הָיְתָה בּוֹדֵדָה, וּשְׂמֵחָה לַחֶבְרָה","כִּי הִיא הָיְתָה עֲיֵפָה מְאוֹד","כִּי הִיא רָצְתָה לָתֵת לָהּ שִׁעוּרֵי בַּיִת"],"answer":1,"exp":"חַנָּה גָּרָה לְבַד וְלֹא יָצְאָה מֵהַבַּיִת. הִיא שְׂמֵחָה שֶׁמִּישֶׁהוּ יוֹשֵׁב אִתָּהּ וּמְדַבֵּר."},{"id":"r11","sec":"read","p":1,"tag":"p","type":"mc","q":"לָמָּה מַעְיָן חָשְׁשָׁה שֶׁכְּבָר לֹא תִּהְיֶה לָהּ סִבָּה לָבוֹא (שׁוּרָה 13)?","options":["כִּי אַבָּא אָסַר עָלֶיהָ לָבוֹא","כִּי חַנָּה עוֹבֶרֶת דִּירָה","כִּי חַנָּה כְּבָר לֹא צְרִיכָה אֶת הָעֶזְרָה שֶׁלָּהּ","כִּי נִגְמְרוּ הָעִתּוֹנִים"],"answer":2,"exp":"הָרֶגֶל שֶׁל חַנָּה הֶחְלִימָה, וְהִיא יְכוֹלָה לְהִסְתַּדֵּר לְבַד. מַעְיָן חָשְׁשָׁה שֶׁהַבִּקּוּרִים יִגָּמְרוּ."},{"id":"r12","sec":"read","p":1,"tag":"r","type":"mc","q":"לְמָה מִתְכַּוֶּנֶת חַנָּה כְּשֶׁהִיא אוֹמֶרֶת \"עַכְשָׁו תּוֹרִי לְבַקֵּר\" (שׁוּרָה 15)?","options":["שֶׁהִיא רוֹצָה לִבְדֹּק אִם מְעַיֵּן בַּבַּיִת","שֶׁגַּם הִיא רוֹצָה לְהַמְשִׁיךְ אֶת הַחֲבָרוֹת, וּלְבַקֵּר אֶת מַעְיָן","שֶׁהִיא מְחַפֶּשֶׂת עִתּוֹנִים","שֶׁהִיא צְרִיכָה עוֹד עֶזְרָה"],"answer":1,"exp":"מַעְיָן בִּקְּרָה אֶת חַנָּה הַרְבֵּה פְּעָמִים. עַכְשָׁו חַנָּה בָּאָה לְבַקֵּר – הַחֲבֵרוּת מַמְשִׁיכָה."},{"type":"open","tag":"calc","expr":"56 + 39 = ___","answer":95,"exp":"⁦56 + 39 = 95⁩","id":"m1","sec":"math"},{"type":"open","tag":"calc","expr":"80 − 38 = ___","answer":42,"exp":"⁦80 − 38 = 42⁩. בְּדִיקָה: ⁦42 + 38 = 80⁩","id":"m2","sec":"math"},{"type":"open","tag":"calc","expr":"7 × 9 = ___","answer":63,"exp":"⁦7 × 9 = 63⁩","id":"m3","sec":"math"},{"type":"open","tag":"calc","expr":"36 : 9 = ___","answer":4,"exp":"⁦36 : 9 = 4⁩, כִּי ⁦9 × 4 = 36⁩","id":"m4","sec":"math"},{"type":"open","tag":"missing","expr":"___ + 24 = 61","answer":37,"exp":"⁦61 − 24 = 37⁩, וְלָכֵן ⁦37 + 24 = 61⁩","id":"m5","sec":"math"},{"type":"open","tag":"missing","expr":"85 − ___ = 71","answer":14,"exp":"⁦85 − 71 = 14⁩, וְלָכֵן ⁦85 − 14 = 71⁩","id":"m6","sec":"math"},{"type":"open","tag":"missing","expr":"9 × ___ = 30 + 42","answer":8,"exp":"⁦30 + 42 = 72⁩, ו־⁦9 × 8 = 72⁩","id":"m7","sec":"math"},{"type":"ineq","tag":"ineq","expr":"32 + 15 > 15 + ___","min":0,"max":31,"exp":"⁦32 + 15⁩ זֶה כְּמוֹ ⁦15 + 32⁩. צָרִיךְ מִסְפָּר קָטָן מ־32, לְמָשָׁל 31.","answer":31,"id":"m8","sec":"math"},{"type":"mc","tag":"tri","expr":"3 × △ + △ = 12","options":["⁦△ = 1⁩","⁦△ = 2⁩","⁦△ = 3⁩","⁦△ = 4⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 3: 3 × 3 + 3 = 12⁩ ✓","id":"m9","sec":"math"},{"type":"mc","tag":"tri","expr":"△5 + 3△ = 90","options":["⁦△ = 3⁩","⁦△ = 4⁩","⁦△ = 5⁩","⁦△ = 6⁩"],"answer":2,"exp":"נְצִיב ⁦△ = 5: 55 + 35 = 90⁩ ✓","id":"m10","sec":"math"},{"type":"mc","tag":"pic","pic":{"eqs":[[["heart","heart"],8],[["heart","square"],13],[["square","star"],12]],"ask":["star"]},"options":["2","3","4","5"],"answer":1,"exp":"שְׁנֵי לְבָבוֹת = 8, אָז לֵב = 4. רִבּוּעַ = ⁦13 − 4 = 9⁩. כּוֹכָב = ⁦12 − 9 = 3⁩.","id":"m11","sec":"math"},{"type":"mc","tag":"word","text":"כַּרְטִיס לְיֶלֶד לְהַצָּגָה עוֹלֶה 8 ₪, וְכַרְטִיס לִמְבֻגָּר עוֹלֶה 13 ₪. כַּמָּה יַעֲלוּ כַּרְטִיסִים ל־2 יְלָדִים וְלִ2 מְבֻגָּרִים?","options":["29","32","42","52"],"answer":2,"exp":"יְלָדִים: ⁦2 × 8 = 16⁩. מְבֻגָּרִים: ⁦2 × 13 = 26⁩. בְּיַחַד: 42 ₪.","id":"m12","sec":"math"},{"type":"mc","tag":"word","text":"עוּגִיָּה עוֹלָה 3 ₪, וְשׁוֹקוֹ עוֹלֶה 12 ₪. יוֹנָתָן קָנָה 2 עוּגִיּוֹת וְשׁוֹקוֹ אֶחָד. כַּמָּה שִׁלֵּם?","options":["15","18","27","30"],"answer":1,"exp":"2 עוּגִיּוֹת: ⁦3 + 3 = 6⁩. וְעוֹד שׁוֹקוֹ: ⁦6 + 12 = 18⁩ ₪.","id":"m13","sec":"math"},{"type":"mc","tag":"word","text":"יוֹאָב קוֹרֵא סֵפֶר. בַּיּוֹם הָרִאשׁוֹן קָרָא 8 עַמּוּדִים. בְּכָל יוֹם הוּא קָרָא 4 עַמּוּדִים יוֹתֵר מֵאֲשֶׁר בַּיּוֹם הַקּוֹדֵם. כַּמָּה עַמּוּדִים קָרָא בְּסַךְ הַכֹּל בִּשְׁלוֹשָׁה יָמִים?","options":["16","24","28","36"],"answer":3,"exp":"יוֹם ⁦1: 8⁩, יוֹם ⁦2: 12⁩, יוֹם ⁦3: 16⁩. בְּיַחַד: 36.","id":"m14","sec":"math"}]}],"instr":{"calc":"הַשְׁלִימִי אֶת הַמִּסְפָּר הֶחָסֵר, כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן.","missing":"הַשְׁלִימִי אֶת הַמִּסְפָּר הֶחָסֵר, כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן.","ineq":"כִּתְבִי מִסְפָּר מַתְאִים, כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן. יֵשׁ כַּמָּה תְּשׁוּבוֹת נְכוֹנוֹת!","tri":"כָּל △ מַסְתִּיר אֶת אוֹתָהּ סִפְרָה. אֵיזוֹ סִפְרָה צְרִיכָה לִהְיוֹת בִּמְקוֹם △, כְּדֵי שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן?","pic":"כָּל צִיּוּר מְסַמֵּן מִסְפָּר. צִיּוּרִים זֵהִים מְסַמְּנִים אֶת אוֹתוֹ מִסְפָּר. כַּמָּה שָׁוֶה מָה שֶׁיֵּשׁ בַּשּׁוּרָה עִם סִימַן הַשְּׁאֵלָה?","word":"קִרְאִי אֶת הַבְּעָיָה וּבַחֲרִי אֶת הַתְּשׁוּבָה הַנְּכוֹנָה.","read":"קִרְאִי אֶת הַקֶּטַע, וּבַחֲרִי אֶת הַתְּשׁוּבָה הַנְּכוֹנָה."},"instrP":{"calc":"הַשְׁלִימוּ אֶת הַמִּסְפָּר הֶחָסֵר, כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן.","ineq":"כִּתְבוּ מִסְפָּר מַתְאִים, כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן. יֵשׁ כַּמָּה תְּשׁוּבוֹת נְכוֹנוֹת.","tri":"כָּל △ מַסְתִּיר אֶת אוֹתָהּ סִפְרָה. הַקִּיפוּ אֶת הַסִּפְרָה שֶׁצְּרִיכָה לִהְיוֹת בִּמְקוֹם △, כְּדֵי שֶׁהַתַ let S;

load();
const T = n => DATA.tests.find(t => t.n === n);
function ts(n){ return S.tests[n] || null; }
function stat(n){
  const t = T(n), st = ts(n);
  if (t.printable){ const p = S.printed[n]; return p ? {state:'done', score:p.score, total:p.total, pct:100} : {state:'new', pct:0}; }
  const total = t.questions.length;
  if (!st) return {state:'new', pct:0, total};
  const a = st.ans || {}; let done = 0, ok = 0, rOk = 0, mOk = 0;
  t.questions.forEach(q => { const x = a[q.id]; if (x && x.done) done++; if (x && x.firstOk){ ok++; if (q.sec === 'read') rOk++; else mOk++; } });
  const pct = Math.round(100 * done / total);
  return {state: done === total ? 'done' : 'prog', pct, score: ok, total, rOk, mOk, rTot: t.questions.filter(q => q.sec === 'read').length, mTot: t.questions.filter(q => q.sec === 'math').length};
}

function nextSuggestion(){
  const dl = daysLeft();

function allDone(t){ const st = S.tests[t.n]; return t.questions.every(q => st.ans[q.id] && st.ans[q.id].done); }

  <div class="card"><h2>סיכום ציונים</h2>${chart}<p class="small muted">ציון = שאלות שנענו נכון בניסיון הראשון. בטאבלט רוני מקבלת ניסיון שני, ואחריו מוצגת התשובה הנכונה עם הסבר.</p>
  ${aggRows ? `<h3>לפי סוג שאלה (כל המבחנים)</h3><table><tr><th>סוג</th><th>נכון</th><th></th><th>%</th></tr>${aggRows}</table>` : ''}</div>
  <div class="card" style="margin-top:14px"><h2>כל המבחנים</h2><div style="overflow-x:auto"><table><tr><th>#</th><th>רמה</th><th>תאריך</th><th>תוצאה</th><th>פעולות</th></tr>${rows}</table></div>
  <div class="row" style="margin-top:12px"><button class="btn sm danger" data-a="resetall">איפוס של כל ההתקדמות</button></div></div>
  <div class="card" style="margin-top:14px"><h2>הגדרות</h2>
   <div class="switch"><div>ניקוד בטקסטים<div class="small muted">במבחן האמיתי הטקסט מנוקד. מומלץ להשאיר פועל.</div></div><button class="btn sm ${S.settings.niqqud ? 'primary' : ''}" data-a="toggleniq">${S.settings.niqqud ? 'פועל' : 'כבוי'}</button></div>
   <div class="switch"><div>שעון עדין (20 דקות לכל חלק)</div><button class="btn sm ${S.settings.timer ? 'primary' : ''}" data-a="toggletimer">${S.settings.timer ? 'פועל' : 'כבוי'}</button></div></div>
  <div class="card" style="margin-top:14px"><h2>על המבנה</h2><p class="small">כל מבחן בנוי כמו מבחן שלב א׳ של ראמ״ה: חלק א׳ – שני קטעים מנוקדים עם שורות ממוספרות (קטע מידע עם 5 שאלות וסיפור עם 7 שאלות, כולן רב־ברירה עם 4 תשובות); חלק ב׳ – 14 שאלות חשבון: 8 תשובות פתוחות (תרגילים, מספר חסר, אי־שוויון) ו־6 רב־ברירה (משולשים, חידת ציורים, בעיות מילוליות). משרד החינוך לא פרסם רשמית את מספר השאלות והזמן; המבנה מבוסס על מבחן תשפ״ה שפורסם (12 שאלות קריאה + 14 חשבון, לפי ניתוח שפורסם) ועל חוברת הדוגמה הרשמית. המבחנים נעשים קשים יותר בהדרגה: 1–7 קל, 8–14 בינוני, 15–23 מאתגר. כל התכנים נכתבו במיוחד ואינם מבחן רשמי.</p>
  <p class="small muted">ההתקדמות נשמרת רק בטאבלט הזה ובדפדפן הזה. מחיקת נתוני גלישה תמחק אותה.</p></div></div>`;
}
let gateQ = null;
function gateHTML(target){
  if (!gateQ){ const a = 12 + Math.floor(Math.random() * 8), b = 3 + Math.floor(Math.random() * 7); gateQ = {a, b, ans: a * b}; }
  return `<div class="wrap"><div class="top"><button class="btn sm" data-a="home">→ חזרה</button></div><div class="card center" style="max-width:520px;margin:30px auto">
   <h2>שאלה להורים 🔒</h2><p>כדי להיכנס, פתרו: <span class="math" style="font-size:34px">${gateQ.a} × ${gateQ.b} = ?</span></p>
   <input class="inp" id="gatein" inputmode="numeric" pattern="[0-9]*" autocomplete="off"> <button class="btn primary" data-a="gate" data-t="${target}">כניסה</button><div id="gerr" class="muted" style="margin-top:8px"></div></div></div>`;
}
function modal(html){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; m.addEventListener('click', e => { if (e.target === m) m.remove(); }); document.body.appendChild(m); return m; }
function confirmGate(text, fn){
  const a = 12 + Math.floor(Math.random() * 8), b = 3 + Math.floor(Math.random() * 7);
  const m = modal(`<h2>🔒 להורים בלבד</h2><p>${text}</p><p>לאישור, פתרו: <span class="math" style="font-size:30px">${a} × ${b} = ?</span></p><div class="row"><input class="inp" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><button class="btn danger">אישור</button><button class="btn" data-x>ביטול</button></div><div class="muted gerr"></div>`);
  const inp = m.querySelector('input'); inp.focus();
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('.danger').onclick = () => { if (+inp.value === a * b){ m.remove(); fn(); } else m.querySelector('.gerr').textContent = 'לא נכון, נסו שוב.'; };
}
function resetTest(n){ delete S.tests[n]; delete S.printed[n]; save(); render(); }
function openPdf(n, k){
  const b64 = (PDFS[n] || {})[k]; if (!b64){ alert('הקובץ לא נמצא'); return; }
  const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], {type: 'application/pdf'}));
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.download = k === 'key' ? `מחוננים-רונית-מבחן-${n}-מפתח-תשובות.pdf` : `מחוננים-רונית-מבחן-${n}.pdf`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function enterScore(n){
  const m = modal(`<h2>ציון מבחן ${n} (על דף)</h2><p class="small muted">בודקים לפי מפתח התשובות ומזינים כמה נכון.</p>
   <div class="row"><label>הבנת הנקרא: <input class="inp" id="sr" inputmode="numeric" pattern="[0-9]*"> / 12</label></div>
   <div class="row" style="margin-top:8px"><label>חשבון: <input class="inp" id="sm" inputmode="numeric" pattern="[0-9]*"> / 14</label></div>
   <div class="row" style="margin-top:14px"><button class="btn primary">שמירה</button><button class="btn" data-x>ביטול</button></div><div class="muted gerr"></div>`);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('.primary').onclick = () => { const r = +m.querySelector('#sr').value, mm = +m.querySelector('#sm').value;
    if (!(r >= 0 && r <= 12 && mm >= 0 && mm <= 14) || m.querySelector('#sr').value === '' || m.querySelector('#sm').value === ''){ m.querySelector('.gerr').textContent = 'בדקו את המספרים'; return; }
    S.printed[n] = {score: r + mm, total: 26, r, m: mm, at: Date.now()}; save(); m.remove(); render(); };
}
// ---------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, n = +el.dataset.n, k = el.dataset.k;
  if (a === 'home') return go({name:'home'});
  if (a === 'open') return go({name:'intro', n});
  if (a === 'start') return startTest(n);
  if (a === 'tips') return go({name:'tips'});
  if (a === 'parent'){ gateQ = null; return go({name:'parent'}); }
  if (a === 'finish') return go({name:'finish', n});
  if (a === 'review') return go({name:'review', n, unlocked: V.unlocked});
  if (a === 'toggletimer'){ S.settings.timer = !S.settings.timer; save(); return render(); }
  if (a === 'toggleniq'){ S.settings.niqqud = !S.settings.niqqud; save(); return render(); }
  if (a === 'pick'){ const {q} = cur(); return answer(+k === q.answer, +k); }
  if (a === 'key'){ V.flash = false; if (k === 'del') V.entry = (V.entry || '').slice(0, -1); else if ((V.entry || '').length < 3) V.entry = (V.entry || '') + k; const s = document.getElementById('slot'); if (s){ s.textContent = V.entry || '\u00a0'; s.classList.remove('wrong'); } return; }
  if (a === 'check'){ const {q} = cur(); if (!V.entry) return; const v = +V.entry; const ok = q.type === 'ineq' ? (v >= q.min && v <= q.max) : v === q.answer; return answer(ok, v); }
  if (a === 'next' || a === 'prev' || a === 'jump'){
    const {t, st} = cur(); let i = V.i;
    if (a === 'prev') i = Math.max(0, i - 1);
    else if (a === 'jump') i = +k;
    else { if (i < t.questions.length - 1) i++; else { const f = t.questions.findIndex(q => !(st.ans[q.id] && st.ans[q.id].done)); if (f < 0) return go({name:'finish', n: t.n}); i = f; } }
    const keepT = timerH; V = Object.assign({}, V, {i, entry:'', flash:false}); if (timerH){ clearInterval(timerH); timerH = null; } render(); window.scrollTo(0, 0); return;
  }
  if (a === 'gate'){ const v = +document.getElementById('gatein').value; if (v === gateQ.ans){ V.unlocked = true; gateQ = null; return render(); } document.getElementById('gerr').textContent = 'לא נכון, נסו שוב.'; return; }
  if (a === 'askreset') { e.stopPropagation(); return confirmGate(`לאפס את מבחן ${n}? כל התשובות והציון של המבחן יימחקו.`, () => resetTest(n)); }
  if (a === 'doreset') return confirmGate(`לאפס את מבחן ${n}? כל התשובות והציון של המבחן יימחקו.`, () => resetTest(n));
  if (a === 'resetall') return confirmGate('לאפס את כל ההתקדמות בכל המבחנים?', () => { S.tests = {}; S.printed = {}; save(); render(); });
  if (a === 'pdf') return openPdf(n, k);
  if (a === 'enterscore') return enterScore(n);
});
document.addEventListener('keydown', e => { if (V.name === 'parent' && !V.unlocked && e.key === 'Enter'){ const b = document.querySelector('[data-a=gate]'); if (b) b.click(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
